<script>
/*
 * Bar - Spese & Cassa: codice della pagina.
 * ATTENZIONE: solo JavaScript ES5 (niente let/const, arrow function,
 * template literal, fetch, Promise, async/await) per funzionare anche
 * sul Safari dei vecchi iPad.
 */
(function () {
  'use strict';

  var CHIAVE_PIN = 'barSpeseCassa.pin';
  var CHIAVE_CODA = 'barSpeseCassa.coda';
  var CHIAVE_LISTE = 'barSpeseCassa.liste';
  var CHIAVE_PERSONA = 'barSpeseCassa.persona';
  var CHIAVE_RIEPILOGO = 'barSpeseCassa.riepilogoSezione';
  var CHIAVE_COPERTURA = 'barSpeseCassa.coperturaPeriodo';
  var CHIAVE_ORDINATI = 'barSpeseCassa.prodottiOrdinati';
  var LATO_MAX_FOTO = 1200;
  var QUALITA_FOTO = 0.7;
  var LATO_MAX_FOTO_CODA = 1000; // le foto in attesa di invio vengono rimpicciolite ancora
  var QUALITA_FOTO_CODA = 0.6;
  var MAX_PDF_BYTE = 10 * 1024 * 1024;
  var ATTESA_MAX_MS = 60000;
  var ATTESA_SALVATAGGIO_MS = 45000; // più dei 30 secondi che il server aspetta per il lock
  var ATTESA_SALVATAGGIO_FILE_MS = 90000;
  var INTERVALLO_CODA_MS = 45000;
  var MSG_RETE = 'Non riesco a collegarmi a internet.\n' +
    'Controlla il Wi-Fi o i dati mobili e premi «Riprova».\n' +
    'Quello che hai scritto non è stato perso.';
  var MSG_RETE_CODA = 'Non riesco ancora a collegarmi a internet.\n' +
    'I dati restano salvati sul dispositivo: riprovo da solo tra poco.';
  var MSG_SPAZIO_FINITO = 'Non riesco a salvare sul dispositivo: lo spazio è finito ' +
    'oppure il browser non lo permette (per esempio in navigazione privata).\n\n' +
    'Scrivi la spesa su un foglio e inseriscila quando torna internet, oppure premi «Riprova».';

  var stato = {
    pin: '',
    pinDigitato: '',
    categorie: [],
    fornitori: [],
    fornitoriRecenti: [],
    pagamenti: [],
    persone: [],
    persona: '',
    personaSaltata: false,
    categoria: '',
    pagamento: '',
    file: '',
    fileTipo: '',
    fileNome: '',
    idSpesa: '',
    idChiusura: '',
    idScadenza: '',
    frequenza: '',
    scadenzeVicine: 0,
    daOrdinare: 0,
    tolleranzaCassa: 5,
    haccpDaFare: 0,
    haccp: null,
    saldo: null,
    ordineFornitori: 'daPagare',
    tipoMovimento: '',
    idMovimento: '',
    marginiBassi: 0,
    riepilogo: null,        // ultimi dati del Riepilogo (le sezioni si disegnano all'apertura)
    riepilogoDisegnate: {},
    riepilogoSezione: '',   // ultima sezione aperta, ricordata sul dispositivo
    copertura: null,        // «Spese coperte dai ricavi»: periodo, filtro e ultimo risultato
    margini: null,
    ordineMargini: 'basso',
    prodottoMargine: null,
    riordino: null,
    rapido: null,           // aggiunta rapida aperta nella scheda di un fornitore: { fornitore, nodo, campo }
    evidenziato: '',        // prodotto appena aggiunto, da evidenziare un attimo
    prodottoSubito: true,
    anno: 0,
    mese: 0,
    schermo: '',
    modifica: null,         // spesa in modifica: { id, foto }
    fotoAzione: 'tieni',    // in modifica: 'tieni' o 'togli' lo scontrino già salvato
    modificaChiusura: '',   // ID della chiusura in modifica
    tornaA: '',             // dopo una modifica: 'elenco' o 'riepilogo'
    elenco: { tipo: 'spese', mese: '', categoria: '', pagamento: '', testo: '', persona: '' }
  };

  var SCHERMI = ['schermo-avvio', 'schermo-pin', 'schermo-home', 'schermo-spesa',
    'schermo-chiusura', 'schermo-riepilogo', 'schermo-coda', 'schermo-elenco', 'schermo-persona',
    'schermo-scadenze', 'schermo-nuova-scadenza', 'schermo-ordini', 'schermo-nuovo-prodotto', 'schermo-haccp',
    'schermo-fornitori', 'schermo-fornitore', 'schermo-scadenze-fisse',
    'schermo-movimenti', 'schermo-margini', 'schermo-prodotto-margine',
    'schermo-spese', 'schermo-cassa', 'schermo-altro'];
  var NOMI_FREQUENZE = [
    { valore: '', nome: 'Una volta sola' }, { valore: 'mensile', nome: 'Ogni mese' },
    { valore: 'bimestrale', nome: 'Ogni 2 mesi' }, { valore: 'trimestrale', nome: 'Ogni 3 mesi' },
    { valore: 'quadrimestrale', nome: 'Ogni 4 mesi' }, { valore: 'semestrale', nome: 'Ogni 6 mesi' },
    { valore: 'annuale', nome: 'Ogni anno' }
  ];
  var PANNELLI = ['pannello-attesa', 'pannello-errore', 'pannello-conferma', 'pannello-salvato',
    'pannello-in-coda'];

  /** Icona SVG (stesso stile di quelle in Index.html) da mettere nei pulsanti creati dal codice. */
  function icona(disegno, lato) {
    return '<svg viewBox="0 0 24 24" width="' + (lato || 20) + '" height="' + (lato || 20) + '" aria-hidden="true" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + disegno + '</svg>';
  }
  var ICONA_CESTINO = icona('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>');
  var ICONA_MATITA = icona('<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>');
  var ICONA_SPUNTA = icona('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
  var ICONA_INDIETRO = icona('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>');
  var ICONA_FRECCIA_DESTRA = icona('<path d="M9 5l7 7-7 7"/>', 22);
  var ICONA_INVIA = icona('<path d="M12 19V6M6 11l6-6 6 6"/>');
  var ICONA_CHAT = icona('<path d="M21 12a8.5 8.5 0 0 1-12.5 7.5L3 21l1.5-5A8.5 8.5 0 1 1 21 12z"/>', 22);

  var campoDataSupportato = supportaCampoData();
  var bisognaRuotareFoto = false;

  // -------------------------------------------------------------------------
  // Piccole utilità
  // -------------------------------------------------------------------------

  function $(id) { return document.getElementById(id); }

  function setTesto(el, testo) {
    if ('textContent' in el) el.textContent = testo; else el.innerText = testo;
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function due(n) { return (n < 10 ? '0' : '') + n; }

  /** Permette di andare a capo dopo "/" (es. "Carta/Bancomat") per non uscire dai pulsanti. */
  function testoACapo(s) { return String(s).replace(/\//g, '/\u200B'); }

  function trim(s) { return String(s === undefined || s === null ? '' : s).replace(/^\s+|\s+$/g, ''); }

  function euro(n) {
    n = Number(n) || 0;
    var negativo = n < 0;
    var parti = Math.abs(n).toFixed(2).split('.');
    var intero = parti[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (negativo ? '- ' : '') + intero + ',' + parti[1] + ' €';
  }

  /** "12,50" / "1.234,50" / "12.5" → numero; null se non valido. */
  function leggiImporto(testo) {
    var s = String(testo || '').replace(/[€\s]/g, '');
    if (!s) return null;
    if (s.indexOf(',') >= 0) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, '');
    }
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    return Math.round(parseFloat(s) * 100) / 100;
  }

  function supportaCampoData() {
    var i = document.createElement('input');
    try { i.setAttribute('type', 'date'); } catch (e) { return false; }
    return i.type === 'date';
  }

  function dataDiOggi() {
    var d = new Date();
    if (campoDataSupportato) return d.getFullYear() + '-' + due(d.getMonth() + 1) + '-' + due(d.getDate());
    return due(d.getDate()) + '/' + due(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function nuovoId(prefisso) {
    return (prefisso || 'S') + new Date().getTime().toString(36) + '-' + Math.floor(Math.random() * 1e9).toString(36);
  }

  /** "2026-10-09" → "09/10/2026" (le date scritte a mano restano come sono). */
  function dataLeggibile(s) {
    var r = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(trim(s));
    return r ? due(+r[3]) + '/' + due(+r[2]) + '/' + r[1] : trim(s);
  }

  /** 12.5 → "12,50" (per rimettere un importo in un campo da modificare). */
  function numeroPerCampo(n) {
    return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2).replace('.', ',');
  }

  /** "2026-10-09" nel formato giusto per il campo data di questo browser. */
  function dataPerCampo(iso) {
    return campoDataSupportato ? iso : dataLeggibile(iso);
  }

  function riempiSelect(sel, opzioni, scelto) {
    var html = '';
    perOgni(opzioni, function (o) {
      html += '<option value="' + esc(o.valore) + '"' + (o.valore === scelto ? ' selected' : '') + '>' + esc(o.nome) + '</option>';
    });
    sel.innerHTML = html;
  }

  function filtra(elenco, condizione) {
    var out = [];
    perOgni(elenco, function (x) { if (condizione(x)) out.push(x); });
    return out;
  }

  function senzaInternet() {
    try { return navigator.onLine === false; } catch (e) { return false; }
  }

  function aggiungiEvento(el, tipo, funzione) {
    if (el.addEventListener) el.addEventListener(tipo, funzione, false);
    else el.attachEvent('on' + tipo, funzione);
  }

  function perOgni(elenco, funzione) {
    for (var i = 0; i < elenco.length; i++) funzione(elenco[i], i);
  }

  // -------------------------------------------------------------------------
  // PIN ricordato sul dispositivo (se il browser lo permette)
  // -------------------------------------------------------------------------

  function leggiPinSalvato() {
    try { return window.localStorage.getItem(CHIAVE_PIN) || ''; } catch (e) { return ''; }
  }
  function ricordaPin(pin) {
    try { window.localStorage.setItem(CHIAVE_PIN, pin); } catch (e) { /* non disponibile */ }
  }
  function dimenticaPin() {
    try { window.localStorage.removeItem(CHIAVE_PIN); } catch (e) { /* non disponibile */ }
  }

  // -------------------------------------------------------------------------
  // Schermate e pannelli
  // -------------------------------------------------------------------------

  function vaiInCima() {
    try { $('cima').scrollIntoView(true); } catch (e) { /* niente */ }
    try { window.scrollTo(0, 0); } catch (e2) { /* niente */ }
  }

  function mostra(id) {
    chiudiPannelli();
    ricordaPaginaMadre(id);
    stato.schermo = id;
    if (id === 'schermo-home') {
      aggiornaPersonaHome();
      aggiornaContatoreScadenze();
      aggiornaContatoreOrdini();
      aggiornaContatoreHaccp();
      aggiornaContatoreMargini();
    }
    if (id === 'schermo-home' || id === 'schermo-spese') aggiornaStatoHome();
    if (id === 'schermo-altro') aggiornaAltro();
    perOgni(SCHERMI, function (s) { $(s).style.display = (s === id) ? 'block' : 'none'; });
    // Nome della sezione corrente nell'intestazione
    setTesto($('testata-sezione'), $(id).getAttribute('data-titolo') || '');
    aggiornaNavigazione();
    aggiornaBarraCoda();
    vaiInCima();
  }

  function mostraPannello(id) {
    $('schermi').style.display = 'none';
    $('barra-coda').style.display = 'none';
    perOgni(PANNELLI, function (p) { $(p).style.display = (p === id) ? 'block' : 'none'; });
    aggiornaNavigazione();
    vaiInCima();
  }

  function chiudiPannelli() {
    perOgni(PANNELLI, function (p) { $(p).style.display = 'none'; });
    $('schermi').style.display = 'block';
    aggiornaNavigazione();
    aggiornaBarraCoda();
  }

  // -------------------------------------------------------------------------
  // Barra in basso e pagine madri (solo navigazione: nessun dato, nessuna chiamata)
  // -------------------------------------------------------------------------

  /** Le cinque schede della barra in basso. */
  var SCHEDE = ['schermo-home', 'schermo-spese', 'schermo-cassa', 'schermo-riepilogo', 'schermo-altro'];
  /** Schermate senza barra: accesso e moduli (così non si perde quello che si sta scrivendo). */
  var SENZA_BARRA = ['schermo-avvio', 'schermo-pin', 'schermo-persona', 'schermo-spesa', 'schermo-chiusura',
    'schermo-nuova-scadenza', 'schermo-nuovo-prodotto', 'schermo-prodotto-margine'];
  var GIORNI_SETTIMANA = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
  var NOMI_MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto',
    'settembre', 'ottobre', 'novembre', 'dicembre'];
  var navigazione = { scheda: 'schermo-home', madre: {} };

  /** La scheda attiva cambia solo aprendo una delle cinque; le altre pagine ricordano da dove si è arrivati. */
  function ricordaPaginaMadre(id) {
    if (indiceDi(SCHEDE, id) >= 0) {
      navigazione.scheda = id;
    } else if (stato.schermo !== id && indiceDi(SCHEDE, stato.schermo) >= 0) {
      navigazione.madre[id] = stato.schermo;
    }
  }

  /** «Indietro»: alla pagina da cui si è arrivati, altrimenti a quella scritta nel pulsante. */
  function tornaSu(pulsante) {
    mostra(navigazione.madre[stato.schermo] || pulsante.getAttribute('data-su') || 'schermo-home');
  }

  function aggiornaNavigazione() {
    var barra = $('navigazione');
    if (!barra) return;
    var visibile = !!stato.schermo && $('schermi').style.display !== 'none' && indiceDi(SENZA_BARRA, stato.schermo) < 0;
    barra.style.display = visibile ? 'block' : 'none';
    document.body.className = visibile ? 'con-navigazione' : '';
    perOgni(barra.getElementsByTagName('button'), function (b) {
      var attiva = b.getAttribute('data-scheda') === navigazione.scheda;
      b.className = attiva ? 'attiva' : '';
      if (attiva) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  /** Righe «Da tenere d'occhio» della home (e il numerino delle scadenze nella pagina Spese). */
  function aggiornaStatoHome() {
    var oggi = new Date();
    setTesto($('home-data'), GIORNI_SETTIMANA[oggi.getDay()] + ' ' + oggi.getDate() + ' ' + NOMI_MESI[oggi.getMonth()]);
    var haccp = Number(stato.haccpDaFare) || 0;
    var scadenze = Number(stato.scadenzeVicine) || 0;
    var ordini = Number(stato.daOrdinare) || 0;
    var margini = Number(stato.marginiBassi) || 0;
    setTesto($('home-haccp-stato'), haccp ? 'Da fare oggi' : 'Niente da fare per ora');
    $('home-haccp-ok').style.display = haccp ? 'none' : 'inline-block';
    setTesto($('home-scadenze-stato'), scadenze ? 'Da pagare a breve' : 'Nessun pagamento vicino');
    $('home-scadenze-ok').style.display = scadenze ? 'none' : 'inline-block';
    setTesto($('home-ordini-stato'), ordini ? (ordini === 1 ? 'Prodotto in lista' : 'Prodotti in lista') : 'La lista è vuota');
    setTesto($('home-margini-stato'), margini ? 'Sotto la soglia minima' : 'Costo e guadagno dei prodotti');
    var numero = $('spese-scadenze-numero');
    setTesto(numero, String(scadenze));
    numero.style.display = scadenze ? 'inline-block' : 'none';
  }

  function aggiornaAltro() {
    var coda = leggiCoda().length;
    $('altro-coda').style.display = coda ? 'block' : 'none';
    setTesto($('altro-coda-numero'), String(coda));
    $('altro-persona').style.display = stato.persone.length ? 'block' : 'none';
    var nome = personaValida();
    setTesto($('altro-persona-testo'), nome ? 'Sei ' + nome + ' · tocca per cambiare' : 'Nessun nome scelto');
  }

  /** «Cerca e modifica» aperto dalla pagina Spese o Cassa: mostra subito il tipo giusto. */
  function apriElencoDi(tipo) {
    if (stato.elenco.tipo !== tipo) {
      stato.elenco = { tipo: tipo, mese: stato.elenco.mese, categoria: '', pagamento: '', testo: '', persona: stato.elenco.persona };
    }
    apriElenco();
  }

  /** Pulsanti «Mostra altro»: aprono e chiudono i dettagli secondari. */
  function collegaMostraAltro(b) {
    var testoChiuso = trim(b.textContent || b.innerText || '');
    var testoAperto = testoChiuso === 'Mostra altro' ? 'Mostra meno' : testoChiuso === 'Filtri' ? 'Nascondi i filtri' : 'Nascondi';
    var imposta = function (aperto) {
      $(b.getAttribute('data-mostra')).style.display = aperto ? 'block' : 'none';
      setTesto(b, aperto ? testoAperto : testoChiuso);
      b.setAttribute('aria-expanded', aperto ? 'true' : 'false');
    };
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-controls', b.getAttribute('data-mostra'));
    b.onclick = function () { imposta(b.getAttribute('aria-expanded') !== 'true'); };
    b.apri = function () { imposta(true); };
  }

  function apriDettagli(idPulsante) {
    var b = $(idPulsante);
    if (b && b.apri) b.apri();
  }

  function mostraAttesa(testo) {
    setTesto($('attesa-testo'), testo || 'Attendere…');
    mostraPannello('pannello-attesa');
  }

  /** Errore con "Riprova" (se riprova è una funzione) oppure solo "Ho capito". */
  function mostraErrore(testo, riprova, seAnnulla) {
    $('errore-testo').innerHTML = esc(testo).replace(/\n/g, '<br>');
    var bRiprova = $('errore-riprova');
    var bChiudi = $('errore-chiudi');
    if (riprova) {
      bRiprova.style.display = 'block';
      bRiprova.onclick = function () { riprova(); };
      setTesto(bChiudi, 'Annulla');
    } else {
      bRiprova.style.display = 'none';
      setTesto(bChiudi, 'Ho capito');
    }
    bChiudi.onclick = function () {
      numeroChiamata++; // ignora eventuali risposte arrivate in ritardo
      chiudiPannelli();
      if (seAnnulla) seAnnulla();
    };
    mostraPannello('pannello-errore');
  }

  function chiedi(testo, testoSi, testoNo, seSi) {
    $('conferma-testo').innerHTML = esc(testo).replace(/\n/g, '<br>');
    setTesto($('conferma-si'), testoSi || 'Sì');
    // Rosso solo per le azioni che tolgono qualcosa; le altre conferme sono il pulsante principale
    $('conferma-si').className = /elimin|esci|svuota|sostituisc/i.test(testoSi || '') ? 'pericolo' : 'primario';
    setTesto($('conferma-no'), testoNo || 'No');
    $('conferma-si').onclick = function () { chiudiPannelli(); seSi(); };
    $('conferma-no').onclick = function () { chiudiPannelli(); };
    mostraPannello('pannello-conferma');
  }

  function mostraSalvato(testo, poi) {
    setTesto($('salvato-testo'), testo || 'Salvato ✓');
    mostraPannello('pannello-salvato');
    setTimeout(function () {
      chiudiPannelli();
      if (poi) poi(); else mostra('schermo-home');
    }, 1600);
  }

  // -------------------------------------------------------------------------
  // Chiamate al server (google.script.run) con gestione degli errori di rete
  // -------------------------------------------------------------------------

  var numeroChiamata = 0;
  // Funzioni del server che non modificano i dati (le altre azzerano la copia già arrivata di «Spese coperte dai ricavi»)
  var SOLA_LETTURA = ['avvio', 'riepilogo', 'coperturaSpese', 'elenco', 'scadenze', 'scadenzeFisse', 'saldoFornitori',
    'riordino', 'margini', 'movimentiCassa', 'controlliHaccp'];

  /**
   * Chiama una funzione del server mostrando "Attendere…".
   * opzioni: attesa (testo), attesaMs, seAnnulla, seNo(risposta),
   * seRete: se c'è, viene chiamata al posto del messaggio di errore quando
   * manca internet (serve per mettere i salvataggi nella coda offline).
   */
  function chiama(funzione, argomenti, seOk, opzioni) {
    opzioni = opzioni || {};
    var numero = ++numeroChiamata;
    var scaduta = false;
    var riprova = function () { chiama(funzione, argomenti, seOk, opzioni); };
    var problemaDiRete = function () {
      if (opzioni.seRete) {
        numeroChiamata++; // un'eventuale risposta in ritardo viene ignorata (la coda evita i doppioni)
        chiudiPannelli();
        opzioni.seRete();
      } else {
        mostraErrore(MSG_RETE, riprova, opzioni.seAnnulla);
      }
    };

    mostraAttesa(opzioni.attesa);

    var timer = setTimeout(function () {
      if (numero !== numeroChiamata) return;
      scaduta = true;
      problemaDiRete();
    }, opzioni.attesaMs || ATTESA_MAX_MS);

    var esecutore = google.script.run
      .withSuccessHandler(function (risposta) {
        clearTimeout(timer);
        // Se nel frattempo è partita un'altra chiamata, questa risposta non serve più.
        if (numero !== numeroChiamata) return;
        chiudiPannelli();
        if (risposta && risposta.ok && SOLA_LETTURA.indexOf(funzione) < 0) svuotaCacheCopertura();   // i dati sono cambiati
        gestisciRisposta(risposta, seOk, opzioni, riprova);
        // La rete funziona: se c'è qualcosa in attesa, lo invio.
        if (leggiCoda().length) setTimeout(function () { inviaCoda(false); }, 800);
      })
      .withFailureHandler(function () {
        clearTimeout(timer);
        if (numero !== numeroChiamata || scaduta) return;
        problemaDiRete();
      });
    esecutore[funzione].apply(esecutore, argomenti);
  }

  function gestisciRisposta(r, seOk, opzioni, riprova) {
    if (!r) {
      mostraErrore('Risposta vuota. Riprova.', riprova, opzioni.seAnnulla);
      return;
    }
    if (r.ok) {
      seOk(r);
      return;
    }
    if (r.pinErrato) {
      dimenticaPin();
      stato.pin = '';
      mostraSchermoPin(r.messaggio || 'PIN sbagliato.');
      return;
    }
    if (opzioni.seNo && opzioni.seNo(r)) return;
    mostraErrore(r.messaggio || 'Si è verificato un problema.', r.tecnico ? riprova : null, opzioni.seAnnulla);
  }

  // -------------------------------------------------------------------------
  // Avvio e PIN
  // -------------------------------------------------------------------------

  function avvia() {
    stato.pin = leggiPinSalvato();
    if (stato.pin) caricaDati(); else mostraSchermoPin('');
  }

  function caricaDati() {
    // Senza internet si entra solo con il PIN già verificato e ricordato su questo dispositivo.
    var salvate = stato.pin && stato.pin === leggiPinSalvato() ? leggiListeSalvate() : null;
    chiama('avvio', [stato.pin], function (r) {
      usaListe(r);
      ricordaPin(stato.pin);
      salvaListe(r);
      vaiAllaHome();
      inviaCoda(false);
    }, {
      attesa: 'Apertura…',
      attesaMs: salvate ? 20000 : ATTESA_MAX_MS,
      seAnnulla: function () { mostraSchermoPin(''); },
      // Senza internet ma con il PIN e gli elenchi già salvati: si possono
      // comunque scrivere spese e chiusure (finiscono nella coda offline).
      seRete: salvate ? function () {
        usaListe(salvate);
        vaiAllaHome();
        mostraErrore('Non c\'è internet in questo momento.\n' +
          'Puoi scrivere spese e chiusure: restano sul dispositivo e vengono inviate da sole quando torna la connessione.');
      } : null
    });
  }

  function usaListe(r) {
    stato.categorie = r.categorie || [];
    stato.fornitori = r.fornitori || [];
    stato.fornitoriRecenti = r.fornitoriRecenti || [];
    stato.pagamenti = r.pagamenti || [];
    stato.persone = r.persone || [];
    stato.persona = leggiPersonaSalvata();
    if (r.tolleranzaCassa !== undefined && r.tolleranzaCassa !== null) stato.tolleranzaCassa = Number(r.tolleranzaCassa) || 0;
    if (r.scadenzeVicine !== undefined) stato.scadenzeVicine = r.scadenzeVicine;
    if (r.daOrdinare !== undefined) stato.daOrdinare = r.daOrdinare;
    if (r.haccpDaFare !== undefined) stato.haccpDaFare = r.haccpDaFare;
    if (r.marginiBassi !== undefined) stato.marginiBassi = r.marginiBassi;
    disegnaScelteSpesa();
  }

  /** Categorie, fornitori e pagamenti ricordati sul dispositivo (per lavorare senza internet). */
  function salvaListe(r) {
    try {
      window.localStorage.setItem(CHIAVE_LISTE, JSON.stringify({
        categorie: r.categorie || [], fornitori: r.fornitori || [], fornitoriRecenti: r.fornitoriRecenti || [], pagamenti: r.pagamenti || [],
        persone: r.persone || [], tolleranzaCassa: r.tolleranzaCassa
      }));
    } catch (e) { /* non indispensabile */ }
  }

  function leggiListeSalvate() {
    try {
      var l = JSON.parse(window.localStorage.getItem(CHIAVE_LISTE) || 'null');
      return l && l.categorie && l.categorie.length ? l : null;
    } catch (e) { return null; }
  }

  function mostraSchermoPin(messaggio) {
    stato.pinDigitato = '';
    aggiornaPuntiniPin();
    setTesto($('pin-messaggio'), messaggio || '');
    mostra('schermo-pin');
  }

  function aggiornaPuntiniPin() {
    var s = '';
    for (var i = 0; i < 4; i++) s += i < stato.pinDigitato.length ? '●' : '○';
    setTesto($('pin-puntini'), s);
  }

  function premiTastoPin(cifra) {
    if (cifra === 'C') {
      stato.pinDigitato = stato.pinDigitato.substring(0, stato.pinDigitato.length - 1);
    } else if (cifra === 'X') {
      stato.pinDigitato = '';
    } else if (stato.pinDigitato.length < 4) {
      stato.pinDigitato += cifra;
    }
    setTesto($('pin-messaggio'), '');
    aggiornaPuntiniPin();
    if (stato.pinDigitato.length === 4) {
      stato.pin = stato.pinDigitato;
      setTimeout(caricaDati, 150);
    }
  }

  // -------------------------------------------------------------------------
  // Chi sta usando l'app (nome ricordato sul dispositivo)
  // -------------------------------------------------------------------------

  function leggiPersonaSalvata() {
    try { return window.localStorage.getItem(CHIAVE_PERSONA) || ''; } catch (e) { return ''; }
  }

  function ricordaPersona(nome) {
    stato.persona = nome;
    try { window.localStorage.setItem(CHIAVE_PERSONA, nome); } catch (e) { /* non disponibile */ }
  }

  /** Nome valido solo se è ancora nella scheda Persone. */
  function personaValida() {
    return stato.persona && indiceDi(stato.persone, stato.persona) >= 0 ? stato.persona : '';
  }

  function indiceDi(elenco, valore) {
    for (var i = 0; i < elenco.length; i++) if (elenco[i] === valore) return i;
    return -1;
  }

  /** Home, chiedendo prima il nome se ci sono persone e non è ancora stato scelto. */
  function vaiAllaHome() {
    if (stato.persone.length && !personaValida() && !stato.personaSaltata) {
      mostraSceltaPersona();
    } else {
      mostra('schermo-home');
    }
  }

  /** Scelta del nome; "dopo" (facoltativa) è la funzione da chiamare dopo la scelta (altrimenti la home). */
  function mostraSceltaPersona(dopo) {
    var contenitore = $('persona-scelte');
    contenitore.innerHTML = '';
    perOgni(stato.persone, function (nome) {
      var b = document.createElement('button');
      b.type = 'button';
      setTesto(b, nome);
      if (nome === personaValida()) b.className = 'scelto';
      b.onclick = function () {
        ricordaPersona(nome);
        if (typeof dopo === 'function') dopo(); else mostra('schermo-home');
      };
      contenitore.appendChild(b);
    });
    mostra('schermo-persona');
  }

  function aggiornaPersonaHome() {
    var riquadro = $('home-persona');
    if (!stato.persone.length) {
      riquadro.style.display = 'none';
      return;
    }
    var nome = personaValida();
    $('home-persona-testo').innerHTML = nome ? 'Sei <b>' + esc(nome) + '</b>' : 'Non hai scelto il tuo nome';
    setTesto($('home-persona-cambia'), nome ? 'Cambia' : 'Sceglilo');
    riquadro.style.display = 'block';
  }

  // -------------------------------------------------------------------------
  // Nuova spesa
  // -------------------------------------------------------------------------

  function disegnaScelteSpesa(fornitore) {
    // In modifica la spesa può avere una categoria che non c'è più nell'elenco: la mostro lo stesso.
    var categorie = stato.categorie.slice();
    if (stato.categoria && categorie.indexOf(stato.categoria) < 0) categorie.push(stato.categoria);
    disegnaPulsanti($('spesa-categorie'), categorie, function () { return stato.categoria; },
      function (v) { stato.categoria = v; });
    disegnaPulsanti($('spesa-pagamenti'), stato.pagamenti, function () { return stato.pagamento; },
      function (v) { stato.pagamento = v; aggiornaScadenzaSpesa(); });
    riempiFornitori(fornitore || '');
  }

  function disegnaPulsanti(contenitore, valori, leggi, scrivi) {
    contenitore.innerHTML = '';
    perOgni(valori, function (valore) {
      var b = document.createElement('button');
      b.type = 'button';
      setTesto(b, testoACapo(valore));
      if (leggi() === valore) b.className = 'scelto';
      b.onclick = function () {
        scrivi(valore);
        perOgni(contenitore.getElementsByTagName('button'), function (altro) { altro.className = ''; });
        b.className = 'scelto';
      };
      contenitore.appendChild(b);
    });
  }

  // INIZIO ricerca fornitori (funzioni pure, provate anche da prove/test-fornitori-ricerca-testo.js)

  var LETTERE_SENZA_ACCENTO = { 'à': 'a', 'á': 'a', 'â': 'a', 'ã': 'a', 'ä': 'a', 'å': 'a', 'è': 'e', 'é': 'e', 'ê': 'e', 'ë': 'e',
    'ì': 'i', 'í': 'i', 'î': 'i', 'ï': 'i', 'ò': 'o', 'ó': 'o', 'ô': 'o', 'õ': 'o', 'ö': 'o', 'ù': 'u', 'ú': 'u', 'û': 'u', 'ü': 'u',
    'ý': 'y', 'ÿ': 'y', 'ç': 'c', 'ñ': 'n' };

  /** Minuscolo, senza accenti e con un solo spazio tra le parole: «  CAFFÈ   Rossi » → «caffe rossi». */
  function normalizzaNome(testo) {
    var t = String(testo === undefined || testo === null ? '' : testo).toLowerCase();
    t = t.replace(/[àáâãäåèéêëìíîïòóôõöùúûüýÿçñ]/g, function (c) { return LETTERE_SENZA_ACCENTO[c]; });
    return t.replace(/\s+/g, ' ').replace(/^ | $/g, '');
  }

  /** Fornitori che contengono il testo: prima quelli che iniziano così, poi gli altri (massimo «massimo»). */
  function cercaFornitori(elenco, testo, massimo) {
    var q = normalizzaNome(testo);
    if (!q) return [];
    var inizio = [];
    var altri = [];
    for (var i = 0; i < elenco.length; i++) {
      var posizione = normalizzaNome(elenco[i]).indexOf(q);
      if (posizione === 0) inizio.push(elenco[i]);
      else if (posizione > 0) altri.push(elenco[i]);
    }
    return inizio.concat(altri).slice(0, massimo || 8);
  }

  /** Il fornitore già in elenco con lo stesso nome (senza badare a maiuscole, accenti e spazi), oppure ''. */
  function fornitoreEsistente(elenco, testo) {
    var q = normalizzaNome(testo);
    if (!q) return '';
    for (var i = 0; i < elenco.length; i++) {
      if (normalizzaNome(elenco[i]) === q) return elenco[i];
    }
    return '';
  }

  // FINE ricerca fornitori

  // INIZIO ricerca prodotti (funzioni pure, provate anche da prove/test-ordini-rapido.js)

  var MAX_SUGGERIMENTI_PRODOTTO = 6;

  function prodottiDelFornitore(prodotti, fornitore) {
    var f = normalizzaNome(fornitore);
    var risultato = [];
    for (var i = 0; i < prodotti.length; i++) {
      if (normalizzaNome(prodotti[i].fornitore) === f) risultato.push(prodotti[i]);
    }
    return risultato;
  }

  /** Prodotti di quel fornitore che contengono il testo (prima quelli che iniziano così), massimo 6. */
  function cercaProdotti(prodotti, fornitore, testo, massimo) {
    var q = normalizzaNome(testo);
    if (!q) return [];
    var suoi = prodottiDelFornitore(prodotti, fornitore);
    var inizio = [];
    var altri = [];
    for (var i = 0; i < suoi.length; i++) {
      var posizione = normalizzaNome(suoi[i].nome).indexOf(q);
      if (posizione === 0) inizio.push(suoi[i]);
      else if (posizione > 0) altri.push(suoi[i]);
    }
    return inizio.concat(altri).slice(0, massimo || MAX_SUGGERIMENTI_PRODOTTO);
  }

  /** Il prodotto di quel fornitore con lo stesso nome (senza badare a maiuscole, accenti e spazi), oppure null. */
  function prodottoEsistente(prodotti, fornitore, testo) {
    var q = normalizzaNome(testo);
    if (!q) return null;
    var suoi = prodottiDelFornitore(prodotti, fornitore);
    for (var i = 0; i < suoi.length; i++) {
      if (normalizzaNome(suoi[i].nome) === q) return suoi[i];
    }
    return null;
  }

  /** Quantità dopo un'aggiunta: 1 se non era in lista, altrimenti +1. */
  function quantitaDopoAggiunta(p) {
    return p.daOrdinare ? (Number(p.quantita) || 0) + 1 : 1;
  }

  /** L'unità più usata tra i prodotti del fornitore ('' se nessuno ne ha una). */
  function unitaPredefinita(prodotti, fornitore) {
    var suoi = prodottiDelFornitore(prodotti, fornitore);
    var conteggio = {};
    var migliore = '';
    for (var i = 0; i < suoi.length; i++) {
      var u = suoi[i].unita;
      if (!u) continue;
      conteggio[u] = (conteggio[u] || 0) + 1;
      if (conteggio[u] > (conteggio[migliore] || 0)) migliore = u;
    }
    return migliore;
  }

  /** Prodotti del fornitore non ancora in lista, i più ordinati per primi (conteggi: id → volte), massimo 6. */
  function piuOrdinati(prodotti, fornitore, conteggi, massimo) {
    var liberi = [];
    var suoi = prodottiDelFornitore(prodotti, fornitore);
    for (var i = 0; i < suoi.length; i++) {
      if (!suoi[i].daOrdinare) liberi.push(suoi[i]);
    }
    liberi.sort(function (a, b) {
      var d = (conteggi[b.id] || 0) - (conteggi[a.id] || 0);
      if (d) return d;
      return normalizzaNome(a.nome) < normalizzaNome(b.nome) ? -1 : 1;
    });
    return liberi.slice(0, massimo || MAX_SUGGERIMENTI_PRODOTTO);
  }

  // FINE ricerca prodotti

  // INIZIO unità al singolare e al plurale (funzioni pure, provate anche da prove/test-unita-plurale.js)

  var UNITA_INVARIABILI = { kg: 1, g: 1, gr: 1, hg: 1, mg: 1, l: 1, lt: 1, dl: 1, cl: 1, ml: 1, m: 1, mt: 1, cm: 1, mm: 1,
    pz: 1, cf: 1, conf: 1, bar: 1 };
  var PLURALI_IRREGOLARI = { paio: 'paia', uovo: 'uova', dito: 'dita' };

  /** Plurale di una parola (già in minuscolo) con le regole italiane più comuni. */
  function pluraleParola(w) {
    if (!w || UNITA_INVARIABILI[w.replace(/\./g, '')] === 1) return w;
    if (PLURALI_IRREGOLARI[w] && typeof PLURALI_IRREGOLARI[w] === 'string') return PLURALI_IRREGOLARI[w];
    if (!/[aeo]$/.test(w)) return w;   // consonante, punto, vocale accentata, -i, -u: non cambia (bar, caffè, kg)
    var senzaUltima = w.substring(0, w.length - 1);
    if (/a$/.test(w)) {
      if (/[cg]ia$/.test(w)) {
        // arancia → arance, valigia → valigie, camicia → camicie
        return /[aeiou]/.test(w.charAt(w.length - 4)) ? senzaUltima + 'e' : w.substring(0, w.length - 2) + 'e';
      }
      if (/ia$/.test(w)) return senzaUltima + 'e';                 // bottiglia → bottiglie
      if (/[cg]a$/.test(w)) return senzaUltima + 'he';             // barca → barche
      return senzaUltima + 'e';                                    // cassa → casse
    }
    if (/o$/.test(w)) {
      if (/io$/.test(w)) return senzaUltima;                       // vassoio → vassoi, fascio → fasci
      if (/[cg]o$/.test(w)) return senzaUltima + 'hi';             // sacco → sacchi
      return senzaUltima + 'i';                                    // sacchetto → sacchetti
    }
    return /ie$/.test(w) ? w : senzaUltima + 'i';                  // confezione → confezioni; serie resta serie
  }

  /** Plurale di un'unità scritta liberamente: cambia solo la prima parola («cassa da 24» → «casse da 24»). */
  function pluraleUnita(unita) {
    var parole = trim(unita).toLowerCase().split(/\s+/);
    parole[0] = pluraleParola(parole[0]);
    return parole.join(' ');
  }

  // Nel foglio le unità sono spesso già scritte al plurale («casse», «cartoni»): per queste parole comuni si conosce
  // il singolare, così restano giuste con 3 e diventano «cassa», «cartone» con 1.
  var UNITA_COMUNI = ['cassa', 'cassetta', 'cartone', 'pezzo', 'bottiglia', 'scatola', 'scatolone', 'pacco', 'pacchetto',
    'sacchetto', 'sacco', 'fusto', 'fustino', 'confezione', 'bustina', 'busta', 'lattina', 'latta', 'litro', 'collo',
    'vaschetta', 'rotolo', 'barattolo', 'mazzo', 'flacone', 'bicchiere', 'vassoio', 'fascio', 'paio', 'uovo', 'bidone',
    'tanica', 'stecca', 'cestino', 'tavoletta', 'tubo', 'bombola', 'cassettina', 'sacchettino', 'bottiglietta'];
  var SINGOLARE_DEL_PLURALE = {};
  (function () {
    for (var i = 0; i < UNITA_COMUNI.length; i++) SINGOLARE_DEL_PLURALE[pluraleParola(UNITA_COMUNI[i])] = UNITA_COMUNI[i];
  })();

  /** L'unità come va scritta con quella quantità: singolare con 1, altrimenti il plurale (quello scelto nel foglio, se c'è). */
  function unitaPerQuantita(unita, quantita, pluraleScelto) {
    var u = trim(unita);
    if (!u) return '';
    var minuscolo = u.toLowerCase();
    var giaPlurale = SINGOLARE_DEL_PLURALE.hasOwnProperty(minuscolo);
    if (Number(quantita) === 1) return giaPlurale ? SINGOLARE_DEL_PLURALE[minuscolo] : u;
    if (trim(pluraleScelto)) return trim(pluraleScelto);
    return giaPlurale ? minuscolo : pluraleUnita(u);
  }

  // FINE unità al singolare e al plurale

  var MAX_SUGGERIMENTI_FORNITORE = 8;
  var temporizzatoreFornitore = null;

  function riempiFornitori(selezionato) {
    $('spesa-fornitore').value = selezionato || '';
    chiudiSuggerimentiFornitore();
    aggiornaNotaFornitoreNuovo();
  }

  /** Testo scritto nel campo con gli spazi in ordine; se combacia con un fornitore esistente, usa quello. */
  function fornitoreScelto() {
    var t = trim($('spesa-fornitore').value).replace(/\s+/g, ' ');
    return fornitoreEsistente(stato.fornitori, t) || t;
  }

  function chiudiSuggerimentiFornitore() {
    $('fornitore-suggerimenti').style.display = 'none';
    $('fornitore-recenti').style.display = 'none';
  }

  function aggiornaNotaFornitoreNuovo() {
    var testo = trim($('spesa-fornitore').value);
    var aperto = $('fornitore-suggerimenti').style.display === 'block';
    $('fornitore-nuovo-nota').style.display =
      testo && !aperto && !fornitoreEsistente(stato.fornitori, testo) ? 'block' : 'none';
  }

  function scegliFornitore(nome) {
    $('spesa-fornitore').value = nome;
    chiudiSuggerimentiFornitore();
    aggiornaNotaFornitoreNuovo();
    try { $('spesa-fornitore').blur(); } catch (e) { /* niente */ }
  }

  function bottoneFornitore(testo, classe, nome) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    setTesto(b, testo);
    // Toccare un suggerimento non deve togliere il focus al campo prima del tocco vero e proprio.
    b.onmousedown = function (e) { if (e && e.preventDefault) e.preventDefault(); };
    b.onclick = function () { scegliFornitore(nome); };
    return b;
  }

  /** Elenco sotto al campo: suggerimenti mentre si scrive, fornitori recenti a campo vuoto. */
  function mostraSuggerimentiFornitore() {
    var testo = trim($('spesa-fornitore').value).replace(/\s+/g, ' ');
    var box = $('fornitore-suggerimenti');
    var recenti = $('fornitore-recenti');
    box.innerHTML = '';
    recenti.innerHTML = '';
    if (!testo) {
      box.style.display = 'none';
      perOgni(stato.fornitoriRecenti.slice(0, 5), function (f) { recenti.appendChild(bottoneFornitore(f, '', f)); });
      recenti.style.display = stato.fornitoriRecenti.length ? 'block' : 'none';
      aggiornaNotaFornitoreNuovo();
      return;
    }
    recenti.style.display = 'none';
    perOgni(cercaFornitori(stato.fornitori, testo, MAX_SUGGERIMENTI_FORNITORE), function (f) {
      box.appendChild(bottoneFornitore(f, '', f));
    });
    if (!fornitoreEsistente(stato.fornitori, testo)) {
      box.appendChild(bottoneFornitore('Aggiungi "' + testo + '" come nuovo fornitore', 'nuovo', testo));
    }
    box.style.display = box.getElementsByTagName('button').length ? 'block' : 'none';
    aggiornaNotaFornitoreNuovo();
  }

  /** Su telefono la tastiera sale: porto il campo in alto, così restano visibili campo ed elenco. */
  function portaInVistaFornitore() {
    try {
      var r = $('spesa-fornitore').getBoundingClientRect();
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      if (r.top < 80 || r.top > 150) window.scrollTo(0, Math.max(0, y + r.top - 110));
    } catch (e) { /* niente */ }
  }

  function collegaRicercaFornitore() {
    var campo = $('spesa-fornitore');
    campo.onfocus = function () {
      if (temporizzatoreFornitore) clearTimeout(temporizzatoreFornitore);
      mostraSuggerimentiFornitore();
      setTimeout(portaInVistaFornitore, 300);
      setTimeout(portaInVistaFornitore, 800);
    };
    campo.oninput = function () {
      mostraSuggerimentiFornitore();
      portaInVistaFornitore();
    };
    campo.onblur = function () {
      // Un attimo di attesa: il tocco su un suggerimento deve arrivare prima che l'elenco sparisca.
      temporizzatoreFornitore = setTimeout(function () {
        chiudiSuggerimentiFornitore();
        aggiornaNotaFornitoreNuovo();
      }, 350);
    };
    campo.onkeydown = function (e) {
      var tasto = e ? (e.keyCode || e.which) : 0;
      if (tasto === 13 || tasto === 27) {
        if (e.preventDefault) e.preventDefault();
        chiudiSuggerimentiFornitore();
        aggiornaNotaFornitoreNuovo();
        try { campo.blur(); } catch (e2) { /* niente */ }
      }
    };
  }

  function azzeraSpesa() {
    $('spesa-data').value = dataDiOggi();
    $('spesa-importo').value = '';
    $('spesa-nota').value = '';
    $('spesa-scadenza').value = '';
    stato.categoria = '';
    stato.pagamento = '';
    stato.idSpesa = '';
    stato.modifica = null;
    stato.fotoAzione = 'tieni';
    togliFile();
    disegnaScelteSpesa();
    aggiornaModoSpesa();
    aggiornaScadenzaSpesa();
  }

  /** Data di oggi + n giorni, nel formato giusto per il campo data di questo browser. */
  function dataTraGiorni(n) {
    var d = new Date();
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12, 0, 0);
    return dataPerCampo(d.getFullYear() + '-' + due(d.getMonth() + 1) + '-' + due(d.getDate()));
  }

  /** Nota per chi ha già pagato e link «Togli la data» (visibile solo se la data è scritta). */
  function aggiornaScadenzaSpesa() {
    var giaPagata = stato.pagamento === 'Contanti' || stato.pagamento === 'Carta/Bancomat';
    $('spesa-scadenza-nota').style.display = giaPagata ? 'block' : 'none';
    $('spesa-scadenza-togli-riga').style.display = trim($('spesa-scadenza').value) ? 'block' : 'none';
  }

  function scadenzaSpesaValida(testo) {
    return !testo || /^\d{4}-\d{1,2}-\d{1,2}$/.test(testo) || /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(testo);
  }

  function apriSpesa() {
    // Se il modulo è vuoto riparte da zero (con la data di oggi);
    // se c'era qualcosa di scritto lo lascia com'è. Una modifica lasciata a metà non si riprende.
    if (stato.modifica || (!trim($('spesa-importo').value) && !stato.file)) azzeraSpesa();
    mostra('schermo-spesa');
  }

  /** Apre il modulo della spesa con i dati di una spesa già salvata. */
  function apriModificaSpesa(sp, tornaA) {
    azzeraSpesa();
    stato.modifica = { id: sp.id, foto: sp.foto || '' };
    stato.tornaA = tornaA || '';
    $('spesa-data').value = dataPerCampo(sp.dataIso);
    $('spesa-importo').value = numeroPerCampo(sp.importo);
    $('spesa-nota').value = sp.nota || '';
    $('spesa-scadenza').value = sp.scadenzaIso ? dataPerCampo(sp.scadenzaIso) : '';
    stato.categoria = sp.categoria || '';
    stato.pagamento = sp.pagamento || '';
    disegnaScelteSpesa(sp.fornitore);
    aggiornaModoSpesa();
    aggiornaScadenzaSpesa();
    mostra('schermo-spesa');
  }

  /** Titolo, pulsanti e riquadro dello scontrino diversi tra "Nuova spesa" e "Modifica spesa". */
  function aggiornaModoSpesa() {
    var m = stato.modifica;
    setTesto($('spesa-titolo'), m ? 'Modifica spesa' : 'Nuova spesa');
    $('schermo-spesa').setAttribute('data-titolo', m ? 'Modifica spesa' : 'Nuova spesa');
    setTesto($('spesa-salva-testo'), m ? 'Salva modifiche' : 'Salva spesa');
    $('spesa-avviso').style.display = m ? 'none' : 'block';
    aggiornaFotoEsistente();
  }

  function aggiornaFotoEsistente() {
    var m = stato.modifica;
    var haFoto = !!(m && m.foto && !stato.file);
    $('foto-esistente').style.display = haFoto && stato.fotoAzione === 'tieni' ? 'block' : 'none';
    $('foto-tolta').style.display = haFoto && stato.fotoAzione === 'togli' ? 'block' : 'none';
    if (haFoto) $('foto-esistente-link').href = m.foto;
  }

  /** «Indietro» e «Annulla» del modulo spesa. */
  function esciDaSpesa() {
    var dove = stato.modifica ? stato.tornaA : '';
    if (stato.modifica) azzeraSpesa();
    tornaSenzaRicaricare(dove);
  }

  function tornaSenzaRicaricare(dove) {
    if (dove === 'elenco') mostra('schermo-elenco');
    else if (dove === 'riepilogo') mostra('schermo-riepilogo');
    else mostra('schermo-home');
  }

  /** Dopo un salvataggio: torna all'elenco o al riepilogo aggiornandoli. */
  function tornaERicarica(dove) {
    if (dove === 'elenco') cercaElenco();
    else if (dove === 'riepilogo') apriRiepilogo(stato.anno, stato.mese);
    else mostra('schermo-home');
  }

  function salvaSpesa() {
    var importo = leggiImporto($('spesa-importo').value);
    if (!trim($('spesa-data').value)) return mostraErrore('Scrivi la data.');
    if (importo === null || importo <= 0) return mostraErrore('Scrivi l\'importo. Esempio: 12,50');
    var fornitore = fornitoreScelto();
    if (!fornitore) return mostraErrore('Scegli il fornitore oppure scrivi il nome di quello nuovo.');
    if (!stato.categoria) return mostraErrore('Tocca una categoria.');
    if (!stato.pagamento) return mostraErrore('Tocca come hai pagato: Contanti, Carta/Bancomat o Bonifico.');
    if (!scadenzaSpesaValida(trim($('spesa-scadenza').value))) {
      return mostraErrore('Scrivi la data di «Da pagare entro» così: gg/mm/aaaa. Oppure lasciala vuota.');
    }

    var modifica = stato.modifica;
    var tornaA = stato.tornaA;
    if (!stato.idSpesa) stato.idSpesa = nuovoId('S');
    var dati = {
      id: modifica ? modifica.id : stato.idSpesa,
      data: trim($('spesa-data').value),
      importo: trim($('spesa-importo').value),
      fornitore: fornitore,
      categoria: stato.categoria,
      pagamento: stato.pagamento,
      nota: trim($('spesa-nota').value),
      scadenza: trim($('spesa-scadenza').value),
      foto: stato.file,
      fotoTipo: stato.fileTipo,
      persona: personaValida()
    };
    if (modifica) dati.fotoAzione = stato.file ? 'sostituisci' : stato.fotoAzione;
    var funzione = modifica ? 'modificaSpesa' : 'salvaSpesa';
    var chiave = modifica ? 'M' + modifica.id : dati.id;
    var fatto = function () {
      ricordaFornitore(fornitore);
      azzeraSpesa();
    };
    var inCoda = function () {
      mettiInCoda({
        chiave: chiave,
        funzione: funzione,
        argomenti: [dati],
        descrizione: (modifica ? 'Modifica della spesa del ' : 'Spesa del ') + dataLeggibile(dati.data) + ' – ' +
          euro(leggiImporto(dati.importo)) + ' – ' + fornitore
      }, fatto);
    };

    if (senzaInternet()) return inCoda();
    chiama(funzione, [stato.pin, dati], function () {
      togliDallaCoda(chiave);
      fatto();
      mostraSalvato('Salvato ✓', modifica ? function () { tornaERicarica(tornaA); } : null);
    }, {
      attesa: stato.file ? 'Salvataggio in corso…\n(con il file può volerci qualche secondo)' : 'Salvataggio in corso…',
      attesaMs: stato.file ? ATTESA_SALVATAGGIO_FILE_MS : ATTESA_SALVATAGGIO_MS,
      seRete: inCoda
    });
  }

  function ricordaFornitore(fornitore) {
    if (!fornitoreEsistente(stato.fornitori, fornitore)) {
      stato.fornitori.push(fornitore);
      stato.fornitori.sort(function (a, b) { return normalizzaNome(a) < normalizzaNome(b) ? -1 : 1; });
    }
    // Il più recente per primo, senza ripetizioni (massimo 5).
    var recenti = [fornitore];
    perOgni(stato.fornitoriRecenti, function (f) {
      if (normalizzaNome(f) !== normalizzaNome(fornitore) && recenti.length < 5) recenti.push(f);
    });
    stato.fornitoriRecenti = recenti;
    salvaListe(stato);
  }

  function togliFile() {

  function mostraFileScelto() {
    var ePdf = stato.fileTipo === 'application/pdf';
    $('foto-anteprima').style.display = ePdf ? 'none' : 'block';
    $('foto-pdf').style.display = ePdf ? 'block' : 'none';

  function fileScelto(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var nome = file.name || '';
    var ePdf = file.type === 'application/pdf' || /\.pdf$/i.test(nome);
    var schermoPrima = 'schermo-spesa';

    if (ePdf) {
      if (file.size > MAX_PDF_BYTE) {
        input.value = '';
        return mostraErrore('Il PDF è troppo grande (massimo 10 MB).');
      }
      mostraAttesa('Preparo il file…');
      var lettore = new FileReader();
      lettore.onload = function (e) {
        stato.file = e.target.result;
        stato.fileTipo = 'application/pdf';
        stato.fileNome = nome;
        input.value = '';
        mostra(schermoPrima);
        mostraFileScelto();
      };
      lettore.onerror = function () {
        input.value = '';
        mostraErrore('Non riesco a leggere il file. Riprova.');
      };
      lettore.readAsDataURL(file);
      return;
    }

    if (file.type && file.type.indexOf('image/') !== 0) {
      input.value = '';
      return mostraErrore('Puoi scegliere solo una foto o un PDF.');
    }

    mostraAttesa('Preparo la foto…');
    comprimiFoto(file, function (dataUrl) {
      stato.file = dataUrl;
      stato.fileTipo = 'image/jpeg';
      stato.fileNome = nome;
      input.value = '';
      mostra(schermoPrima);
      mostraFileScelto();
    }, function () {
      input.value = '';
      mostraErrore('Non riesco a leggere la foto. Prova a scattarla di nuovo.');
    });
  }

  function comprimiFoto(file, seOk, seErrore) {
    leggiOrientamento(file, function (orientamento) {
      var img = new Image();
      var URLx = window.URL || window.webkitURL;
      var indirizzo = null;
      img.onload = function () {
        try {
          var risultato = disegnaFoto(img, bisognaRuotareFoto ? orientamento : 1);
          if (indirizzo && URLx.revokeObjectURL) URLx.revokeObjectURL(indirizzo);
          seOk(risultato);
        } catch (e) {
          seErrore();
        }
      };
      img.onerror = function () { seErrore(); };
      if (URLx && URLx.createObjectURL) {
        indirizzo = URLx.createObjectURL(file);
        img.src = indirizzo;
      } else {
        var lettore = new FileReader();
        lettore.onload = function (e) { img.src = e.target.result; };
        lettore.onerror = function () { seErrore(); };
        lettore.readAsDataURL(file);
      }
    });
  }

  function disegnaFoto(img, orientamento) {
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    var scala = Math.min(1, LATO_MAX_FOTO / Math.max(w, h));
    var cw = Math.round(w * scala);
    var ch = Math.round(h * scala);
    var canvas = document.createElement('canvas');
    var girata = orientamento >= 5 && orientamento <= 8;
    canvas.width = girata ? ch : cw;
    canvas.height = girata ? cw : ch;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    switch (orientamento) {
      case 2: ctx.transform(-1, 0, 0, 1, cw, 0); break;
      case 3: ctx.transform(-1, 0, 0, -1, cw, ch); break;
      case 4: ctx.transform(1, 0, 0, -1, 0, ch); break;
      case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
      case 6: ctx.transform(0, 1, -1, 0, ch, 0); break;
      case 7: ctx.transform(0, -1, -1, 0, ch, cw); break;
      case 8: ctx.transform(0, -1, 1, 0, 0, cw); break;
      default: break;
    }
    ctx.drawImage(img, 0, 0, cw, ch);
    return canvas.toDataURL('image/jpeg', QUALITA_FOTO);
  }

  /** Legge l'orientamento EXIF (serve solo ai browser vecchi che non lo applicano da soli). */
  function leggiOrientamento(file, callback) {
    if (!bisognaRuotareFoto || !window.FileReader || !window.DataView) return callback(1);
    var taglia = file.slice || file.webkitSlice || file.mozSlice;
    var pezzo = taglia ? taglia.call(file, 0, 128 * 1024) : file;
    var lettore = new FileReader();
    lettore.onload = function (e) {
      var o = 1;
      try { o = orientamentoDaBuffer(e.target.result); } catch (err) { o = 1; }
      callback(o);
    };
    lettore.onerror = function () { callback(1); };
    lettore.readAsArrayBuffer(pezzo);
  }

  function orientamentoDaBuffer(buffer) {
    var v = new DataView(buffer);
    var lunghezza = v.byteLength;
    if (lunghezza < 4 || v.getUint16(0, false) !== 0xFFD8) return 1;
    var pos = 2;
    while (pos + 4 <= lunghezza) {
      var marcatore = v.getUint16(pos, false);
      if (marcatore === 0xFFE1) {
        if (pos + 10 > lunghezza || v.getUint32(pos + 4, false) !== 0x45786966) return 1;
        var tiff = pos + 10;
        var little = v.getUint16(tiff, false) === 0x4949;
        var ifd = tiff + v.getUint32(tiff + 4, little);
        if (ifd + 2 > lunghezza) return 1;
        var voci = v.getUint16(ifd, little);
        for (var i = 0; i < voci; i++) {
          var voce = ifd + 2 + i * 12;
          if (voce + 10 > lunghezza) return 1;
          if (v.getUint16(voce, little) === 0x0112) return v.getUint16(voce + 8, little);
        }
        return 1;
      }
      if ((marcatore & 0xFF00) !== 0xFF00) return 1;
      pos += 2 + v.getUint16(pos + 2, false);
    }
    return 1;
  }

  /** Immagine 2x1 con orientamento EXIF 6: se il browser la mostra 1x2, ruota da solo le foto. */

  function apriChiusura() {
    if (stato.modificaChiusura) azzeraChiusura();
    if (!trim($('chiusura-contanti').value) && !trim($('chiusura-pos').value)) {
      $('chiusura-data').value = dataDiOggi();

    $('chiusura-data').value = dataDiOggi();
    $('chiusura-contanti').value = '';
    $('chiusura-pos').value = '';
    $('chiusura-fondo').value = '';

  function apriModificaChiusura(c, tornaA) {

    $('chiusura-data').value = dataPerCampo(c.dataIso);

  function aggiornaModoChiusura() {

  function esciDaChiusura() {
    var dove = stato.modificaChiusura ? stato.tornaA : '';
    if (stato.modificaChiusura) azzeraChiusura();
    tornaSenzaRicaricare(dove);
  }

  function aggiornaTotaleChiusura() {
    var totale = (leggiImporto($('chiusura-contanti').value) || 0) + (leggiImporto($('chiusura-pos').value) || 0);
    setTesto($('chiusura-totale'), euro(totale));
    aggiornaQuadratura();
  }

  /**
   * Quadratura con il registratore telematico (stesso calcolo di calcolaQuadratura_ nel server):
   * differenza = contanti + POS − registratore; null se il registratore non è scritto.
   */
  function calcolaQuadratura(contanti, pos, registratore, tolleranza) {
    if (registratore === null || registratore === undefined) return null;
    var differenza = Math.round(((contanti || 0) + (pos || 0) - registratore) * 100) / 100;
    var entro = Math.abs(differenza) <= (tolleranza || 0) + 0.004;
    return { differenza: differenza, entro: entro, esito: entro ? 'ok' : (differenza > 0 ? 'eccedenza' : 'ammanco') };
  }

  /** "+2,50 €" / "− 3,00 €" (0 senza segno). */
  function euroConSegno(n) {
    if (Math.abs(n) < 0.005) return euro(0);
    return (n > 0 ? '+' : '') + euro(n);
  }

  function quadraturaChiusura() {
    var testo = trim($('chiusura-registratore').value);
    var registratore = testo ? leggiImporto(testo) : null;
    if (registratore === null) return null;
    return calcolaQuadratura(leggiImporto($('chiusura-contanti').value) || 0, leggiImporto($('chiusura-pos').value) || 0,
      registratore, stato.tolleranzaCassa);
  }

  /** Esito della quadratura subito sotto il totale: verde, ambra (eccedenza) o rosso (ammanco). */
  function aggiornaQuadratura() {
    var q = quadraturaChiusura();
    var riquadro = $('chiusura-quadratura');
    var etichetta = $('chiusura-note-etichetta');
    var serveNota = !!(q && !q.entro);
    etichetta.innerHTML = serveNota ? '<span class="etichetta-obbligatoria">Nota (obbligatoria): perché c\'è la differenza?</span>' :
      'Note (facoltative)';
    if (!serveNota) $('chiusura-note').className = '';
    if (!q) {
      riquadro.style.display = 'none';
      return;
    }
    var tolleranza = euro(stato.tolleranzaCassa);
    riquadro.className = 'quadratura quadratura-' + q.esito;
    if (q.esito === 'ok') {
      setTesto($('chiusura-quadratura-titolo'), '✓ Cassa in quadratura');
      setTesto($('chiusura-quadratura-testo'), 'Differenza con il registratore: ' + euroConSegno(q.differenza) +
        ' (tolleranza ' + tolleranza + ').');
    } else {
      setTesto($('chiusura-quadratura-titolo'), (q.esito === 'eccedenza' ? 'Eccedenza: ' : 'Ammanco: ') + euroConSegno(q.differenza));
      setTesto($('chiusura-quadratura-testo'), (q.esito === 'eccedenza' ?
        'In cassa c\'è più di quanto battuto sul registratore' : 'In cassa c\'è meno di quanto battuto sul registratore') +
        ' (tolleranza ' + tolleranza + '). Scrivi una nota qui sotto.');
    }
    riquadro.style.display = 'block';
  }

  function salvaChiusura(sovrascrivi) {
    var contanti = trim($('chiusura-contanti').value);
    var pos = trim($('chiusura-pos').value);
    var fondo = trim($('chiusura-fondo').value);
    var registratore = trim($('chiusura-registratore').value);
    if (!trim($('chiusura-data').value)) return mostraErrore('Scrivi la data.');
    if (!contanti && !pos) return mostraErrore('Scrivi l\'incasso in contanti e/o quello POS.');
    if (contanti && leggiImporto(contanti) === null) return mostraErrore('L\'incasso in contanti non è valido. Esempio: 350,00');
    if (pos && leggiImporto(pos) === null) return mostraErrore('L\'incasso POS non è valido. Esempio: 120,50');
    if (fondo && leggiImporto(fondo) === null) return mostraErrore('Il fondo cassa non è valido. Esempio: 100,00');
    if (registratore && leggiImporto(registratore) === null) {
      return mostraErrore('Il totale del registratore telematico non è valido. Esempio: 470,50');
    }
    var q = quadraturaChiusura();
    if (q && !q.entro && !trim($('chiusura-note').value)) {
      $('chiusura-note').className = 'campo-da-compilare';
      return mostraErrore('La differenza con il registratore è di ' + euroConSegno(q.differenza) +
        ', oltre la tolleranza di ' + euro(stato.tolleranzaCassa) + '.\nScrivi una nota per spiegarla (per esempio: «resto sbagliato», ' +
        '«scontrino annullato»).', null, function () {
          try { $('chiusura-note').focus(); } catch (e) { /* niente */ }
        });
    }

    var idModifica = stato.modificaChiusura;
    var tornaA = stato.tornaA;
    if (!stato.idChiusura) stato.idChiusura = nuovoId('C');
    var dati = {
      id: idModifica || stato.idChiusura,
      data: trim($('chiusura-data').value),
      contanti: contanti,
      pos: pos,
      fondo: fondo,
      registratore: registratore,
      note: trim($('chiusura-note').value),
      persona: personaValida()
    };
    var funzione = idModifica ? 'modificaChiusura' : 'salvaChiusura';
    var chiave = idModifica ? 'M' + idModifica : dati.id;
    var inCoda = function () {
      mettiInCoda({
        chiave: chiave,
        funzione: funzione,
        argomenti: [dati, !!sovrascrivi],
        descrizione: (idModifica ? 'Modifica della chiusura cassa del ' : 'Chiusura cassa del ') + dataLeggibile(dati.data) + ' – ' +
          euro((leggiImporto(contanti) || 0) + (leggiImporto(pos) || 0))
      }, azzeraChiusura);
    };

    if (senzaInternet()) return inCoda();
    chiama(funzione, [stato.pin, dati, !!sovrascrivi], function () {
      togliDallaCoda(chiave);
      azzeraChiusura();
      mostraSalvato('Salvato ✓', idModifica ? function () { tornaERicarica(tornaA); } : null);
    }, {
      attesa: 'Salvataggio in corso…',
      attesaMs: ATTESA_SALVATAGGIO_MS,
      seRete: inCoda,
      seNo: function (r) {
        if (!r.esiste) return false;
        chiedi(r.messaggio, 'Sì, sostituisci', 'No, lascia quella di prima', function () { salvaChiusura(true); });
        return true;
      }
    });
  }

  // -------------------------------------------------------------------------
  // Riepilogo
  // -------------------------------------------------------------------------

  function apriRiepilogo(anno, mese) {
    if (!anno) svuotaCacheCopertura();   // dalla pagina iniziale: i dati potrebbero essere cambiati
    chiama('riepilogo', [stato.pin, anno || 0, mese || 0], function (r) {
      disegnaRiepilogo(r);
      mostra('schermo-riepilogo');
    }, { attesa: 'Calcolo il riepilogo…' });
  }

  function rigaTotale(etichetta, valore, classe) {
    return '<tr' + (classe ? ' class="' + classe + '"' : '') + '><td>' + etichetta + '</td><td class="cifra">' + valore + '</td></tr>';
  }

  function boxNumero(classe, etichetta, valore, nota) {
    return '<div class="numero ' + classe + '"><span class="numero-etichetta">' + etichetta + '</span>' +
      '<span class="numero-cifra">' + valore + '</span><span class="numero-nota">' + nota + '</span></div>';
  }

  function disegnaRiepilogo(r) {
    stato.anno = r.anno;
    stato.mese = r.mese;
    stato.riepilogo = r;
    stato.riepilogoDisegnate = {};
    setTesto($('riepilogo-mese'), r.nomeMese);
    $('mese-dopo').style.visibility = r.eMeseCorrente ? 'hidden' : 'visible';

    var totaleUscite = r.totaleComplessivo !== undefined ? r.totaleComplessivo : r.totaleSpese;
    var classeDiff = r.differenza < 0 ? 'negativo' : 'positivo';

    // Box con i numeri principali del mese: sempre visibili
    $('riepilogo-numeri').innerHTML =
      boxNumero('numero-spese', 'Spese', euro(totaleUscite),
        r.totaleFatture !== undefined ? 'Senza fattura + fatture' : 'Spese senza fattura') +
      boxNumero('numero-incassi', 'Incassi', euro(r.incassi), 'Contanti + POS') +
      boxNumero('numero-differenza ' + classeDiff, 'Differenza', euro(r.differenza), 'Incassi − spese');

    riassuntiRiepilogo(r);

    // «Da fare» si apre da sola se ha voci; poi l'ultima sezione aperta su questo dispositivo
    var daFare = conteggiaDaFare(r);
    perOgni(SEZIONI_RIEPILOGO, function (chiave) { impostaSezioneRiepilogo(chiave, false); });
    if (daFare.totale) impostaSezioneRiepilogo('dafare', true);
    var ricordata = stato.riepilogoSezione;
    if (ricordata && ricordata !== 'dafare' && $('sezione-' + ricordata).style.display !== 'none') {
      impostaSezioneRiepilogo(ricordata, true);
    }
  }

  // -------------------------------------------------------------------------
  // Riepilogo a sezioni: solo quella aperta viene disegnata
  // -------------------------------------------------------------------------

  var SEZIONI_RIEPILOGO = ['dafare', 'categorie', 'andamento', 'fatture', 'cassa', 'copertura', 'ultime'];

  function leggiSezioneRiepilogo() {
    try {
      var s = window.localStorage.getItem(CHIAVE_RIEPILOGO) || '';
      return s !== 'dafare' && SEZIONI_RIEPILOGO.indexOf(s) >= 0 ? s : '';
    } catch (e) { return ''; }
  }

  function ricordaSezioneRiepilogo(chiave) {
    stato.riepilogoSezione = chiave;
    try { window.localStorage.setItem(CHIAVE_RIEPILOGO, chiave); } catch (e) { /* non disponibile */ }
  }

  function conParola(n, uno, molti) {
    return n + ' ' + (n === 1 ? uno : molti);
  }

  /** Le voci di «Da fare» con il loro numero, dai dati del Riepilogo e dai contatori già noti all'app. */
  function conteggiaDaFare(r) {
    var fornitori = r.fornitoriSenzaCategoria || [];
    var daCategorizzare = Number(r.fattureDaCategorizzare) || 0;
    var voci = [];
    var totale = 0;
    var aggiungi = function (n, uno, molti, apri) {
      if (!n) return;
      voci.push({ testo: conParola(n, uno, molti), apri: apri });
      totale += n;
    };
    if (daCategorizzare) aggiungi(daCategorizzare, 'fattura da categorizzare', 'fatture da categorizzare');
    else aggiungi(fornitori.length, 'fornitore senza categoria', 'fornitori senza categoria');
    aggiungi(Number(stato.scadenzeVicine) || 0, 'scadenza vicina', 'scadenze vicine', apriScadenze);
    aggiungi(Number(stato.haccpDaFare) || 0, 'controllo HACCP da fare', 'controlli HACCP da fare', apriHaccp);
    aggiungi(Number(stato.daOrdinare) || 0, 'prodotto da ordinare', 'prodotti da ordinare', apriOrdini);
    aggiungi(Number(stato.marginiBassi) || 0, 'prodotto con margine basso', 'prodotti con margine basso', apriMargini);
    return { voci: voci, totale: totale };
  }

  /** Anteprima di una riga per ogni sezione, dai dati già arrivati (anche a sezione chiusa). */
  function riassuntiRiepilogo(r) {
    var budget = r.budget || [];
    var categorie = r.categorie || [];
    var testo;
    if (budget.length) {
      var sopra = filtra(budget, function (v) { return v.livello !== 'ok'; }).length;
      testo = sopra ? conParola(sopra, 'categoria sopra l\'80%', 'categorie sopra l\'80%') : 'Tutte le categorie sotto l\'80% del tetto';
    } else if (categorie.length) {
      testo = 'Più alta: ' + categorie[0].nome + ' ' + euro(categorie[0].totale);
    } else {
      testo = 'Nessuna spesa in questo mese';
    }
    setTesto($('riassunto-categorie'), testo);

    var a = r.andamento;
    $('sezione-andamento').style.display = a && a.confronto && a.confronto.length > 1 ? 'block' : 'none';
    if (a && a.confronto && a.confronto.length > 1) {
      setTesto($('riassunto-andamento'), 'Sul mese prima: incassi ' + testoVariazione(a.confronto[1].variazioneIncassi) +
        ', spese ' + testoVariazione(a.confronto[1].variazioneSpese));
    }

    if (r.totaleFatture !== undefined) {
      testo = r.numeroFatture ? conParola(r.numeroFatture, 'fattura', 'fatture') + ' · ' + euro(r.totaleFatture) : 'Nessuna fattura in questo mese';
    } else {
      testo = conParola(r.numeroSpese || 0, 'spesa senza fattura', 'spese senza fattura') + ' · ' + euro(r.totaleSpese);
    }
    setTesto($('riassunto-fatture'), testo);

    setTesto($('riassunto-cassa'), r.contanteTeorico ? 'Contante teorico ' + euro(r.contanteTeorico.totale) : 'Incassi ' + euro(r.incassi));
    riassuntoCoperturaRiepilogo(r);

    var ultime = r.ultime || [];
    setTesto($('riassunto-ultime'), ultime.length ? 'Ultima: ' + ultime[0].fornitore + ' · ' + euro(ultime[0].importo) : 'Nessuna spesa inserita');

    var daFare = conteggiaDaFare(r);
    $('sezione-dafare').style.display = daFare.totale ? 'block' : 'none';
    setTesto($('badge-dafare'), String(daFare.totale));
    // Anteprima corta: le prime due voci, poi quante ce ne sono altre
    var brevi = [];
    perOgni(daFare.voci, function (v, i) { if (i < 2) brevi.push(v.testo); });
    var altre = daFare.voci.length - brevi.length;
    setTesto($('riassunto-dafare'), brevi.join(' · ') + (altre > 0 ? ' · e altre ' + altre : ''));
  }

  function impostaSezioneRiepilogo(chiave, aperta) {
    $('testa-' + chiave).setAttribute('aria-expanded', aperta ? 'true' : 'false');
    $('corpo-' + chiave).style.display = aperta ? 'block' : 'none';
    $('sezione-' + chiave).className = 'carta sezione' + (aperta ? ' sezione-aperta' : '');
    if (aperta && !stato.riepilogoDisegnate[chiave]) {
      stato.riepilogoDisegnate[chiave] = true;
      DISEGNA_SEZIONE[chiave](stato.riepilogo);
    }
  }

  /** Tocco sull'intestazione: una sola sezione aperta alla volta, tranne «Da fare». */
  function alternaSezioneRiepilogo(chiave) {
    var apertaOra = $('testa-' + chiave).getAttribute('aria-expanded') === 'true';
    if (apertaOra) {
      impostaSezioneRiepilogo(chiave, false);
      if (chiave !== 'dafare') ricordaSezioneRiepilogo('');
      return;
    }
    if (chiave !== 'dafare') {
      perOgni(SEZIONI_RIEPILOGO, function (altra) {
        if (altra !== 'dafare' && altra !== chiave) impostaSezioneRiepilogo(altra, false);
      });
      ricordaSezioneRiepilogo(chiave);
    }
    impostaSezioneRiepilogo(chiave, true);
    // Se la chiusura delle altre ha spostato l'intestazione fuori vista, la riporto in alto
    try {
      var alto = $('testa-' + chiave).getBoundingClientRect().top;
      if (alto < 0 || alto > window.innerHeight - 80) {
        window.scrollTo(0, Math.max(0, (window.pageYOffset || document.documentElement.scrollTop || 0) + alto - 8));
      }
    } catch (e) { /* niente */ }
  }

  function disegnaSezioneCategorie(r) {
    var hc = '';
    var categorie = r.categorie || [];
    var massimoCategorie = categorie.length ? Math.max(categorie[0].totale, 0) : 0;
    perOgni(categorie, function (c) {
      hc += rigaTotale(esc(c.nome) + barraHtml(c.totale, massimoCategorie, 'colore-spese'), euro(c.totale));
    });
    $('riepilogo-categorie').innerHTML = hc || '<tr><td>Nessuna spesa in questo mese.</td></tr>';
    disegnaBudget(r.budget || []);
  }

  function disegnaSezioneAndamento(r) {
    if (!r.andamento) return;
    $('tabella-mesi').style.display = 'none';
    setTesto($('grafico-mesi-numeri'), 'Vedi i numeri mese per mese');
    disegnaGrafici(r.andamento, r.nomeMese);
  }

  function disegnaSezioneFatture(r) {
    var totaleFatture = Number(r.totaleFatture) || 0;
    var totaleUscite = r.totaleComplessivo !== undefined ? r.totaleComplessivo : r.totaleSpese;
    var h = rigaTotale('Spese senza fattura (' + (r.numeroSpese || 0) + ')', euro(r.totaleSpese));
    if (r.totaleFatture !== undefined) {
      h += rigaTotale('Fatture fornitori (' + (r.numeroFatture || 0) + ')', euro(totaleFatture));
      h += rigaTotale('<b>Totale spese</b>', euro(totaleUscite));
    }
    $('riepilogo-spese-righe').innerHTML = h;
  }

  function disegnaSezioneCassa(r) {
    var classeDiff = r.differenza < 0 ? 'negativo' : 'positivo';
    $('riepilogo-contante').innerHTML = htmlContante(r.contanteTeorico) +
      (r.contanteTeorico ? '<p class="piccolo">Calcolato a oggi, qualunque sia il mese scelto. Versamenti e prelievi si registrano ' +
        'dalla pagina iniziale.</p>' : '');
    var h = rigaTotale('Incassi contanti', euro(r.contanti));
    h += rigaTotale('Incassi POS / carte', euro(r.pos));
    h += rigaTotale('<b>Totale incassi</b>', euro(r.incassi));
    h += rigaTotale('Giorni con chiusura cassa', String(r.giorniConChiusura || 0));
    if (r.movimenti && r.movimenti.numero) {
      h += rigaTotale('Versato in banca', euro(r.movimenti.versamenti));
      h += rigaTotale('Prelevato dalla cassa', euro(r.movimenti.prelievi));
    }
    var q = r.quadratura;
    if (q && q.confrontate) {
      h += rigaTotale('Differenze con il registratore<br><span class="piccolo">' +
        (q.conDifferenza === 1 ? '1 giorno' : q.conDifferenza + ' giorni') + ' con differenza su ' + q.confrontate +
        (q.oltreTolleranza ? ', ' + q.oltreTolleranza + ' oltre la tolleranza' : '') + '</span>',
        '<span class="' + (q.oltreTolleranza ? 'negativo' : '') + '">' + euroConSegno(q.totaleDifferenze) + '</span>');
    }
    h += '<tr class="evidenza"><td>Incassi − spese</td><td class="cifra ' + classeDiff + '">' + euro(r.differenza) + '</td></tr>';
    $('riepilogo-cassa-righe').innerHTML = h;
  }

  function disegnaSezioneUltime(r) {
    disegnaUltime(r.ultime || []);
  }

  /** «Da fare»: fatture da categorizzare (con la scelta della categoria) e le voci che rimandano alle altre pagine. */
  function disegnaSezioneDaFare(r) {
    disegnaDaCategorizzare(r);
    var contenitore = $('riepilogo-dafare-voci');
    contenitore.innerHTML = '';
    perOgni(conteggiaDaFare(r).voci, function (v) {
      if (!v.apri) return;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'riga-dafare';
      b.innerHTML = '<span class="riga-dafare-dentro"><span class="riga-dafare-testo">' + esc(v.testo) + '</span>' +
        '<span class="riga-dafare-freccia">' + ICONA_FRECCIA_DESTRA + '</span></span>';
      b.onclick = v.apri;
      contenitore.appendChild(b);
    });
  }

  var DISEGNA_SEZIONE = {
    dafare: disegnaSezioneDaFare,
    categorie: disegnaSezioneCategorie,
    andamento: disegnaSezioneAndamento,
    fatture: disegnaSezioneFatture,
    cassa: disegnaSezioneCassa,
    copertura: disegnaSezioneCopertura,
    ultime: disegnaSezioneUltime
  };

  // -------------------------------------------------------------------------
  // Riepilogo: «Spese coperte dai ricavi»
  // -------------------------------------------------------------------------

  // Nomi dei mesi con la maiuscola (NOMI_MESI, in minuscolo, è quello della Home)
  var MESI_COPERTURA = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre',
    'Ottobre', 'Novembre', 'Dicembre'];
  var NOMI_FILTRI_COPERTURA = { tutte: 'tutte le spese', senzaFattura: 'spese senza fattura', fatture: 'fatture' };
  var RIGHE_COPERTURA = 30;
  var MAX_CACHE_COPERTURA = 24;
  var cacheCopertura = { dati: {}, numero: 0 };

  function isoGiorno(anno, mese, giorno) { return anno + '-' + due(mese) + '-' + due(giorno); }

  function ultimoGiornoDelMese(anno, mese) { return new Date(anno, mese, 0).getDate(); }

  function spostaMeseCop(anno, mese, passo) {
    var totale = anno * 12 + (mese - 1) + passo;
    return { anno: Math.floor(totale / 12), mese: (totale % 12) + 1 };
  }

  function oggiCopertura() {
    var d = new Date();
    return { anno: d.getFullYear(), mese: d.getMonth() + 1, giorno: d.getDate() };
  }

  /** Periodo calcolato rispetto a oggi: 'questo' | 'scorso' | 'trimestre' | 'anno'. */
  function periodoRelativo(rel) {
    var o = oggiCopertura();
    if (rel === 'anno') return { tipo: 'anno', anno: o.anno, mese: 1, da: '', a: '', rel: rel };
    if (rel === 'trimestre') return { tipo: 'trimestre', anno: o.anno, mese: Math.floor((o.mese - 1) / 3) * 3 + 1, da: '', a: '', rel: rel };
    var m = rel === 'scorso' ? spostaMeseCop(o.anno, o.mese, -1) : { anno: o.anno, mese: o.mese };
    return { tipo: 'mese', anno: m.anno, mese: m.mese, da: '', a: '', rel: rel === 'scorso' ? 'scorso' : 'questo' };
  }

  /** Primo e ultimo giorno del periodo ("aaaa-mm-gg"). */
  function intervalloCopertura(p) {
    if (p.tipo === 'personalizzato') return { da: p.da, a: p.a };
    if (p.tipo === 'anno') return { da: isoGiorno(p.anno, 1, 1), a: isoGiorno(p.anno, 12, 31) };
    var fine = spostaMeseCop(p.anno, p.mese, p.tipo === 'trimestre' ? 2 : 0);
    return { da: isoGiorno(p.anno, p.mese, 1), a: isoGiorno(fine.anno, fine.mese, ultimoGiornoDelMese(fine.anno, fine.mese)) };
  }

  /** "2026-10-17" → "17/10" (con l'anno a due cifre se serve) */
  function dataBreve(iso, conAnno) {
    var p = String(iso).split('-');
    return p[2] + '/' + p[1] + (conAnno ? '/' + p[0].substring(2) : '');
  }

  function etichettaPeriodoCopertura(p) {
    if (p.tipo === 'anno') return { sopra: 'Anno', testo: String(p.anno) };
    if (p.tipo === 'trimestre') {
      var fine = spostaMeseCop(p.anno, p.mese, 2);
      return { sopra: MESI_COPERTURA[p.mese - 1] + ' – ' + MESI_COPERTURA[fine.mese - 1],
        testo: (Math.floor((p.mese - 1) / 3) + 1) + '° trimestre ' + p.anno };
    }
    if (p.tipo === 'personalizzato') {
      return { sopra: 'Periodo personalizzato', testo: p.da && p.a ? dataLeggibile(p.da) + ' – ' + dataLeggibile(p.a) : 'Scegli le date' };
    }
    return { sopra: 'Mese', testo: MESI_COPERTURA[p.mese - 1] + ' ' + p.anno };
  }

  /** "17/10/2026" o "2026-10-17" → "2026-10-17" ('' se non valida). */
  function isoDaCampoData(testo) {
    var s = trim(testo);
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    var a, me, g;
    if (m) { a = +m[1]; me = +m[2]; g = +m[3]; } else {
      m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);
      if (!m) return '';
      g = +m[1]; me = +m[2]; a = +m[3];
    }
    if (a < 2000 || a > 2100 || me < 1 || me > 12 || g < 1 || g > ultimoGiornoDelMese(a, me)) return '';
    return isoGiorno(a, me, g);
  }

  function leggiCoperturaSalvata() {
    var predefinito = { periodo: periodoRelativo('questo'), filtro: 'tutte' };
    try {
      var testo = window.localStorage.getItem(CHIAVE_COPERTURA);
      if (!testo) return predefinito;
      var s = JSON.parse(testo);
      var p = s.p;
      var filtro = NOMI_FILTRI_COPERTURA[s.f] ? s.f : 'tutte';
      if (p.rel === 'questo' || p.rel === 'scorso' || p.rel === 'trimestre' || p.rel === 'anno') {
        return { periodo: periodoRelativo(p.rel), filtro: filtro };
      }
      if (p.tipo === 'personalizzato') {
        var da = isoDaCampoData(p.da);
        var a = isoDaCampoData(p.a);
        if (!da || !a || a < da) return { periodo: { tipo: 'personalizzato', anno: 0, mese: 0, da: '', a: '', rel: '' }, filtro: filtro };
        return { periodo: { tipo: 'personalizzato', anno: 0, mese: 0, da: da, a: a, rel: '' }, filtro: filtro };
      }
      var anno = Number(p.anno);
      var mese = Number(p.mese);
      if ((p.tipo === 'mese' || p.tipo === 'trimestre' || p.tipo === 'anno') && anno >= 2001 && anno <= 2100 && mese >= 1 && mese <= 12) {
        if (p.tipo === 'trimestre') mese = Math.floor((mese - 1) / 3) * 3 + 1;
        if (p.tipo === 'anno') mese = 1;
        return { periodo: { tipo: p.tipo, anno: anno, mese: mese, da: '', a: '', rel: '' }, filtro: filtro };
      }
    } catch (e) { /* non disponibile o rovinato */ }
    return predefinito;
  }

  function ricordaCopertura() {
    var c = stato.copertura;
    try { window.localStorage.setItem(CHIAVE_COPERTURA, JSON.stringify({ p: c.periodo, f: c.filtro })); } catch (e) { /* non disponibile */ }
  }

  function euroMeno(n) { return euro(n).replace(/^- /, '−'); }

  function testoRiassuntoCopertura(t) {
    if (!t || !t.numeroSpese) return 'Nessuna spesa in questo periodo';
    var coperte = t.numeroSpese === 1 ? (t.speseCoperte ? 'La spesa è coperta' : 'La spesa non è ancora coperta') :
      t.speseCoperte === t.numeroSpese ? 'Tutte le ' + t.numeroSpese + ' spese coperte' :
        'Coperte ' + t.speseCoperte + ' su ' + t.numeroSpese;
    if (t.scoperto > 0) return coperte + ' · ancora da coprire ' + euro(t.scoperto);
    return coperte + ' · guadagno ' + euro(t.guadagno);
  }

  /** Anteprima a sezione chiusa: dal mese del Riepilogo (arriva già con i suoi dati). */
  function riassuntoCoperturaRiepilogo(r) {
    setTesto($('riassunto-copertura'), r.copertura ? testoRiassuntoCopertura(r.copertura) : 'Quanto delle spese è coperto dagli incassi');
  }

  function disegnaSezioneCopertura() {
    if (!stato.copertura) stato.copertura = leggiCoperturaSalvata();
    stato.copertura.vista = 'righe';
    stato.copertura.tutto = false;
    aggiornaControlliCopertura();
    // Aperta da un tocco: si carica subito. Riaperta da sola insieme al Riepilogo: si aspetta che la schermata sia
    // mostrata, altrimenti "Attendere…" verrebbe nascosto subito.
    if (stato.schermo === 'schermo-riepilogo') caricaCopertura(); else setTimeout(caricaCopertura, 0);
  }

  function periodoCombacia(p, altro) {
    return p.tipo === altro.tipo && p.anno === altro.anno && p.mese === altro.mese;
  }

  function pillolaPeriodoCopertura(p) {
    if (p.tipo === 'personalizzato') return 'personalizzato';
    if (p.tipo === 'trimestre') return 'trimestre';
    if (p.tipo === 'anno') return 'anno';
    if (periodoCombacia(p, periodoRelativo('questo'))) return 'questo';
    if (periodoCombacia(p, periodoRelativo('scorso'))) return 'scorso';
    return '';
  }

  function aggiornaControlliCopertura() {
    var c = stato.copertura;
    var p = c.periodo;
    var et = etichettaPeriodoCopertura(p);
    setTesto($('cop-tipo-etichetta'), et.sopra);
    setTesto($('cop-etichetta'), et.testo);
    var scelta = pillolaPeriodoCopertura(p);
    perOgni($('cop-periodi').getElementsByTagName('button'), function (b) {
      b.className = b.getAttribute('data-periodo') === scelta ? 'scelto' : '';
    });
    perOgni($('cop-filtro').getElementsByTagName('button'), function (b) {
      b.className = b.getAttribute('data-filtro') === c.filtro ? 'scelto' : '';
    });
    var personalizzato = p.tipo === 'personalizzato';
    $('cop-personalizzato').style.display = personalizzato ? 'block' : 'none';
    // Frecce: nascoste per le date a scelta, e "avanti" oltre il periodo che contiene oggi
    var oggi = oggiCopertura();
    var oggiIso = isoGiorno(oggi.anno, oggi.mese, oggi.giorno);
    var prima = false;
    var dopo = false;
    if (!personalizzato) {
      var corrente = intervalloCopertura(p);
      prima = corrente.da > '2001-02-01';
      dopo = corrente.a < oggiIso;
    }
    $('cop-prima').style.visibility = prima ? 'visible' : 'hidden';
    $('cop-dopo').style.visibility = dopo ? 'visible' : 'hidden';
  }

  /** Periodo o filtro cambiati: si ricorda la scelta e si ricarica l'elenco dall'inizio. */
  function applicaCopertura() {
    var c = stato.copertura;
    c.vista = 'righe';
    c.tutto = false;
    ricordaCopertura();
    caricaCopertura();
  }

  function scegliPeriodoCopertura(chiave) {
    var c = stato.copertura;
    if (chiave === 'personalizzato') {
      var intervallo = c.periodo.tipo === 'personalizzato' && c.periodo.da ? c.periodo : null;
      if (!intervallo) {
        var o = oggiCopertura();
        var base = intervalloCopertura(c.periodo);
        var fine = base.a > isoGiorno(o.anno, o.mese, o.giorno) ? isoGiorno(o.anno, o.mese, o.giorno) : base.a;
