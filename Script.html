        intervallo = { da: base.da, a: fine < base.da ? base.da : fine };
      }
      c.periodo = { tipo: 'personalizzato', anno: 0, mese: 0, da: intervallo.da, a: intervallo.a, rel: '' };
      $('cop-da').value = dataPerCampo(c.periodo.da);
      $('cop-a').value = dataPerCampo(c.periodo.a);
      nascondiErroreCopertura();
      aggiornaControlliCopertura();
      // Le date proposte si vedono subito; per cambiarle si scrivono e si preme «Mostra questo periodo»
      applicaCopertura();
      return;
    }
    c.periodo = periodoRelativo(chiave);
    nascondiErroreCopertura();
    applicaCopertura();
  }

  function spostaPeriodoCopertura(passo) {
    var c = stato.copertura;
    var p = c.periodo;
    if (p.tipo === 'personalizzato') return;
    if (p.tipo === 'anno') {
      c.periodo = { tipo: 'anno', anno: p.anno + passo, mese: 1, da: '', a: '', rel: '' };
    } else {
      var m = spostaMeseCop(p.anno, p.mese, passo * (p.tipo === 'trimestre' ? 3 : 1));
      c.periodo = { tipo: p.tipo, anno: m.anno, mese: m.mese, da: '', a: '', rel: '' };
    }
    applicaCopertura();
  }

  function mostraErroreCopertura(testo) {
    var e = $('cop-errore');
    setTesto(e, testo);
    e.style.display = 'block';
  }

  function nascondiErroreCopertura() {
    $('cop-errore').style.display = 'none';
  }

  function applicaPeriodoPersonalizzato() {
    var da = isoDaCampoData($('cop-da').value);
    var a = isoDaCampoData($('cop-a').value);
    if (!da || !a) {
      mostraErroreCopertura('Scrivi due date valide, per esempio 01/10/2026.');
      return;
    }
    if (a < da) {
      mostraErroreCopertura('La data finale è prima della data iniziale: controlla le due date.');
      return;
    }
    if ((Number(a.substring(0, 4)) - Number(da.substring(0, 4))) > 9) {
      mostraErroreCopertura('Il periodo è troppo lungo: scegli al massimo 10 anni.');
      return;
    }
    nascondiErroreCopertura();
    stato.copertura.periodo = { tipo: 'personalizzato', anno: 0, mese: 0, da: da, a: a, rel: '' };
    applicaCopertura();
  }

  function scegliFiltroCopertura(filtro) {
    stato.copertura.filtro = filtro;
    applicaCopertura();
  }

  /** Una sola chiamata al server per periodo e filtro; poi si usa la copia già arrivata finché i dati non cambiano. */
  function caricaCopertura() {
    var c = stato.copertura;
    aggiornaControlliCopertura();
    var contenuto = $('cop-contenuto');
    var p = c.periodo;
    if (p.tipo === 'personalizzato' && (!p.da || !p.a)) {
      contenuto.innerHTML = '<p class="vuoto testo-tenue">Scegli le due date e premi «Mostra questo periodo».</p>';
      return;
    }
    var intervallo = intervalloCopertura(p);
    var chiave = intervallo.da + '|' + intervallo.a + '|' + c.filtro;
    if (cacheCopertura.dati[chiave]) {
      c.risultato = cacheCopertura.dati[chiave];
      disegnaRisultatoCopertura();
      return;
    }
    contenuto.innerHTML = '';
    chiama('coperturaSpese', [stato.pin, intervallo.da, intervallo.a, c.filtro], function (r) {
      if (cacheCopertura.numero >= MAX_CACHE_COPERTURA) svuotaCacheCopertura();
      cacheCopertura.dati[chiave] = r;
      cacheCopertura.numero++;
      c.risultato = r;
      disegnaRisultatoCopertura();
    }, {
      attesa: 'Calcolo le spese coperte…',
      seAnnulla: function () {
        contenuto.innerHTML = '<p class="vuoto testo-tenue">Non sono riuscito a calcolarlo.</p>' +
          '<button type="button" id="cop-riprova" class="secondario">Riprova</button>';
        $('cop-riprova').onclick = caricaCopertura;
      }
    });
  }

  function svuotaCacheCopertura() {
    cacheCopertura = { dati: {}, numero: 0 };
  }

  function coperturaRigaTotale(etichetta, valore, classe) {
    return '<tr' + (classe ? ' class="' + classe + '"' : '') + '><td>' + etichetta + '</td><td class="cifra">' + valore + '</td></tr>';
  }

  /**
   * Tabella a due colonne (testo a sinistra, importo a destra). Ogni riga è [sinistra, destra] oppure, con un solo
   * elemento, occupa tutta la larghezza: così i nomi lunghi hanno sempre tutto lo spazio e non si spezzano.
   */
  function coperturaTabella(righe) {
    var h = '<table class="cop-riga">';
    perOgni(righe, function (r) {
      if (r.length === 1) h += '<tr><td colspan="2" class="cop-pieno">' + r[0] + '</td></tr>';
      else h += '<tr><td class="cop-sinistra">' + r[0] + '</td><td class="cop-importo' + (r[2] ? ' ' + r[2] : '') + '">' + r[1] + '</td></tr>';
    });
    return h + '</table>';
  }

  function htmlRigaCopertura(x, conAnno) {
    var data = '<span class="cop-data">' + dataBreve(x.data, conAnno) + '</span>';
    if (x.tipo === 'spesa') {
      var sotto = x.notaDiCredito ? 'Nota di credito' : x.origine === 'fattura' ? 'Fattura' : 'Senza fattura';
      var h = '<div class="cop-spesa' + (x.notaDiCredito ? ' cop-credito' : '') + '">' + coperturaTabella([
        [data, x.importo < 0 ? euroMeno(x.importo) : euro(x.importo), x.importo < 0 ? 'positivo' : ''],
        ['<span class="cop-nome">' + esc(x.fornitore) + '</span><span class="cop-sub">' + sotto + '</span>']
      ]);
      if (x.senzaChiusura) h += '<span class="cop-manca">Quel giorno non c\'è la chiusura cassa</span>';
      return h + '</div>';
    }
    if (x.tipo === 'ricavi') {
      var nota = x.inAvanzo > 0 ? '<span class="cop-sub">' + (x.suSpese > 0 ? 'di cui ' + euro(x.inAvanzo) + ' in avanzo' : 'tutto in avanzo') + '</span>' : '';
      return '<div class="cop-ricavi">' + coperturaTabella([
        [data, '+' + euro(x.importo)],
        ['<span class="cop-nome">Ricavi del giorno</span>' + nota]
      ]) + '</div>';
    }
    // Nastrino: residuo della spesa dopo il ricavo
    var coperta = x.coperta;
    return '<div class="cop-nastrino ' + (coperta ? 'cop-coperta' : 'cop-aperta') + '">' + coperturaTabella([
      ['<span class="cop-nome">' + esc(x.fornitore) + '</span>'],
      ['<span class="cop-sub">' + (coperta ? 'chiusa il ' + dataBreve(x.dataChiusura, conAnno) : 'ancora da coprire') + '</span>',
        coperta ? 'Coperta ✓' : euroMeno(x.residuo)]
    ]) + '</div>';
  }

  function htmlElencoCopertura(r, tutto, conAnno) {
    var righe = r.righe;
    var fine = righe.length;
    if (!tutto && fine > RIGHE_COPERTURA) {
      fine = RIGHE_COPERTURA;
      while (fine < righe.length && righe[fine].tipo === 'nastrino') fine++;   // il nastrino resta con il suo ricavo
    }
    var h = '';
    for (var i = 0; i < fine; i++) h += htmlRigaCopertura(righe[i], conAnno);
    if (fine < righe.length) {
      h += '<p class="piccolo">Mostrate le prime ' + fine + ' righe su ' + righe.length + '.</p>' +
        '<button type="button" id="cop-tutto" class="secondario">Mostra tutto (' + righe.length + ' righe)</button>';
    }
    return h;
  }

  function htmlMesiCopertura(r) {
    var h = '';
    perOgni(r.mesi, function (m) {
      var parti = m.chiave.split('-');
      var destra;
      if (m.scoperto > 0) destra = '<span class="cop-esito negativo">Scoperto</span>' + euro(m.scoperto);
      else if (m.avanzo > 0) destra = '<span class="cop-esito positivo">Guadagno</span>' + euro(m.avanzo);
      else destra = '<span class="cop-esito">In pari</span>' + euro(0);
      h += '<div class="cop-mese">' + coperturaTabella([
        ['<span class="cop-nome">' + MESI_COPERTURA[Number(parti[1]) - 1] + ' ' + parti[0] + '</span>', destra,
          m.scoperto > 0 ? 'negativo' : m.avanzo > 0 ? 'positivo' : ''],
        ['<span class="cop-sub">Spese ' + euro(m.spese) + ' · Ricavi ' + euro(m.ricavi) + '</span>']
      ]) + '</div>';
    });
    return h + '<p class="piccolo">Situazione a fine di ogni mese, contando dall\'inizio del periodo.</p>';
  }

  function disegnaRisultatoCopertura() {
    var c = stato.copertura;
    var r = c.risultato;
    var contenuto = $('cop-contenuto');
    var t = r.totali;
    var intervallo = intervalloCopertura(c.periodo);
    var conAnno = intervallo.da.substring(0, 4) !== intervallo.a.substring(0, 4);

    // Anteprima a sezione chiusa: stesso mese del Riepilogo e tutte le spese, altrimenti con il nome del periodo
    var testo = testoRiassuntoCopertura(t);
    var perMese = c.periodo.tipo === 'mese' && c.periodo.anno === stato.anno && c.periodo.mese === stato.mese && c.filtro === 'tutte';
    setTesto($('riassunto-copertura'), perMese ? testo : etichettaPeriodoCopertura(c.periodo).testo + ' (' + NOMI_FILTRI_COPERTURA[c.filtro] + '): ' +
      testo.charAt(0).toLowerCase() + testo.substring(1));

    if (!r.righe.length) {
      contenuto.innerHTML = '<p class="lista-vuota">Nessuna spesa e nessuna chiusura cassa in questo periodo' +
        (c.filtro === 'tutte' ? '' : ' (per ' + NOMI_FILTRI_COPERTURA[c.filtro] + ')') + '.</p>' +
        '<p class="piccolo">Prova a scegliere un altro periodo con le frecce o con le pillole qui sopra.</p>';
      return;
    }

    var scoperto = t.scoperto > 0;
    var h = '<div class="cop-riquadro ' + (scoperto ? 'cop-neg' : 'cop-pos') + '"><table class="totali">' +
      coperturaRigaTotale('Spese', euro(t.spese)) +
      coperturaRigaTotale('Ricavi', euro(t.ricavi)) +
      coperturaRigaTotale('Ancora da coprire', '<span class="' + (scoperto ? 'negativo' : '') + '">' + euro(t.scoperto) + '</span>') +
      '<tr class="evidenza"><td>Guadagno</td><td class="cifra ' + (scoperto ? 'negativo' : 'positivo') + '">' + euroMeno(t.guadagno) + '</td></tr>' +
      '</table>';
    if (t.numeroSpese) {
      h += '<p class="piccolo">Spese coperte: <b>' + t.speseCoperte + ' su ' + t.numeroSpese + '</b>' +
        (t.giornoMedioCopertura !== null ? ' · in media dopo <b>' + String(t.giornoMedioCopertura).replace('.', ',') + '</b> ' +
          (t.giornoMedioCopertura === 1 ? 'giorno' : 'giorni') : '') + '</p>';
    } else {
      h += '<p class="piccolo">Nessuna spesa in questo periodo: tutti i ricavi restano a tuo favore.</p>';
    }
    h += '</div>';

    if (!t.ricavi && t.numeroSpese) {
      h += '<div class="avviso cop-avviso">Nessuna chiusura cassa in questo periodo: i ricavi sono a zero.</div>';
    } else if (t.giorniSenzaChiusura) {
      var date = [];
      perOgni(r.giorniSenzaChiusura, function (g, i) { if (i < 6) date.push(dataBreve(g, conAnno)); });
      var altri = t.giorniSenzaChiusura - date.length;
      h += '<div class="avviso cop-avviso">' + conParola(t.giorniSenzaChiusura, 'giorno senza chiusura cassa', 'giorni senza chiusura cassa') +
        ': i loro incassi non sono contati (' + date.join(', ') + (altri > 0 ? ' e altri ' + altri : '') + ').</div>';
    }
    if (t.speseAImportoZero) {
      h += '<p class="piccolo">' + conParola(t.speseAImportoZero, 'spesa a importo zero non è mostrata', 'spese a importo zero non sono mostrate') + '.</p>';
    }

    if (r.mesi.length > 1) {
      h += '<div class="scelte segmentato cop-vista" id="cop-vista">' +
        '<button type="button" data-vista="righe" class="' + (c.vista === 'righe' ? 'scelto' : '') + '">Giorno per giorno</button>' +
        '<button type="button" data-vista="mesi" class="' + (c.vista === 'mesi' ? 'scelto' : '') + '">Riepilogo per mese</button></div>';
    } else {
      c.vista = 'righe';
    }
    h += '<div class="cop-elenco">' + (c.vista === 'mesi' ? htmlMesiCopertura(r) : htmlElencoCopertura(r, c.tutto, conAnno)) + '</div>';
    contenuto.innerHTML = h;

    var vista = $('cop-vista');
    if (vista) {
      perOgni(vista.getElementsByTagName('button'), function (b) {
        b.onclick = function () {
          c.vista = b.getAttribute('data-vista');
          disegnaRisultatoCopertura();
        };
      });
    }
    if ($('cop-tutto')) {
      $('cop-tutto').onclick = function () {
        c.tutto = true;
        disegnaRisultatoCopertura();
      };
    }
  }

  /** Budget del mese: barra verde, ambra (sopra l'80%) o rossa (sopra il 100%) per categoria. */
  function disegnaBudget(budget) {
    if (!budget.length) {
      $('riepilogo-budget').innerHTML = '<p class="piccolo senza-margine">Nessun tetto impostato. Scrivi il tetto mensile delle ' +
        'categorie nella colonna B della scheda «Budget» del foglio Google.</p>';
      return;
    }
    var pillole = { ok: 'pillola-verde', attenzione: 'pillola-accento', superato: 'pillola-rossa' };
    var h = '';
    perOgni(budget, function (v, i) {
      var larghezza = Math.max(v.speso > 0 ? 2 : 0, Math.min(100, v.percentuale));
      h += '<div class="riga-budget' + (i === budget.length - 1 ? ' ultima' : '') + '">' +
        '<span class="riga-budget-nome">' + esc(v.categoria) + '</span>' +
        '<span class="pillola ' + pillole[v.livello] + '">' + (v.livello === 'superato' ? '⚠ ' : '') + v.percentuale + '%</span>' +
        '<div class="barra-budget"><div class="barra-budget-pieno budget-' + v.livello + '" style="width:' + larghezza + '%"></div></div>' +
        '<span class="riga-budget-cifre">' + euro(v.speso) + ' di ' + euro(v.tetto) + ' · ' +
        (v.residuo < 0 ? '<b class="negativo">superato di ' + euro(-v.residuo) + '</b>' : 'restano ' + euro(v.residuo)) + '</span></div>';
    });
    $('riepilogo-budget').innerHTML = h;
  }

  // -------------------------------------------------------------------------
  // Grafici del Riepilogo (div e CSS, niente librerie)
  // -------------------------------------------------------------------------

  /** Barra orizzontale lunga in proporzione al massimo (vuota se il valore è 0 o negativo). */
  function barraHtml(valore, massimo, classe) {
    if (!(valore > 0) || !(massimo > 0)) return '';
    var perc = Math.max(1, Math.min(100, Math.round(valore / massimo * 100)));
    return '<div class="barra ' + classe + '" style="width:' + perc + '%"></div>';
  }

  /** 15234 → 16000: numero tondo per la linea in alto dei grafici. */
  function arrotondaScala(n) {
    var passo = n >= 10000 ? 1000 : n >= 1000 ? 100 : 10;
    return Math.ceil(n / passo) * passo;
  }

  function testoVariazione(v) {
    if (v === null || v === undefined) return '–';
    if (v === 0) return 'uguale';
    return (v > 0 ? '+' : '−') + Math.abs(v) + '%';
  }

  function disegnaGrafici(a, nomeMese) {
    // 1. Confronto: questo mese, il mese prima, lo stesso mese dell'anno scorso
    $('confronto-nota').innerHTML = a.finoAlGiorno ?
      'Il mese è in corso: per ogni mese sono contati solo i giorni dall\'1 al ' + a.finoAlGiorno + '.' :
      'Mesi interi.';
    var massimo = 0;
    perOgni(a.confronto, function (c) { massimo = Math.max(massimo, c.incassi, c.spese); });
    var h = '';
    perOgni(a.confronto, function (c, i) {
      h += '<div class="blocco-confronto' + (i === a.confronto.length - 1 ? ' ultimo' : '') + '">' +
        '<b>' + esc(c.etichetta) + '</b><br><span class="piccolo">' + esc(c.nome) + '</span>' +
        '<div class="riga-barra">Incassi ' + euro(c.incassi) + barraHtml(c.incassi, massimo, 'colore-incassi') + '</div>' +
        '<div class="riga-barra">Spese ' + euro(c.spese) + barraHtml(c.spese, massimo, 'colore-spese') + '</div>' +
        (i ? '<span class="variazione">Questo mese rispetto a ' + (i === 1 ? 'quello prima' : 'un anno fa') + ': incassi ' +
          testoVariazione(c.variazioneIncassi) + ', spese ' + testoVariazione(c.variazioneSpese) + '</span>' : '') +
        '</div>';
    });
    $('grafico-confronto').innerHTML = h;

    // 2. Ultimi 12 mesi: colonne affiancate incassi/spese; tocca un mese per vedere i numeri
    var max = arrotondaScala(a.massimoMesi || 0);
    var altezza = function (v) { return v > 0 && max > 0 ? Math.max(2, Math.round(v / max * 148)) : 0; };
    setTesto($('grafico-mesi-scala'), max > 0 ? 'linea in alto: ' + euro(max).replace(',00 €', ' €') : 'Nessun dato negli ultimi 12 mesi.');
    var colonne = $('grafico-mesi');
    var etichette = $('grafico-mesi-etichette');
    colonne.innerHTML = '';
    etichette.innerHTML = '';
    var celle = [];
    var mostraMese = function (i) {
      var m = a.mesi[i];
      perOgni(celle, function (c, k) {
        c.colonna.className = 'mese' + (k === i ? ' scelto' : '');
        c.etichetta.className = k === i ? 'scelto' : '';
      });
      $('grafico-mesi-dettaglio').innerHTML = '<b>' + esc(m.nome) + '</b><br>' +
        '<span class="chiave colore-incassi"></span>Incassi ' + euro(m.incassi) + '<br>' +
        '<span class="chiave colore-spese"></span>Spese ' + euro(m.spese);
    };
    perOgni(a.mesi, function (m, i) {
      var col = document.createElement('div');
      col.className = 'mese';
      col.innerHTML = '<div class="coppia-barre">' +
        '<span class="barra-v colore-incassi" style="height:' + altezza(m.incassi) + 'px"></span>' +
        '<span class="barra-v colore-spese" style="height:' + altezza(m.spese) + 'px"></span></div>';
      col.onclick = function () { mostraMese(i); };
      colonne.appendChild(col);
      var et = document.createElement('span');
      setTesto(et, m.breve);
      et.onclick = function () { mostraMese(i); };
      etichette.appendChild(et);
      celle.push({ colonna: col, etichetta: et });
    });
    if (a.mesi.length) mostraMese(a.mesi.length - 1);

    var righe = '<tr><td><b>Mese</b></td><td class="cifra">Incassi<br>Spese</td></tr>';
    perOgni(a.mesi, function (m) {
      righe += '<tr><td>' + esc(m.nome) + '</td><td class="cifra">' + euro(m.incassi) + '<br>' +
        '<span class="piccolo">' + euro(m.spese) + '</span></td></tr>';
    });
    $('tabella-mesi-righe').innerHTML = righe;

    // 3. Incasso medio per giorno della settimana
    var hs = '';
    perOgni(a.settimana, function (g) {
      hs += '<div class="riga-barra"><b>' + esc(g.nome) + '</b> ' +
        (g.giorni ? euro(g.media) + ' <span class="piccolo">(' + g.giorni + (g.giorni === 1 ? ' giorno' : ' giorni') + ')</span>' :
          '<span class="piccolo">nessuna chiusura</span>') +
        barraHtml(g.media, a.massimoSettimana, 'colore-incassi') + '</div>';
    });
    $('grafico-settimana').innerHTML = hs;
  }

  function disegnaDaCategorizzare(r) {
    var fornitori = r.fornitoriSenzaCategoria || [];
    var daCategorizzare = Number(r.fattureDaCategorizzare) || 0;
    var riquadro = $('riepilogo-da-categorizzare');
    if (!fornitori.length && !daCategorizzare) {
      riquadro.style.display = 'none';
      return;
    }
    var avviso = '';
    if (daCategorizzare) {
      avviso += '<b>' + (daCategorizzare === 1 ? 'C\'è 1 fattura' : 'Ci sono ' + daCategorizzare + ' fatture') +
        ' da categorizzare.</b><br>';
    }
    avviso += 'Scegli la categoria per questi fornitori: verrà usata anche per le prossime fatture.';
    $('riepilogo-avviso-fatture').innerHTML = avviso;

    var contenitore = $('riepilogo-fornitori-senza-categoria');
    contenitore.innerHTML = '';
    perOgni(fornitori, function (f, i) {
      var div = document.createElement('div');
      div.className = 'voce';
      var opzioni = '<option value="">— Scegli la categoria —</option>';
      perOgni(stato.categorie, function (c) { opzioni += '<option value="' + esc(c) + '">' + esc(c) + '</option>'; });
      div.innerHTML = '<b>' + esc(f.nome) + '</b>' +
        (f.piva ? '<br><span class="piccolo">P.IVA ' + esc(f.piva) + '</span>' : '') +
        (f.fatture ? '<br>' + f.fatture + (f.fatture === 1 ? ' fattura' : ' fatture') + ' da categorizzare' : '') +
        '<select id="categoria-fornitore-' + i + '" style="margin-top:10px">' + opzioni + '</select>';
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'primario bottone-voce';
      b.innerHTML = ICONA_SPUNTA + 'Salva categoria';
      b.onclick = function () {
        var categoria = $('categoria-fornitore-' + i).value;
        if (!categoria) return mostraErrore('Scegli prima una categoria dall\'elenco.');
        chiama('impostaCategoriaFornitore', [stato.pin, f.nome, f.piva, categoria], function () {
          mostraSalvato('Salvato ✓', function () { apriRiepilogo(stato.anno, stato.mese); });
        }, { attesa: 'Salvataggio in corso…' });
      };
      div.appendChild(b);
      contenitore.appendChild(div);
    });
    riquadro.style.display = 'block';
  }

  function disegnaUltime(ultime) {
    var contenitore = $('riepilogo-ultime');
    contenitore.innerHTML = '';
    if (!ultime.length) {
      contenitore.innerHTML = '<p class="testo-tenue">Non hai ancora inserito spese.</p>';
      return;
    }
    perOgni(ultime, function (sp) {
      contenitore.appendChild(creaVoceSpesa(sp, 'riepilogo'));
    });
  }

  /** Parte alta di una voce: titolo e righe a sinistra, importo a destra. */
  function testaVoce(titolo, righe, importo) {
    return '<div class="riga-spesa-alto"><div class="riga-spesa-testo">' +
      '<b class="voce-titolo">' + titolo + '</b>' + righe + '</div>' +
      (importo ? '<div class="riga-spesa-importo">' + importo + '</div>' : '') + '</div>';
  }

  function rigaInfo(testo, classe) {
    return '<span class="' + (classe || 'riga-spesa-info') + '">' + testo + '</span>';
  }

  /**
   * Spesa con i pulsanti «Modifica» ed «Elimina»: riquadro a sé nell'elenco,
   * riga semplice dentro la carta «Ultime 10 spese» del riepilogo.
   */
  function creaVoceSpesa(sp, tornaA) {
    var div = document.createElement('div');
    div.className = tornaA === 'riepilogo' ? 'riga-spesa' : 'voce';
    div.innerHTML = testaVoce(esc(sp.fornitore),
      rigaInfo(esc(sp.data) + ' · ' + esc(sp.categoria) + ' · ' + esc(sp.pagamento)) +
      (sp.inseritoDa ? rigaInfo('Inserita da ' + esc(sp.inseritoDa)) : '') +
      (sp.nota ? rigaInfo(esc(sp.nota), 'riga-spesa-nota') : '') +
      (sp.scadenza ? rigaInfo('Da pagare entro ' + esc(sp.scadenza) + (sp.scadenzaPagata ? ' · ✓ pagata' : '')) : '') +
      (sp.foto ? '<a class="link-scontrino" href="' + esc(sp.foto) + '" target="_blank">Vedi scontrino</a>' : ''),
      euro(sp.importo));
    div.appendChild(pulsantiVoce(
      bottoneVoce('Modifica', 'secondario', function () { apriModificaSpesa(sp, tornaA); }, ICONA_MATITA),
      bottoneVoce('Elimina', 'bottone-elimina', function () {
        chiedi('Vuoi eliminare questa spesa?\n' + sp.data + ' – ' + euro(sp.importo) + '\n' + sp.fornitore,
          'Sì, elimina', 'No', function () {
            chiama('eliminaSpesa', [stato.pin, sp.id], function () {
              mostraSalvato('Eliminata ✓', function () { tornaERicarica(tornaA); });
            }, { attesa: 'Eliminazione in corso…' });
          });
      }, ICONA_CESTINO)));
    return div;
  }

  function creaVoceChiusura(c, tornaA) {
    var div = document.createElement('div');
    div.className = 'voce voce-chiusura';
    div.innerHTML = testaVoce(esc(c.giorno) + ' ' + esc(c.data),
      rigaInfo('Contanti ' + euro(c.contanti) + ' · POS ' + euro(c.pos) +
        (c.fondo ? ' · Fondo cassa ' + euro(c.fondo) : '')) +
      (c.inseritoDa ? rigaInfo('Inserita da ' + esc(c.inseritoDa)) : '') +
      (c.note ? rigaInfo(esc(c.note), 'riga-spesa-nota') : '') + pillolaQuadratura(c),
      euro(c.totale));
    div.appendChild(pulsantiVoce(
      bottoneVoce('Modifica', 'secondario', function () { apriModificaChiusura(c, tornaA); }, ICONA_MATITA),
      bottoneVoce('Elimina', 'bottone-elimina', function () {
        chiedi('Vuoi eliminare la chiusura cassa del ' + c.data + '?\nTotale ' + euro(c.totale),
          'Sì, elimina', 'No', function () {
            chiama('eliminaChiusura', [stato.pin, c.id], function () {
              mostraSalvato('Eliminata ✓', function () { tornaERicarica(tornaA); });
            }, { attesa: 'Eliminazione in corso…' });
          });
      }, ICONA_CESTINO)));
    return div;
  }

  /** Pillola con la differenza dal registratore telematico (niente se il registratore non è stato scritto). */
  function pillolaQuadratura(c) {
    if (c.registratore === null || c.registratore === undefined) return '';
    var q = calcolaQuadratura(c.contanti, c.pos, c.registratore, stato.tolleranzaCassa);
    var classe = q.esito === 'ok' ? 'pillola-verde' : q.esito === 'eccedenza' ? 'pillola-accento' : 'pillola-rossa';
    return '<span class="pillola ' + classe + '">' + (q.esito === 'ok' ? '✓ ' : '⚠ ') + 'Registratore ' + euro(c.registratore) +
      ' · differenza ' + euroConSegno(q.differenza) + '</span>';
  }

  /** Riga di pulsanti affiancati in fondo a una voce (vanno a capo da soli se lo spazio non basta). */
  function pulsantiVoce() {
    var riga = document.createElement('div');
    riga.className = 'voce-azioni';
    perOgni(arguments, function (b) { riga.appendChild(b); });
    return riga;
  }

  function cambiaMese(passo) {
    var mese = stato.mese + passo;
    var anno = stato.anno;
    if (mese < 1) { mese = 12; anno--; }
    if (mese > 12) { mese = 1; anno++; }
    apriRiepilogo(anno, mese);
  }

  // -------------------------------------------------------------------------
  // Cerca e modifica: elenco di spese e chiusure con ricerca e filtri
  // -------------------------------------------------------------------------

  function apriElenco() {
    $('elenco-testo').value = stato.elenco.testo;
    cercaElenco();
  }

  function leggiFiltriElenco() {
    stato.elenco.testo = trim($('elenco-testo').value);
    stato.elenco.mese = $('elenco-mese').value || '';
    stato.elenco.categoria = $('elenco-categoria').value || '';
    stato.elenco.pagamento = $('elenco-pagamento').value || '';
    stato.elenco.persona = $('elenco-persona').value || '';
  }

  function cercaElenco() {
    var f = stato.elenco;
    chiama('elenco', [stato.pin, {
      tipo: f.tipo, mese: f.mese, categoria: f.categoria, pagamento: f.pagamento, testo: f.testo, persona: f.persona
    }], function (r) {
      disegnaElenco(r);
      mostra('schermo-elenco');
    }, { attesa: 'Cerco…' });
  }

  function disegnaElenco(r) {
    var f = stato.elenco;
    var spese = f.tipo === 'spese';
    perOgni($('elenco-tipo').getElementsByTagName('button'), function (b) {
      b.className = b.getAttribute('data-tipo') === f.tipo ? 'scelto' : '';
    });
    setTesto($('elenco-testo-etichetta'), spese ? 'Cerca fornitore, nota o importo' : 'Cerca nelle note o per importo');
    $('elenco-testo').setAttribute('placeholder', spese ? 'Es. panificio' : 'Es. 350');
    $('elenco-filtri-spese').style.display = spese ? 'block' : 'none';

    var mesi = [{ valore: '', nome: 'Tutti i mesi' }];
    perOgni(r.mesi || [], function (m) { mesi.push(m); });
    if (f.mese && !filtra(mesi, function (m) { return m.valore === f.mese; }).length) mesi.push({ valore: f.mese, nome: f.mese });
    riempiSelect($('elenco-mese'), mesi, f.mese);

    var categorie = [{ valore: '', nome: 'Tutte le categorie' }];
    var viste = {};
    perOgni(stato.categorie.concat(r.categorie || []), function (c) {
      if (!viste[c]) categorie.push({ valore: c, nome: c });
      viste[c] = true;
    });
    riempiSelect($('elenco-categoria'), categorie, f.categoria);

    var pagamenti = [{ valore: '', nome: 'Tutti i pagamenti' }];
    perOgni(stato.pagamenti, function (p) { pagamenti.push({ valore: p, nome: p }); });
    riempiSelect($('elenco-pagamento'), pagamenti, f.pagamento);

    var persone = [{ valore: '', nome: 'Tutti' }];
    perOgni(stato.persone, function (p) { persone.push({ valore: p, nome: p }); });
    if (f.persona && indiceDi(stato.persone, f.persona) < 0) persone.push({ valore: f.persona, nome: f.persona });
    riempiSelect($('elenco-persona'), persone, f.persona);
    $('elenco-filtro-persona').style.display = stato.persone.length ? 'block' : 'none';

    var filtriAttivi = f.testo || f.mese || f.persona || (spese && (f.categoria || f.pagamento));
    $('elenco-azzera').style.display = filtriAttivi ? 'block' : 'none';
    // Con un filtro scelto i filtri restano aperti (si vede cosa si sta guardando)
    if (f.mese || f.persona || (spese && (f.categoria || f.pagamento))) apriDettagli('elenco-filtri-apri');

    var n = r.numero || 0;
    var nome = spese ? (n === 1 ? 'spesa' : 'spese') : (n === 1 ? 'chiusura' : 'chiusure');
    var riassunto;
    if (!n) {
      riassunto = '<span class="riassunto-etichetta">' + (spese ? 'Nessuna spesa trovata.' : 'Nessuna chiusura trovata.') + '</span>';
    } else {
      riassunto = '<span class="riassunto-etichetta">' + (n === 1 ? 'Trovata 1 ' : 'Trovate ' + n + ' ') + nome + ' · ' +
        (spese ? 'totale spese' : 'totale incassi') + '</span>' +
        '<span class="riassunto-cifra">' + euro(r.totale) + '</span>';
      if (r.troncato) riassunto += '<span class="riassunto-nota">Qui sotto le 100 più recenti: usa i filtri per trovare le altre.</span>';
    }
    $('elenco-riassunto').innerHTML = riassunto;
    $('elenco-riassunto').className = 'riassunto ' + (spese ? 'riassunto-spese' : 'riassunto-incassi');

    var contenitore = $('elenco-voci');
    contenitore.innerHTML = '';
    perOgni(r.voci || [], function (v) {
      contenitore.appendChild(spese ? creaVoceSpesa(v, 'elenco') : creaVoceChiusura(v, 'elenco'));
    });
  }

  // -------------------------------------------------------------------------
  // Scadenze
  // -------------------------------------------------------------------------

  function aggiornaContatoreScadenze() {
    var n = Number(stato.scadenzeVicine) || 0;
    var el = $('home-scadenze-numero');
    setTesto(el, String(n));
    el.style.display = n ? 'inline-block' : 'none';
  }

  function apriScadenze() {
    chiama('scadenze', [stato.pin], function (r) {
      disegnaScadenze(r);
      mostra('schermo-scadenze');
    }, { attesa: 'Carico le scadenze…' });
  }

  function disegnaScadenze(r) {
    var daPagare = r.daPagare || [];
    stato.scadenzeVicine = r.vicine || 0;
    var scadute = filtra(daPagare, function (s) { return s.giorni < 0; });
    var oggi = filtra(daPagare, function (s) { return s.giorni === 0; });
    var prossime = filtra(daPagare, function (s) { return s.giorni > 0; });

    $('scadenze-riassunto').innerHTML = daPagare.length ?
      '<span class="riassunto-etichetta">' + (daPagare.length === 1 ? '1 pagamento da fare' : daPagare.length + ' pagamenti da fare') + '</span>' +
      '<span class="riassunto-cifra">' + euro(r.totaleDaPagare) + '</span>' +
      (scadute.length ? '<span class="pillola pillola-rossa">' + scadute.length + (scadute.length === 1 ? ' già scaduta' : ' già scadute') + '</span>' : '') :
      '<span class="riassunto-etichetta positivo">✓ Nessun pagamento nei prossimi ' + (r.giorni || 30) + ' giorni.</span>';

    var contenitore = $('scadenze-elenco');
    contenitore.innerHTML = '';
    var gruppo = function (titolo, elenco) {
      if (!elenco.length) return;
      var h = document.createElement('h3');
      h.className = 'titolo-gruppo';
      setTesto(h, titolo);
      contenitore.appendChild(h);
      perOgni(elenco, function (s) { contenitore.appendChild(creaVoceScadenza(s, false)); });
    };
    gruppo('Scadute, da pagare', scadute);
    gruppo('Da pagare oggi', oggi);
    gruppo('Prossimi giorni', prossime);

    var pagate = $('scadenze-pagate');
    pagate.innerHTML = '';
    if (!(r.pagate || []).length) pagate.innerHTML = '<p class="piccolo vuoto">Nessuna scadenza segnata come pagata nell\'ultimo mese.</p>';
    perOgni(r.pagate || [], function (s) { pagate.appendChild(creaVoceScadenza(s, true)); });
  }

  function creaVoceScadenza(s, pagata) {
    var div = document.createElement('div');
    div.className = 'voce voce-scadenza' + (pagata ? ' pagata' : s.giorni < 0 ? ' scaduta' : s.giorni === 0 ? ' oggi' : '');
    var haImporto = s.importo !== null && s.importo !== undefined && s.importo !== '';
    var quando = '';
    if (!pagata) {
      quando = '<span class="pillola quando ' + (s.giorni < 0 ? 'pillola-rossa' : s.giorni === 0 ? 'pillola-accento' : 'pillola-neutra') + '">' +
        (s.giorni < 0 ? '⚠ ' : '') + esc(s.quando) + '</span>';
    }
    div.innerHTML = testaVoce(esc(s.descrizione),
      rigaInfo(esc(s.giorno) + ' ' + esc(s.data) + (s.tipo ? ' · ' + esc(s.tipo) : '')) + quando +
      (pagata ? rigaInfo('✓ Pagata il ' + esc(s.pagataIl) + (s.pagataDa ? ' da ' + esc(s.pagataDa) : ''), 'riga-spesa-info positivo') : ''),
      haImporto ? euro(s.importo) : '');
    var testoConferma = s.descrizione + (s.importo ? ' – ' + euro(s.importo) : '') + '\nscadenza ' + s.data;
    if (pagata) {
      div.appendChild(bottoneVoce('Non era pagata', 'secondario', function () {
        chiedi('Rimettere tra quelle da pagare?\n' + testoConferma, 'Sì', 'No', function () {
          chiama('segnaScadenzaPagata', [stato.pin, s.id, false, ''], function () {
            mostraSalvato('Fatto ✓', apriScadenze);
          }, { attesa: 'Salvataggio in corso…' });
        });
      }, ICONA_INDIETRO));
    } else {
      div.appendChild(bottoneVoce('Segna pagata', 'verde', function () {
        chiedi('Segnare come pagata?\n' + testoConferma, 'Sì, è pagata', 'No', function () {
          chiama('segnaScadenzaPagata', [stato.pin, s.id, true, personaValida()], function () {
            mostraSalvato('Pagata ✓', apriScadenze);
          }, { attesa: 'Salvataggio in corso…' });
        });
      }, ICONA_SPUNTA));
    }
    return div;
  }

  function apriNuovaScadenza() {
    $('ns-descrizione').value = '';
    $('ns-importo').value = '';
    $('ns-data').value = dataDiOggi();
    stato.frequenza = '';
    stato.idScadenza = nuovoId('D');
    disegnaFrequenze();
    mostra('schermo-nuova-scadenza');
  }

  function disegnaFrequenze() {
    var contenitore = $('ns-frequenze');
    contenitore.innerHTML = '';
    perOgni(NOMI_FREQUENZE, function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      setTesto(b, f.nome);
      if (f.valore === stato.frequenza) b.className = 'scelto';
      b.onclick = function () {
        stato.frequenza = f.valore;
        disegnaFrequenze();
      };
      contenitore.appendChild(b);
    });
  }

  function salvaNuovaScadenza() {
    var descrizione = trim($('ns-descrizione').value);
    var importo = trim($('ns-importo').value);
    if (!descrizione) return mostraErrore('Scrivi che cosa va pagato. Esempio: Affitto');
    if (importo && (leggiImporto(importo) === null || leggiImporto(importo) <= 0)) return mostraErrore('L\'importo non è valido. Esempio: 800,00');
    if (!trim($('ns-data').value)) return mostraErrore('Scrivi la data della scadenza.');
    chiama('nuovaScadenza', [stato.pin, {
      id: stato.idScadenza,
      descrizione: descrizione,
      importo: importo,
      data: trim($('ns-data').value),
      frequenza: stato.frequenza,
      persona: personaValida()
    }], function () {
      mostraSalvato('Salvata ✓', apriScadenze);
    }, { attesa: 'Salvataggio in corso…' });
  }

  // -------------------------------------------------------------------------
  // Scadenze fisse del locale (modelli da attivare)
  // -------------------------------------------------------------------------

  function apriScadenzeFisse() {
    chiama('scadenzeFisse', [stato.pin], function (r) {
      disegnaScadenzeFisse(r);
      mostra('schermo-scadenze-fisse');
    }, { attesa: 'Carico le scadenze fisse…' });
  }

  function disegnaScadenzeFisse(r) {
    var contenitore = $('sf-elenco');
    contenitore.innerHTML = '';
    if (!(r.voci || []).length) {
      contenitore.innerHTML = '<p class="carta lista-vuota">Nessun modello: esegui «Prepara il foglio» dal menu Bar del foglio Google.</p>';
      return;
    }
    perOgni(r.voci, function (v, i) {
      contenitore.appendChild(creaVoceFissa(v, i));
    });
  }

  function creaVoceFissa(v, i) {
    var div = document.createElement('div');
    div.className = 'voce voce-fissa' + (v.attiva ? ' attiva' : '');
    var pillola = v.attiva ?
      '<span class="pillola pillola-verde">✓ Attiva' + (v.prossima ? ' · prossima ' + esc(v.prossima) + ' (' + esc(v.quando) + ')' : '') + '</span>' :
      '<span class="pillola pillola-neutra">Disattivata</span>';
    var opzioni = '';
    perOgni(NOMI_FREQUENZE, function (f) {
      if (f.valore) opzioni += '<option value="' + f.valore + '"' + (f.valore === v.frequenza ? ' selected' : '') + '>' + esc(f.nome) + '</option>';
    });
    div.innerHTML = testaVoce(esc(v.descrizione), pillola, '') +
      '<label for="sf-data-' + i + '">Data della prossima scadenza</label>' +
      '<input type="date" id="sf-data-' + i + '"' + (campoDataSupportato ? '' : ' placeholder="gg/mm/aaaa"') + '>' +
      '<label for="sf-freq-' + i + '">Si ripete</label><select id="sf-freq-' + i + '">' + opzioni + '</select>' +
      '<label for="sf-importo-' + i + '">Importo (€, facoltativo)</label>' +
      '<input type="text" id="sf-importo-' + i + '" inputmode="decimal" autocomplete="off" placeholder="0,00">' +
      '<div class="scelte scelta-singola"><button type="button" id="sf-attiva-' + i + '"></button></div>';
    var attiva = v.attiva;
    var toccato = false;
    var campoData = div.getElementsByTagName('input')[0];
    var campoImporto = div.getElementsByTagName('input')[1];
    var pulsante = div.getElementsByTagName('button')[0];
    campoData.value = v.dataIso ? dataPerCampo(v.dataIso) : '';
    campoImporto.value = v.importo ? numeroPerCampo(v.importo) : '';
    var aggiorna = function () {
      pulsante.className = attiva ? 'scelto' : '';
      setTesto(pulsante, attiva ? 'Promemoria attivo' : 'Promemoria spento (tocca per attivarlo)');
    };
    aggiorna();
    pulsante.onclick = function () { attiva = !attiva; toccato = true; aggiorna(); };
    var dataScritta = function () {
      // Chi scrive la data di solito vuole attivarla: la attivo io (si può sempre spegnere).
      if (!toccato && !attiva && trim(campoData.value)) { attiva = true; aggiorna(); }
    };
    aggiungiEvento(campoData, 'change', dataScritta);
    aggiungiEvento(campoData, 'input', dataScritta);
    div.appendChild(bottoneVoce('Salva', 'primario bottone-largo', function () {
      var importo = trim(campoImporto.value);
      if (attiva && !trim(campoData.value)) return mostraErrore('Per attivare il promemoria scrivi la data della prossima scadenza.');
      if (importo && (leggiImporto(importo) === null || leggiImporto(importo) <= 0)) return mostraErrore('L\'importo non è valido. Esempio: 350,00');
      chiama('salvaScadenzaFissa', [stato.pin, {
        id: v.id, data: trim(campoData.value), frequenza: $('sf-freq-' + i).value, importo: importo, attiva: attiva, persona: personaValida()
      }], function (r) {
        mostraSalvato('Salvato ✓', function () {
          disegnaScadenzeFisse(r);
          mostra('schermo-scadenze-fisse');
        });
      }, { attesa: 'Salvataggio in corso…' });
    }, ICONA_SPUNTA));
    return div;
  }

  // -------------------------------------------------------------------------
  // Da ordinare: lista condivisa e messaggi d'ordine su WhatsApp
  // -------------------------------------------------------------------------

  var SENZA_FORNITORE = 'Senza fornitore';
  var invioProdotti = { timer: {}, inVolo: 0, funzioni: {} };

  function aggiornaContatoreOrdini() {
    var n = Number(stato.daOrdinare) || 0;
    var el = $('home-ordini-numero');
    setTesto(el, String(n));
    el.style.display = n ? 'inline-block' : 'none';
  }

  function apriOrdini() {
    chiama('riordino', [stato.pin], function (r) {
      stato.riordino = r;
      stato.rapido = null;
      $('ordini-cerca').value = '';
      disegnaOrdini();
      mostra('schermo-ordini');
    }, { attesa: 'Carico la lista…' });
  }

  function formatoQuantita(n) { return String(n).replace('.', ','); }

  /** Testo del messaggio d'ordine per un fornitore. */
  function messaggioOrdine(prodotti) {
    var righe = ['Buongiorno, vorrei ordinare per il bar:'];
    perOgni(prodotti, function (p) {
      var unita = unitaPerQuantita(p.unita, p.quantita, p.unitaPlurale);
      var q = p.quantita ? formatoQuantita(p.quantita) + (unita ? ' ' + unita : '') : (p.unita || '');
      righe.push('- ' + p.nome + (q ? ': ' + q : ''));
    });
    righe.push('Grazie!');
    return righe.join('\n');
  }

  function linkWhatsApp(numero, testo) {
    return 'https://wa.me/' + (numero || '') + '?text=' + encodeURIComponent(testo);
  }

  function disegnaOrdini() {
    var r = stato.riordino;
    var prodotti = r.prodotti || [];
    var daOrdinare = filtra(prodotti, function (p) { return p.daOrdinare; });
    stato.daOrdinare = daOrdinare.length;

    // Lista per fornitore
    var gruppi = {};
    var nomi = [];
    perOgni(daOrdinare, function (p) {
      var f = p.fornitore || SENZA_FORNITORE;
      if (!gruppi[f]) { gruppi[f] = []; nomi.push(f); }
      gruppi[f].push(p);
    });
    nomi.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
    var contenitore = $('ordini-fornitori');
    contenitore.innerHTML = '';
    if (!nomi.length) {
      contenitore.innerHTML = '<p class="carta lista-vuota positivo">La lista è vuota: non c\'è niente da ordinare ✓</p>';
    }
    var pannelloRimesso = false;
    perOgni(nomi, function (f) {
      var div = document.createElement('div');
      div.className = 'carta ordine-fornitore';
      // Intestazione: nome del fornitore e «+ Prodotto» sulla stessa riga
      var testa = document.createElement('div');
      testa.className = 'ordine-testa';
      var titolo = document.createElement('h3');
      setTesto(titolo, f);
      var cellaTitolo = document.createElement('div');
      cellaTitolo.className = 'ordine-testa-nome';
      cellaTitolo.appendChild(titolo);
      testa.appendChild(cellaTitolo);
      if (f !== SENZA_FORNITORE) {
        var cellaPiu = document.createElement('div');
        cellaPiu.className = 'ordine-testa-piu';
        var aggiungi = document.createElement('button');
        aggiungi.type = 'button';
        aggiungi.className = 'secondario aggiungi-rapido';
        aggiungi.innerHTML = icona('<path d="M12 5v14M5 12h14"/>', 18) + 'Prodotto';
        aggiungi.setAttribute('aria-label', 'Aggiungi un prodotto di ' + f);
        aggiungi.onclick = function () { apriAggiungiRapido(f); };
        cellaPiu.appendChild(aggiungi);
        testa.appendChild(cellaPiu);
      }
      div.appendChild(testa);
      if (stato.rapido && stato.rapido.fornitore === f) {
        div.appendChild(stato.rapido.nodo);
        pannelloRimesso = true;
      }
      perOgni(gruppi[f], function (p) { div.appendChild(creaRigaOrdine(p)); });

      var numero = f === SENZA_FORNITORE ? '' : ((r.numeri || {})[f] || '');
      if (!numero) {
        var nota = document.createElement('p');
        nota.className = 'nota-fornitore';
        setTesto(nota, f === SENZA_FORNITORE ?
          'Questi prodotti non hanno un fornitore: in WhatsApp sceglierai tu a chi mandare il messaggio.' :
          'Manca il numero WhatsApp di questo fornitore (scheda Fornitori, colonna D): in WhatsApp sceglierai tu il contatto.');
        div.appendChild(nota);
      }
      var link = document.createElement('a');
      link.className = 'bottone verde bottone-link';
      link.href = linkWhatsApp(numero, messaggioOrdine(gruppi[f]));
      link.target = '_blank';
      link.innerHTML = ICONA_CHAT + 'Invia l\'ordine su WhatsApp';
      div.appendChild(link);
      div.appendChild(bottoneVoce('Ordine inviato: svuota la lista di ' + f, 'secondario bottone-largo', function () {
        chiedi('Hai mandato l\'ordine a ' + f + '?\nI suoi prodotti vengono tolti dalla lista.', 'Sì, svuota', 'No', function () {
          quandoListaSalvata(function () {
            chiama('svuotaOrdine', [stato.pin, f], function (nuovo) {
              stato.riordino = nuovo;
              disegnaOrdini();
              mostra('schermo-ordini');
            }, { attesa: 'Salvataggio in corso…' });
          });
        });
      }));
      contenitore.appendChild(div);
    });
    // Se la scheda del fornitore non c'è più (lista svuotata), l'aggiunta rapida si chiude.
    if (stato.rapido && !pannelloRimesso) stato.rapido = null;
    if (stato.rapido) rimettiFocusRapido();
    disegnaProdotti();
    var evidenziate = contenitore.getElementsByTagName('div');
    if (stato.evidenziato) {
      stato.evidenziato = '';
      setTimeout(function () {
        for (var i = 0; i < evidenziate.length; i++) {
          if (/ evidenziata/.test(evidenziate[i].className)) evidenziate[i].className = evidenziate[i].className.replace(' evidenziata', '');
        }
      }, 1600);
    }
  }

  function creaRigaOrdine(p) {
    var riga = document.createElement('div');
    riga.className = 'riga-prodotto' + (stato.evidenziato && p.id === stato.evidenziato ? ' evidenziata' : '');
    // In alto: nome del prodotto e «Togli»; sotto: − quantità +
    var alto = document.createElement('div');
    alto.className = 'riga-prodotto-alto';
    var nome = document.createElement('div');
    nome.className = 'riga-prodotto-nome';
    nome.innerHTML = '<b>' + esc(p.nome) + '</b>' +
      (p.segnatoDa ? '<span class="riga-spesa-info">Segnato da ' + esc(p.segnatoDa) + '</span>' : '');
    var cellaTogli = document.createElement('div');
    cellaTogli.className = 'riga-prodotto-togli';
    var togli = document.createElement('button');
    togli.type = 'button';
    togli.className = 'bottone-elimina togli';
    togli.innerHTML = ICONA_CESTINO + 'Togli';
    togli.onclick = function () { cambiaProdotto(p, false, 0); };
    cellaTogli.appendChild(togli);
    alto.appendChild(nome);
    alto.appendChild(cellaTogli);

    var q = document.createElement('div');
    q.className = 'quantita';
    var meno = document.createElement('button');
    meno.type = 'button';
    meno.className = 'tasto-quantita';
    meno.setAttribute('aria-label', 'Uno in meno');
    setTesto(meno, '−');
    meno.onclick = function () { cambiaProdotto(p, true, Math.max(0, (p.quantita || 0) - 1)); };
    var valore = document.createElement('span');
    valore.className = 'valore';
    setTesto(valore, p.quantita ? formatoQuantita(p.quantita) + ' ' + unitaPerQuantita(p.unita, p.quantita, p.unitaPlurale) : 'quantità?');
    var piu = document.createElement('button');
    piu.type = 'button';
    piu.className = 'tasto-quantita';
    setTesto(piu, '+');
    piu.setAttribute('aria-label', 'Uno in più');
    piu.onclick = function () { cambiaProdotto(p, true, (p.quantita || 0) + 1); };
    var cella = function (el, classe) {
      var c = document.createElement('span');
      c.className = classe;
      c.appendChild(el);
      q.appendChild(c);
    };
    cella(meno, 'quantita-tasto');
    cella(valore, 'quantita-valore');
    cella(piu, 'quantita-tasto');
    riga.appendChild(alto);
    riga.appendChild(q);
    return riga;
  }

  function disegnaProdotti() {
    var cerca = trim($('ordini-cerca').value).toLowerCase();
    var contenitore = $('ordini-prodotti');
    contenitore.innerHTML = '';
    var ultimoGruppo = null;
    var mostrati = 0;
    perOgni(stato.riordino.prodotti || [], function (p) {
      if (cerca && p.nome.toLowerCase().indexOf(cerca) < 0 && (p.fornitore || '').toLowerCase().indexOf(cerca) < 0) return;
      var gruppo = p.fornitore || SENZA_FORNITORE;
      if (gruppo !== ultimoGruppo) {
        var h = document.createElement('p');
        h.className = 'gruppo-prodotti';
        setTesto(h, gruppo);
        contenitore.appendChild(h);
        ultimoGruppo = gruppo;
      }
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'prodotto' + (p.daOrdinare ? ' scelto' : '');
      setTesto(b, (p.daOrdinare ? '✓ ' : '+ ') + p.nome + (p.unita ? ' (' + p.unita + ')' : ''));
      b.onclick = function () { cambiaProdotto(p, !p.daOrdinare, p.daOrdinare ? 0 : 1); };
      contenitore.appendChild(b);
      mostrati++;
    });
    if (!mostrati) {
      contenitore.innerHTML = '<p class="piccolo">' + (cerca ? 'Nessun prodotto trovato.' :
        'Non ci sono ancora prodotti: aggiungili con «+ Nuovo prodotto» o nella scheda Prodotti del foglio.') + '</p>';
    }
  }

  /**
   * Cambia subito la lista sullo schermo e salva dopo un attimo (così si può
   * premere + più volte senza aspettare). Se il salvataggio non riesce lo dice.
   */
  function cambiaProdotto(p, daOrdinare, quantita) {
    if (daOrdinare && !p.daOrdinare) ricordaOrdinato(p.id);
    p.daOrdinare = daOrdinare;
    p.quantita = daOrdinare ? quantita : 0;
    p.segnatoDa = daOrdinare ? personaValida() : '';
    disegnaOrdini();
    if (invioProdotti.timer[p.id]) clearTimeout(invioProdotti.timer[p.id]);
    invioProdotti.funzioni[p.id] = function () {
      delete invioProdotti.timer[p.id];
      delete invioProdotti.funzioni[p.id];
      invioProdotti.inVolo++;
      google.script.run
        .withSuccessHandler(function (r) {
          invioProdotti.inVolo--;
          if (r && r.ok) {
            // Aggiorno con i dati del foglio (anche le modifiche degli altri) solo se non ci sono altri invii in corso.
            if (!invioProdotti.inVolo && !Object.keys(invioProdotti.timer).length) {
              stato.riordino = r;
              if (stato.schermo === 'schermo-ordini') disegnaOrdini();
            }
          } else {
            mostraErrore((r && r.messaggio) || 'La lista non è stata salvata.', apriOrdini);
          }
        })
        .withFailureHandler(function () {
          invioProdotti.inVolo--;
          mostraErrore('Non riesco a salvare la lista: manca internet?\nPremi «Riprova» per ricaricarla.', apriOrdini);
        })
        .impostaDaOrdinare(stato.pin, p.id, daOrdinare, p.quantita, personaValida());
    };
    invioProdotti.timer[p.id] = setTimeout(invioProdotti.funzioni[p.id], 700);
  }

  /** Invia subito le modifiche ancora in attesa (prima di svuotare o uscire). */
  function inviaProdottiSubito() {
    for (var id in invioProdotti.funzioni) {
      if (invioProdotti.funzioni.hasOwnProperty(id)) {
        clearTimeout(invioProdotti.timer[id]);
        invioProdotti.funzioni[id]();
      }
    }
  }

  // -------------------------------------------------------------------------
  // Aggiunta rapida dalla scheda di un fornitore
  // -------------------------------------------------------------------------

  /** Quante volte ogni prodotto è stato messo in lista da questo dispositivo (id → volte). */
  function leggiOrdinati() {
    try { return JSON.parse(window.localStorage.getItem(CHIAVE_ORDINATI) || '{}') || {}; } catch (e) { return {}; }
  }

  function ricordaOrdinato(id) {
    try {
      var o = leggiOrdinati();
      o[id] = (o[id] || 0) + 1;
      window.localStorage.setItem(CHIAVE_ORDINATI, JSON.stringify(o));
    } catch (e) { /* non disponibile */ }
  }

  function apriAggiungiRapido(fornitore) {
    if (stato.rapido && stato.rapido.fornitore === fornitore) return chiudiAggiungiRapido();
    var nodo = document.createElement('div');
    nodo.className = 'aggiungi-pannello';
    var campo = document.createElement('input');
    campo.type = 'text';
    campo.id = 'rapido-campo';
    campo.autocomplete = 'off';
    campo.maxLength = 80;
    campo.setAttribute('placeholder', 'Cerca o scrivi un prodotto');
    campo.setAttribute('autocapitalize', 'sentences');
    var suggerimenti = document.createElement('div');
    suggerimenti.id = 'rapido-suggerimenti';
    suggerimenti.className = 'suggerimenti suggerimenti-prodotti';
    var pillole = document.createElement('div');
    pillole.id = 'rapido-pillole';
    var fatto = document.createElement('button');
    fatto.type = 'button';
    fatto.id = 'rapido-fatto';
    fatto.className = 'primario';
    fatto.innerHTML = icona('<path d="M5 12.5l4.5 4.5L19 7.5"/>') + 'Fatto';
    fatto.onclick = chiudiAggiungiRapido;
    nodo.appendChild(campo);
    nodo.appendChild(suggerimenti);
    nodo.appendChild(pillole);
    nodo.appendChild(fatto);
    campo.oninput = function () { mostraSuggerimentiRapidi(); portaInVistaRapido(); };
    campo.onkeydown = function (e) {
      var tasto = e ? (e.keyCode || e.which) : 0;
      if (tasto !== 13) return;
      if (e.preventDefault) e.preventDefault();
      var testo = trim(campo.value).replace(/\s+/g, ' ');
      if (!testo) return;
      var trovati = cercaProdotti(stato.riordino.prodotti || [], fornitore, testo);
      var esatto = prodottoEsistente(stato.riordino.prodotti || [], fornitore, testo);
      if (esatto) aggiungiRapido(esatto);
      else if (trovati.length === 1) aggiungiRapido(trovati[0]);
      else aggiungiNuovoRapido(testo);
    };
    stato.rapido = { fornitore: fornitore, nodo: nodo, campo: campo };
    disegnaOrdini();
    setTimeout(portaInVistaRapido, 300);
    setTimeout(portaInVistaRapido, 800);
  }

  function chiudiAggiungiRapido() {
    stato.rapido = null;
    disegnaOrdini();
  }

  function rimettiFocusRapido() {
    mostraSuggerimentiRapidi();
    try { stato.rapido.campo.focus(); } catch (e) { /* niente */ }
    portaInVistaRapido();
  }

  /** La tastiera sale: porto il campo in alto, così restano visibili campo e suggerimenti. */
  function portaInVistaRapido() {
    if (!stato.rapido) return;
    try {
      var r = stato.rapido.campo.getBoundingClientRect();
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      if (r.top < 70 || r.top > 150) window.scrollTo(0, Math.max(0, y + r.top - 100));
    } catch (e) { /* niente */ }
  }

  function bottoneRapido(testo, classe, alClic) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    setTesto(b, testo);
    // Il tocco non deve togliere il focus al campo: la tastiera resta aperta.
    b.onmousedown = function (e) { if (e && e.preventDefault) e.preventDefault(); };
    b.onclick = alClic;
    return b;
  }

  /** Suggerimenti mentre si scrive; a campo vuoto, i prodotti più ordinati come pillole. */
  function mostraSuggerimentiRapidi() {
    var r = stato.rapido;
    if (!r) return;
    var prodotti = stato.riordino.prodotti || [];
    var testo = trim(r.campo.value).replace(/\s+/g, ' ');
    var box = $('rapido-suggerimenti');
    var pillole = $('rapido-pillole');
    box.innerHTML = '';
    pillole.innerHTML = '';
    if (!testo) {
      box.style.display = 'none';
      var top = piuOrdinati(prodotti, r.fornitore, leggiOrdinati());
      if (top.length) {
        var et = document.createElement('p');
        et.className = 'piccolo etichetta-rapida';
        setTesto(et, 'Più ordinati');
        pillole.appendChild(et);
      }
      perOgni(top, function (p) {
        pillole.appendChild(bottoneRapido(p.nome, 'pillola-prodotto', function () { aggiungiRapido(p); }));
      });
      pillole.style.display = top.length ? 'block' : 'none';
      return;
    }
    pillole.style.display = 'none';
    perOgni(cercaProdotti(prodotti, r.fornitore, testo), function (p) {
      var etichetta = p.nome + (p.unita ? ' (' + p.unita + ')' : '') +
        (p.daOrdinare ? ' · già in lista' + (p.quantita ? ': ' + formatoQuantita(p.quantita) : '') : '');
      box.appendChild(bottoneRapido(etichetta, p.daOrdinare ? 'in-lista' : '', function () { aggiungiRapido(p); }));
    });
    if (!prodottoEsistente(prodotti, r.fornitore, testo)) {
      box.appendChild(bottoneRapido('Aggiungi "' + testo + '" come nuovo prodotto', 'nuovo', function () { aggiungiNuovoRapido(testo); }));
    }
    box.style.display = 'block';
  }

  /** Mette in lista il prodotto (quantità 1, o +1 se c'è già) e svuota il campo, che resta aperto. */
  function aggiungiRapido(p) {
    var r = stato.rapido;
    if (r) r.campo.value = '';
    stato.evidenziato = p.id;
    cambiaProdotto(p, true, quantitaDopoAggiunta(p));
  }

  function aggiungiNuovoRapido(testo) {
    var r = stato.rapido;
    var nome = trim(testo).replace(/\s+/g, ' ');
    if (!r || !nome) return;
    var prodotti = stato.riordino.prodotti || [];
    var esistente = prodottoEsistente(prodotti, r.fornitore, nome);
    if (esistente) return aggiungiRapido(esistente);
    var dati = {
      nome: nome,
      fornitore: r.fornitore,
      unita: unitaPredefinita(prodotti, r.fornitore),
      daOrdinare: true,
      persona: personaValida()
    };
    quandoListaSalvata(function () {
      chiama('nuovoProdotto', [stato.pin, dati], function (nuovoStato) {
        stato.riordino = nuovoStato;
        if (stato.rapido) stato.rapido.campo.value = '';
        var creato = prodottoEsistente(nuovoStato.prodotti || [], dati.fornitore, nome);
        if (creato) {
          stato.evidenziato = creato.id;
          ricordaOrdinato(creato.id);
          cambiaProdotto(creato, true, 1);   // il server l'ha messo in lista senza quantità: la porto a 1
        } else {
          disegnaOrdini();
        }
      }, { attesa: 'Salvataggio in corso…' });
    });
  }

  function apriNuovoProdotto() {
    $('np-nome').value = '';
    $('np-unita').value = '';
    $('np-fornitore-nuovo').value = '';
    var opzioni = [{ valore: '', nome: '— Nessun fornitore —' }];
    perOgni(stato.riordino.fornitori || stato.fornitori, function (f) { opzioni.push({ valore: f, nome: f }); });
    opzioni.push({ valore: '__nuovo__', nome: '+ Nuovo fornitore…' });
    riempiSelect($('np-fornitore'), opzioni, '');
    $('np-riquadro-fornitore-nuovo').style.display = 'none';
    stato.prodottoSubito = true;
    $('np-subito').className = 'scelto';
    setTesto($('np-subito'), 'Mettilo subito nella lista da ordinare');
    mostra('schermo-nuovo-prodotto');
  }

  function salvaNuovoProdotto() {
    var nome = trim($('np-nome').value);
    if (!nome) return mostraErrore('Scrivi il nome del prodotto.');
    var fornitore = $('np-fornitore').value === '__nuovo__' ? trim($('np-fornitore-nuovo').value) : $('np-fornitore').value;
    var dati = {
      nome: nome,
      fornitore: fornitore,
      unita: trim($('np-unita').value),
      daOrdinare: stato.prodottoSubito,
      persona: personaValida()
    };
    quandoListaSalvata(function () {
      chiama('nuovoProdotto', [stato.pin, dati], function (r) {
        stato.riordino = r;
        if (fornitore) ricordaFornitore(fornitore);
        mostraSalvato('Salvato ✓', function () {
          $('ordini-cerca').value = '';
          disegnaOrdini();
          mostra('schermo-ordini');
        });
      }, { attesa: 'Salvataggio in corso…' });
    });
  }

  /**
   * Prima di svuotare la lista o aggiungere un prodotto: invia le modifiche ancora in
   * attesa e aspetta che il server le abbia salvate (così non si sovrappongono).
   */
  function quandoListaSalvata(poi) {
    inviaProdottiSubito();
    var inizio = new Date().getTime();
    mostraAttesa('Salvataggio in corso…');
    var controlla = function () {
      if (!invioProdotti.inVolo || new Date().getTime() - inizio > 30000) {
        chiudiPannelli();
        poi();
      } else {
        setTimeout(controlla, 200);
      }
    };
    controlla();
  }


  // -------------------------------------------------------------------------
  // Controlli di oggi (registro HACCP)
  // -------------------------------------------------------------------------

  var numeroCampoHaccp = 0;

  function aggiornaContatoreHaccp() {
    var n = Number(stato.haccpDaFare) || 0;
    var el = $('home-haccp-numero');
    setTesto(el, String(n));
    el.style.display = n ? 'inline-block' : 'none';
  }

  function apriHaccp() {
    chiama('controlliHaccp', [stato.pin], function (r) {
      stato.haccp = r;
      $('haccp-pdf-esito').style.display = 'none';
      disegnaHaccp();
      mostra('schermo-haccp');
    }, { attesa: 'Carico i controlli…' });
  }

  /** "3,5" / "-18" / "−18,5" → numero (un decimale); null se non è un numero. */
  function leggiTemperatura(testo) {
    var t = String(testo || '').replace(/[°C\s]/gi, '').replace(/[−–]/g, '-').replace(',', '.');
    if (!/^-?\d+(\.\d+)?$/.test(t)) return null;
    var n = Math.round(parseFloat(t) * 10) / 10;
    return n >= -60 && n <= 150 ? n : null;
  }

  function fuoriRange(valore, min, max) {
    if (valore === null) return false;
    return (min !== null && min !== undefined && valore < min) || (max !== null && max !== undefined && valore > max);
  }

  function gradi(n) { return String(n).replace('.', ',') + ' °C'; }

  function limitiTemperatura(c) {
    if (c.min !== null && c.max !== null) return 'da ' + gradi(c.min) + ' a ' + gradi(c.max);
    if (c.min !== null) return 'almeno ' + gradi(c.min);
    if (c.max !== null) return 'al massimo ' + gradi(c.max);
    return '';
  }

  function oraAdesso() {
    var d = new Date();
    return due(d.getHours()) + ':' + due(d.getMinutes());
  }

  function oggiIso() {
    var d = new Date();
    return d.getFullYear() + '-' + due(d.getMonth() + 1) + '-' + due(d.getDate());
  }

  function disegnaHaccp() {
    var r = stato.haccp;
    var controlli = r.controlli || [];
    var oggi = filtra(controlli, function (c) { return !c.fatto && c.frequenza !== 'settimanale'; });
    var settimana = filtra(controlli, function (c) { return !c.fatto && c.frequenza === 'settimanale'; });
    var fatti = filtra(controlli, function (c) { return c.fatto; });
    stato.haccpDaFare = oggi.length + settimana.length;

    setTesto($('haccp-data'), r.oggi ? 'Oggi è ' + r.oggi : '');
    disegnaPersonaHaccp();

    var riassunto;
    if (!controlli.length) {
      riassunto = '<span class="riassunto-etichetta">Non ci sono controlli da fare.</span>' +
        '<span class="riassunto-nota">Aggiungili nella scheda «Controlli HACCP» del foglio Google ' +
        (r.configurato ? '' : '(esegui prima «Prepara il foglio» dal menu Bar)') + '.</span>';
    } else if (!oggi.length && !settimana.length) {
      riassunto = '<span class="riassunto-etichetta positivo">✓ Tutti i controlli sono fatti.</span>';
    } else {
      riassunto = '<span class="riassunto-etichetta">' + (oggi.length === 1 ? '1 controllo da fare oggi' :
        oggi.length + ' controlli da fare oggi') + '</span>' +
        (settimana.length ? '<span class="riassunto-nota">+ ' + settimana.length + ' da fare entro domenica</span>' : '') +
        (oggi.length ? '<span class="riassunto-nota">Se alle ' + esc(r.oraLimite) + ' non sono fatti arriva un\'email di promemoria.</span>' : '');
    }
    $('haccp-riassunto').innerHTML = riassunto;
    $('haccp-riassunto').className = 'riassunto riassunto-interno' + (!oggi.length && !settimana.length && controlli.length ? ' riassunto-incassi' : '');

    var contenitore = $('haccp-elenco');
    contenitore.innerHTML = '';
    var gruppo = function (titolo, elenco) {
      if (!elenco.length) return;
      var h = document.createElement('h3');
      h.className = 'titolo-gruppo';
      setTesto(h, titolo);
      contenitore.appendChild(h);
      perOgni(elenco, function (c) { contenitore.appendChild(creaVoceHaccp(c, false)); });
    };
    gruppo('Da fare oggi', oggi);
    gruppo('Da fare questa settimana (' + (r.settimana || '') + ')', settimana);
    gruppo('Già fatti', fatti);

    riempiSelect($('haccp-mese'), r.mesi || [], $('haccp-mese').value || ((r.mesi || [])[0] || {}).valore);
  }

  function disegnaPersonaHaccp() {
    var riga = $('haccp-persona');
    if (!stato.persone.length) {
      riga.style.display = 'none';
      return;
    }
    var nome = personaValida();
    $('haccp-persona-testo').innerHTML = nome ? 'Controlli fatti da <b>' + esc(nome) + '</b>' : 'Non hai scelto il tuo nome';
    setTesto($('haccp-persona-cambia'), nome ? 'Cambia' : 'Sceglilo');
    riga.style.display = 'block';
  }

  /** Riquadro di un controllo: modulo da compilare oppure (se già fatto) l'ultima registrazione. */
  function creaVoceHaccp(c, riapri) {
    var div = document.createElement('div');
    var u = c.ultima;
    var fuoriPrima = !!(u && u.esito === 'FUORI RANGE');
    div.className = 'voce voce-haccp' + (c.fatto && !riapri ? (fuoriPrima ? ' fuori-range' : ' fatto') : '');
    var info = '';
    if (c.tipo === 'temperatura') info += rigaInfo('Temperatura ' + esc(limitiTemperatura(c)));
    else if (c.tipo === 'nota') info += rigaInfo('Da annotare');
    else info += rigaInfo(c.frequenza === 'settimanale' ? 'Una volta a settimana' : 'Ogni giorno');
    if (c.istruzioni) info += rigaInfo(esc(c.istruzioni), 'riga-spesa-nota');

    if (c.fatto && !riapri) {
      info += rigaInfo('✓ ' + (c.tipo !== 'spunta' ? '<b>' + esc(u.valore) + '</b> · ' : 'Fatto · ') +
        (c.frequenza === 'settimanale' ? esc(u.data) + ' ' : '') + 'alle ' + esc(u.ora) +
        (u.persona ? ' · ' + esc(u.persona) : ''), 'riga-spesa-info ' + (fuoriPrima ? 'negativo' : 'positivo'));
      if (fuoriPrima) info += '<span class="pillola pillola-rossa">⚠ Fuori dai limiti</span>';
      if (u.note) info += rigaInfo((fuoriPrima ? 'Azione correttiva: ' : '') + esc(u.note), 'riga-spesa-nota');
      div.innerHTML = testaVoce(esc(c.nome), info, '');
      div.appendChild(bottoneVoce('Registra di nuovo', 'secondario', function () {
        div.parentNode.replaceChild(creaVoceHaccp(c, true), div);
      }, ICONA_MATITA));
      return div;
    }

    div.innerHTML = testaVoce(esc(c.nome), info, '');
    var n = ++numeroCampoHaccp;
    if (c.tipo === 'temperatura') {
      var riga = document.createElement('div');
      riga.className = 'riga-temperatura';
      riga.innerHTML = '<span class="riga-temperatura-campo"><input type="text" id="haccp-t-' + n + '" class="campo-temperatura" ' +
        'inputmode="decimal" autocomplete="off" maxlength="6" placeholder="°C" aria-label="Temperatura in gradi"></span>' +
        '<span class="riga-temperatura-segno"><button type="button" class="tasto-segno" aria-label="Sotto zero o sopra zero">−/+</button></span>';
      div.appendChild(riga);
      var avviso = document.createElement('span');
      avviso.className = 'avviso-fuori';
      avviso.style.display = 'none';
      div.appendChild(avviso);
      var etichetta = document.createElement('label');
      etichetta.setAttribute('for', 'haccp-n-' + n);
      etichetta.style.display = 'none';
      etichetta.innerHTML = '<span class="etichetta-obbligatoria">Azione correttiva (obbligatoria)</span>';
      div.appendChild(etichetta);
      var nota = document.createElement('input');
      nota.type = 'text';
      nota.id = 'haccp-n-' + n;
      nota.maxLength = 300;
      nota.style.display = 'none';
      nota.setAttribute('autocomplete', 'off');
      nota.setAttribute('placeholder', 'Es. regolato il termostato, merce spostata');
      div.appendChild(nota);
      var campo = riga.getElementsByTagName('input')[0];
      var controlla = function () {
        var t = leggiTemperatura(campo.value);
        var fuori = fuoriRange(t, c.min, c.max);
        campo.className = 'campo-temperatura' + (fuori ? ' fuori' : '');
        avviso.style.display = fuori ? 'block' : 'none';
        etichetta.style.display = fuori ? 'block' : 'none';
        nota.style.display = fuori ? 'block' : 'none';
        setTesto(avviso, fuori ? '⚠ ' + gradi(t) + ': fuori dai limiti (' + limitiTemperatura(c) + '). Scrivi cosa hai fatto.' : '');
        div.className = 'voce voce-haccp' + (fuori ? ' fuori-range' : '');
        return { t: t, fuori: fuori };
      };
      aggiungiEvento(campo, 'input', controlla);
      aggiungiEvento(campo, 'keyup', controlla);
      riga.getElementsByTagName('button')[0].onclick = function () {
        var v = trim(campo.value).replace(/^[−–]/, '-');
        campo.value = v.charAt(0) === '-' ? v.substring(1) : '-' + v;
        controlla();
      };
      div.appendChild(bottoneVoce('Registra temperatura', 'primario bottone-largo', function () {
        var esito = controlla();
        if (!trim(campo.value)) return mostraErrore('Scrivi la temperatura letta sul termometro. Esempio: 3,5 (o -18 per il congelatore).');
        if (esito.t === null) return mostraErrore('La temperatura non è valida. Esempio: 3,5 oppure -18');
        if (esito.fuori && !trim(nota.value)) {
          nota.className = 'campo-da-compilare';
          return mostraErrore('La temperatura è fuori dai limiti (' + limitiTemperatura(c) + ').\nScrivi l\'azione correttiva: ' +
            'cosa hai fatto (per esempio «regolato il termostato», «merce spostata nell\'altro frigo»).');
        }
        registraHaccp(c, String(esito.t), trim(nota.value), (esito.fuori ? '⚠ ' : '') + gradi(esito.t));
      }, ICONA_SPUNTA));
    } else if (c.tipo === 'nota') {
      var testo = document.createElement('input');
      testo.type = 'text';
      testo.maxLength = 300;
      testo.setAttribute('autocomplete', 'off');
      testo.setAttribute('placeholder', 'Scrivi qui');
      testo.setAttribute('aria-label', c.nome);
      div.appendChild(testo);
      div.appendChild(bottoneVoce('Salva nota', 'primario bottone-largo', function () {
        if (!trim(testo.value)) return mostraErrore('Scrivi la nota prima di salvarla.');
        registraHaccp(c, trim(testo.value), '', trim(testo.value));
      }, ICONA_SPUNTA));
    } else {
      div.appendChild(bottoneVoce('Fatto', 'verde bottone-largo', function () {
        registraHaccp(c, 'Fatto', '', 'fatto');
      }, ICONA_SPUNTA));
    }
    return div;
  }

  function registraHaccp(c, valore, note, descrizione) {
    var dati = {
      id: nuovoId('H'),
      idControllo: c.id,
      nome: c.nome,
      tipo: c.tipo,
      min: c.min,
      max: c.max,
      valore: valore,
      note: note,
      persona: personaValida(),
      data: oggiIso(),
      ora: oraAdesso()
    };
    var inCoda = function () {
      mettiInCoda({
        chiave: dati.id,
        funzione: 'registraControlloHaccp',
        argomenti: [dati],
        descrizione: 'Controllo HACCP del ' + dataLeggibile(dati.data) + ' – ' + c.nome + ': ' + descrizione
      }, function () {
        // Sul telefono il controllo risulta già fatto (verrà inviato appena torna internet).
        c.fatto = true;
        c.ultima = { data: dataLeggibile(dati.data), ora: dati.ora, valore: c.tipo === 'temperatura' ? gradi(Number(valore)) : valore,
          esito: fuoriRange(Number(valore), c.min, c.max) && c.tipo === 'temperatura' ? 'FUORI RANGE' : '', note: note, persona: dati.persona };
        stato.haccpDaFare = Math.max(0, (Number(stato.haccpDaFare) || 0) - 1);
      });
    };
    if (senzaInternet()) return inCoda();
    chiama('registraControlloHaccp', [stato.pin, dati], function () {
      togliDallaCoda(dati.id);
      mostraSalvato('Registrato ✓', apriHaccp);
    }, { attesa: 'Salvataggio in corso…', attesaMs: ATTESA_SALVATAGGIO_MS, seRete: inCoda });
  }

  function creaPdfHaccp() {
    var mese = $('haccp-mese').value;
    chiama('esportaHaccpPdf', [stato.pin, mese], function (r) {
      var esito = $('haccp-pdf-esito');
      esito.innerHTML = '<b>✓ PDF pronto</b> (' + (r.righe === 1 ? '1 controllo' : r.righe + ' controlli') + ').<br>' +
        '<a class="link-scontrino" href="' + esc(r.url) + '" target="_blank">Apri ' + esc(r.nome) + '</a>' +
        '<span class="riga-spesa-info">È salvato anche nella cartella «Bar - HACCP» di Google Drive.</span>';
      esito.style.display = 'block';
    }, { attesa: 'Creo il PDF…\n(può volerci qualche secondo)' });
  }


  // -------------------------------------------------------------------------
  // Fornitori: saldo per fornitore e fatture di ognuno
  // -------------------------------------------------------------------------

  function apriFornitori(poi) {
    chiama('saldoFornitori', [stato.pin], function (r) {
      stato.saldo = r;
      if (poi) poi(); else { disegnaFornitori(); mostra('schermo-fornitori'); }
    }, { attesa: 'Calcolo il saldo dei fornitori…' });
  }

  function fornitoriOrdinati() {
    var elenco = (stato.saldo.fornitori || []).slice();
    var o = stato.ordineFornitori;
    elenco.sort(function (a, b) {
      if (o === 'nome') return a.nome.toLowerCase() < b.nome.toLowerCase() ? -1 : 1;
      if (o === 'anno') return (b.totaleAnno - a.totaleAnno) || (b.daPagare - a.daPagare);
      return (b.daPagare - a.daPagare) || (b.totaleAnno - a.totaleAnno);
    });
    return elenco;
  }

  function disegnaFornitori() {
    var r = stato.saldo;
    var t = r.totali || {};
    var conDaPagare = filtra(r.fornitori || [], function (f) { return f.daPagare > 0; }).length;
    $('fornitori-riassunto').innerHTML = '<span class="riassunto-etichetta">Ancora da pagare' +
      (conDaPagare ? ' (' + (conDaPagare === 1 ? '1 fornitore' : conDaPagare + ' fornitori') + ')' : '') + '</span>' +
      '<span class="riassunto-cifra">' + euro(t.daPagare) + '</span>' +
      '<span class="riassunto-nota">Fatture di ' + esc(r.nomeMese) + ': ' + euro(t.mese) + ' · del ' + r.anno + ': ' + euro(t.anno) + '</span>';
    perOgni($('fornitori-ordine').getElementsByTagName('button'), function (b) {
      b.className = b.getAttribute('data-ordine') === stato.ordineFornitori ? 'scelto' : '';
    });
    var contenitore = $('fornitori-elenco');
    contenitore.innerHTML = '';
    var elenco = fornitoriOrdinati();
    if (!elenco.length) {
      contenitore.innerHTML = '<p class="carta lista-vuota">Nessuna fattura quest\'anno. Le fatture arrivano dalla cartella «Bar - Fatture».</p>';
      return;
    }
    perOgni(elenco, function (f) {
      var div = document.createElement('div');
      div.className = 'voce voce-fornitore ' + (f.scaduto ? 'scaduto' : f.daPagare > 0 ? 'da-pagare' : 'pagato');
      var righe = rigaInfo(esc(r.nomeMese) + ': ' + euro(f.totaleMese) + ' · ' + r.anno + ': ' + euro(f.totaleAnno) +
        ' (' + (f.fattureAnno === 1 ? '1 fattura' : f.fattureAnno + ' fatture') + ')') +
        rigaInfo('Già pagato nel ' + r.anno + ': ' + euro(f.pagatoAnno));
      if (f.prossima) {
        righe += '<span class="pillola ' + (f.scaduto ? 'pillola-rossa' : 'pillola-accento') + '">' +
          (f.scaduto ? '⚠ C\'è una fattura scaduta' : 'Prossima scadenza ' + esc(f.prossima) + ' (' + esc(f.quandoProssima) + ')') + '</span>';
      } else if (!(f.daPagare > 0)) {
        righe += '<span class="pillola pillola-verde">✓ Niente da pagare</span>';
      }
      div.innerHTML = testaVoce(esc(f.nome), righe, f.daPagare > 0 ? euro(f.daPagare) + '<span class="sotto-importo">da pagare</span>' : '');
      div.appendChild(bottoneVoce('Vedi le fatture', 'secondario', function () { apriFornitore(f.chiave); }));
      contenitore.appendChild(div);
    });
  }

  /** chiave = P.IVA (o nome in minuscolo se manca): due fornitori con lo stesso nome restano distinti. */
  function apriFornitore(chiave) {
    var f = null;
    perOgni(stato.saldo.fornitori || [], function (x) { if (x.chiave === chiave) f = x; });
    if (!f) { disegnaFornitori(); mostra('schermo-fornitori'); return; }
    var r = stato.saldo;
    setTesto($('fornitore-nome'), f.nome);
    setTesto($('fornitore-piva'), f.piva ? 'P.IVA ' + f.piva : '');
    $('fornitore-totali').innerHTML =
      rigaTotale('Fatture di ' + esc(r.nomeMese), euro(f.totaleMese)) +
      rigaTotale('Fatture del ' + r.anno, euro(f.totaleAnno)) +
      rigaTotale('Già pagato nel ' + r.anno, euro(f.pagatoAnno)) +
      '<tr class="evidenza"><td>Ancora da pagare</td><td class="cifra' + (f.scaduto ? ' negativo' : '') + '">' + euro(f.daPagare) + '</td></tr>';
    setTesto($('fornitore-titolo-fatture'), 'Fatture del ' + r.anno + ' e quelle ancora da pagare (' + f.fatture.length + ')');
    var contenitore = $('fornitore-fatture');
    contenitore.innerHTML = '';
    perOgni(f.fatture, function (ft) {
      var div = document.createElement('div');
      var scaduta = ft.stato === 'da pagare' && ft.giorni !== null && ft.giorni < 0;
      div.className = 'voce voce-fattura ' + (scaduta ? 'scaduta' : ft.stato === 'da pagare' ? 'da-pagare' :
        ft.stato === 'pagata' ? 'pagata' : 'senza-scadenza');
      var pillola;
      if (ft.stato === 'da pagare') {
        pillola = '<span class="pillola ' + (scaduta ? 'pillola-rossa' : 'pillola-accento') + '">' + (scaduta ? '⚠ ' : '') + 'Da pagare' +
          (ft.giorni !== null ? ' – ' + esc(quandoScadenza(ft.giorni)) : '') + '</span>';
      } else if (ft.stato === 'pagata') {
        pillola = '<span class="pillola pillola-verde">✓ Pagata</span>';
      } else {
        pillola = '<span class="pillola pillola-neutra">Non nello scadenzario</span>';
      }
      div.innerHTML = testaVoce('Fattura n. ' + esc(ft.numero), rigaInfo('del ' + esc(ft.data) + (ft.scadenza ? ' · scadenza ' + esc(ft.scadenza) : '')) +
        pillola, euro(ft.totale));
      if (ft.stato === 'da pagare' && ft.idScadenza) {
        div.appendChild(bottoneVoce('Segna pagata', 'verde', function () {
          chiedi('Segnare come pagata?\nFattura n. ' + ft.numero + ' – ' + euro(ft.totale) + '\n' + f.nome, 'Sì, è pagata', 'No', function () {
            chiama('segnaScadenzaPagata', [stato.pin, ft.idScadenza, true, personaValida()], function () {
              mostraSalvato('Pagata ✓', function () {
                apriFornitori(function () { apriFornitore(f.chiave); });
              });
            }, { attesa: 'Salvataggio in corso…' });
          });
        }, ICONA_SPUNTA));
      }
      contenitore.appendChild(div);
    });
    mostra('schermo-fornitore');
  }

  /** Come quandoScade_ del server: "oggi", "domani", "tra 5 giorni", "scaduta da 3 giorni". */
  function quandoScadenza(g) {
    if (g === 0) return 'oggi';
    if (g === 1) return 'domani';
    if (g > 1) return 'tra ' + g + ' giorni';
    if (g === -1) return 'scaduta ieri';
    return 'scaduta da ' + (-g) + ' giorni';
  }


  // -------------------------------------------------------------------------
  // Versamenti e prelievi (movimenti di cassa) e contante teorico
  // -------------------------------------------------------------------------

  var TIPI_MOVIMENTO = ['Versamento in banca', 'Prelievo personale', 'Prelievo per spese'];
  var AIUTO_MOVIMENTO = {
    'Versamento in banca': 'Contanti portati in banca: escono dalla cassa.',
    'Prelievo personale': 'Soldi presi dalla cassa per uso personale.',
    'Prelievo per spese': 'Contanti presi dalla cassa per pagare qualcosa fuori. Attenzione: se poi registri anche quella ' +
      'spesa con pagamento «Contanti», verrebbe tolta due volte dal contante teorico.'
  };

  /** HTML del contante teorico: cifra grande e i pezzi del calcolo (o come impostarlo). */
  function htmlContante(c) {
    if (!c) {
      return '<p class="avviso senza-margine">Per vedere il contante teorico in cassa scrivi <b>«Fondo cassa iniziale (€)»</b> e ' +
        '<b>«Data di partenza del contante in cassa»</b> nella scheda Impostazioni del foglio Google.</p>';
    }
    return '<span class="riassunto-etichetta">Oggi, ' + esc(c.al) + '</span>' +
      '<span class="contante-cifra' + (c.totale < 0 ? ' negativo' : '') + '">' + euro(c.totale) + '</span>' +
      '<table class="totali">' +
      rigaTotale('Fondo cassa iniziale (' + esc(c.partenza) + ')', euro(c.fondo)) +
      rigaTotale('+ Incassi in contanti', euro(c.incassiContanti)) +
      rigaTotale('− Spese pagate in contanti', euro(c.speseContanti)) +
      rigaTotale('− Versamenti in banca', euro(c.versamenti)) +
      rigaTotale('− Prelievi', euro(c.prelievi)) +
      '</table>';
  }

  function apriMovimenti() {
    chiama('movimentiCassa', [stato.pin], function (r) {
      disegnaMovimenti(r);
      mostra('schermo-movimenti');
    }, { attesa: 'Carico i movimenti…' });
  }

  function azzeraMovimento() {
    stato.tipoMovimento = '';
    stato.idMovimento = nuovoId('V');
    $('movimento-importo').value = '';
    $('movimento-nota').value = '';
    $('movimento-data').value = dataDiOggi();
    disegnaTipiMovimento();
  }

  function disegnaTipiMovimento() {
    disegnaPulsanti($('movimento-tipi'), TIPI_MOVIMENTO, function () { return stato.tipoMovimento; }, function (v) {
      stato.tipoMovimento = v;
      setTesto($('movimento-aiuto'), AIUTO_MOVIMENTO[v] || '');
    });
    setTesto($('movimento-aiuto'), AIUTO_MOVIMENTO[stato.tipoMovimento] || '');
  }

  function disegnaMovimenti(r) {
    $('movimenti-contante').innerHTML = htmlContante(r.contante);
    if (!stato.idMovimento || !trim($('movimento-importo').value)) azzeraMovimento();
    var contenitore = $('movimenti-elenco');
    contenitore.innerHTML = '';
    if (!(r.movimenti || []).length) {
      contenitore.innerHTML = '<p class="piccolo vuoto">Nessun movimento registrato.</p>';
      return;
    }
