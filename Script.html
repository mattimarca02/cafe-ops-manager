    perOgni(r.movimenti, function (m) {
      var div = document.createElement('div');
      div.className = 'voce voce-movimento' + (m.tipo === 'Versamento in banca' ? '' : ' prelievo');
      div.innerHTML = testaVoce(esc(m.tipo), rigaInfo(esc(m.data) + (m.persona ? ' · ' + esc(m.persona) : '')) +
        (m.nota ? rigaInfo(esc(m.nota), 'riga-spesa-nota') : ''), euro(m.importo));
      div.appendChild(bottoneVoce('Elimina', 'bottone-elimina', function () {
        chiedi('Vuoi eliminare questo movimento?\n' + m.tipo + ' del ' + m.data + ' – ' + euro(m.importo), 'Sì, elimina', 'No', function () {
          chiama('eliminaMovimentoCassa', [stato.pin, m.id], function () {
            mostraSalvato('Eliminato ✓', apriMovimenti);
          }, { attesa: 'Eliminazione in corso…' });
        });
      }, ICONA_CESTINO));
      contenitore.appendChild(div);
    });
    if (r.altri) {
      var p = document.createElement('p');
      p.className = 'piccolo';
      setTesto(p, 'Gli altri ' + r.altri + ' movimenti sono nella scheda «Movimenti cassa» del foglio.');
      contenitore.appendChild(p);
    }
  }

  function salvaMovimento() {
    var importo = leggiImporto($('movimento-importo').value);
    if (!stato.tipoMovimento) return mostraErrore('Tocca che cosa: versamento in banca, prelievo personale o prelievo per spese.');
    if (importo === null || importo <= 0) return mostraErrore('Scrivi l\'importo. Esempio: 500,00');
    if (!trim($('movimento-data').value)) return mostraErrore('Scrivi la data.');
    var dati = {
      id: stato.idMovimento || nuovoId('V'),
      tipo: stato.tipoMovimento,
      importo: trim($('movimento-importo').value),
      data: trim($('movimento-data').value),
      nota: trim($('movimento-nota').value),
      persona: personaValida()
    };
    var inCoda = function () {
      mettiInCoda({
        chiave: dati.id,
        funzione: 'salvaMovimentoCassa',
        argomenti: [dati],
        descrizione: dati.tipo + ' del ' + dataLeggibile(dati.data) + ' – ' + euro(importo)
      }, azzeraMovimento);
    };
    if (senzaInternet()) return inCoda();
    chiama('salvaMovimentoCassa', [stato.pin, dati], function () {
      togliDallaCoda(dati.id);
      azzeraMovimento();
      mostraSalvato('Salvato ✓', apriMovimenti);
    }, { attesa: 'Salvataggio in corso…', attesaMs: ATTESA_SALVATAGGIO_MS, seRete: inCoda });
  }


  // -------------------------------------------------------------------------
  // Margini dei prodotti (costo per porzione, margine e food cost)
  // -------------------------------------------------------------------------

  var UNITA_MARGINE = [{ valore: 'kg', nome: 'kg' }, { valore: 'l', nome: 'litro' }, { valore: 'pezzo', nome: 'pezzo' }];
  var IVA_MARGINE = [4, 5, 10, 22];

  function aggiornaContatoreMargini() {
    var n = Number(stato.marginiBassi) || 0;
    var el = $('home-margini-numero');
    setTesto(el, String(n));
    el.style.display = n ? 'inline-block' : 'none';
  }

  /** Come fattoreUnita_ del server: kg → 1000 g, l → 1000 ml, cl → 10 ml, il resto 1. */
  function fattoreUnita(unita) {
    var u = String(unita || '').toLowerCase().replace(/[.\s]/g, '');
    if (/^(kg|chilo|chili|chilogrammo|chilogrammi|kilo)$/.test(u)) return 1000;
    if (/^(l|lt|litro|litri)$/.test(u)) return 1000;
    if (/^(cl|centilitro|centilitri)$/.test(u)) return 10;
    return 1;
  }

  /** Stesso calcolo di calcolaMargine_ nel server. */
  function calcolaMargine(p) {
    if (!(p.prezzoAcquisto > 0) || !(p.quantita > 0) || !(p.prezzoVendita > 0)) return null;
    var fattore = fattoreUnita(p.unita);
    var costo = p.prezzoAcquisto / fattore * p.quantita;
    var netto = p.prezzoVendita / (1 + p.iva / 100);
    var margine = netto - costo;
    return { costo: costo, netto: netto, margine: margine, marginePerc: Math.round(margine / netto * 1000) / 10,
      foodCost: Math.round(costo / netto * 1000) / 10 };
  }

  /** 0,126 € per i costi piccoli (tre decimali), altrimenti come euro(). */
  function euroCosto(n) {
    if (Math.abs(n) >= 1) return euro(n);
    return (n < 0 ? '- ' : '') + Math.abs(n).toFixed(3).replace('.', ',') + ' €';
  }

  function percentuale(n) { return String(n).replace('.', ',') + '%'; }

  function etichettaUnita(u) {
    u = String(u || '').toLowerCase();
    return /^k/.test(u) ? 'al kg' : /^(l|lt|litr)/.test(u) ? 'al litro' : 'per ' + u;
  }

  function porzioneDi(u) { return u === 'kg' ? 'g' : u === 'l' ? 'ml' : (u === 'pezzo' ? 'pezzi' : u); }

  function apriMargini() {
    chiama('margini', [stato.pin], function (r) {
      stato.margini = r;
      disegnaMargini();
      mostra('schermo-margini');
    }, { attesa: 'Calcolo i margini…' });
  }

  function disegnaMargini() {
    var r = stato.margini;
    var prodotti = (r.prodotti || []).slice();
    var completi = filtra(prodotti, function (p) { return p.completo; });
    var bassi = filtra(prodotti, function (p) { return p.sottoSoglia; });
    stato.marginiBassi = bassi.length;
    var soglia = percentuale(r.soglia);
    $('margini-riassunto').innerHTML = bassi.length ?
      '<span class="riassunto-etichetta negativo">⚠ ' + (bassi.length === 1 ? '1 prodotto ha' : bassi.length + ' prodotti hanno') +
        ' un margine sotto il ' + soglia + '</span><span class="riassunto-nota">Controlla il prezzo d\'acquisto o quello di vendita. ' +
        'La soglia si cambia in Impostazioni («Margine minimo prodotti (%)»).</span>' :
      '<span class="riassunto-etichetta positivo">✓ ' + (completi.length ? 'Tutti i prodotti sono sopra il ' + soglia + ' di margine.' :
        'Nessun prodotto da controllare.') + '</span><span class="riassunto-nota">Soglia: ' + soglia + ' (Impostazioni).</span>';
    $('margini-riassunto').className = 'riassunto riassunto-interno' + (bassi.length ? '' : ' riassunto-incassi');
    perOgni($('margini-ordine').getElementsByTagName('button'), function (b) {
      b.className = b.getAttribute('data-ordine') === stato.ordineMargini ? 'scelto' : '';
    });
    prodotti.sort(function (a, b) {
      if (a.completo !== b.completo) return a.completo ? -1 : 1;
      if (!a.completo) return a.nome.toLowerCase() < b.nome.toLowerCase() ? -1 : 1;
      return stato.ordineMargini === 'alto' ? b.marginePerc - a.marginePerc : a.marginePerc - b.marginePerc;
    });
    var contenitore = $('margini-elenco');
    contenitore.innerHTML = '';
    if (!prodotti.length) {
      contenitore.innerHTML = '<p class="carta lista-vuota">Nessun prodotto: aggiungilo con «Nuovo prodotto».</p>';
    }
    perOgni(prodotti, function (p) {
      var div = document.createElement('div');
      div.className = 'voce voce-margine' + (!p.completo ? ' incompleto' : p.sottoSoglia ? ' sotto-soglia' : '');
      var righe;
      if (p.completo) {
        righe = rigaInfo('Vendita ' + euro(p.prezzoVendita) + ' (IVA ' + p.iva + '%) · senza IVA ' + euro(p.netto)) +
          rigaInfo('Costo porzione ' + euroCosto(p.costo) + ' (' + String(p.quantita).replace('.', ',') + ' ' + esc(p.quantita === 1 && (p.unitaPorzione || porzioneDi(p.unita)) === 'pezzi' ? 'pezzo' : (p.unitaPorzione || porzioneDi(p.unita))) +
            ' a ' + euroCosto(p.prezzoAcquisto) + ' ' + esc(etichettaUnita(p.unita)) + ')') +
          rigaInfo('<b>Margine ' + euroCosto(p.margine) + ' a porzione</b> · food cost ' + percentuale(p.foodCost)) +
          (p.sottoSoglia ? '<span class="pillola pillola-rossa">⚠ Margine sotto il ' + percentuale(stato.margini.soglia) + '</span>' : '');
      } else {
        righe = '<span class="pillola pillola-neutra">Da completare: ' + esc((p.mancano || []).join(', ')) + '</span>';
      }
      div.innerHTML = testaVoce(esc(p.nome), righe, p.completo ? '<span class="' + (p.sottoSoglia ? 'negativo' : '') + '">' +
        percentuale(p.marginePerc) + '</span><span class="sotto-importo">margine</span>' : '');
      div.appendChild(bottoneVoce('Modifica', 'secondario', function () { apriProdottoMargine(p); }, ICONA_MATITA));
      contenitore.appendChild(div);
    });
  }

  function apriProdottoMargine(p) {
    stato.prodottoMargine = p ? { id: p.id, unita: p.unita, iva: p.iva } : { id: '', unita: 'kg', iva: 10 };
    // L'unità scritta nel foglio resta com'è (es. «cl», «confezione»): compare come scelta in più.
    if (!trim(stato.prodottoMargine.unita)) stato.prodottoMargine.unita = 'pezzo';
    setTesto($('pm-titolo'), p ? 'Modifica prodotto' : 'Nuovo prodotto');
    $('schermo-prodotto-margine').setAttribute('data-titolo', p ? 'Modifica prodotto' : 'Nuovo prodotto');
    $('pm-nome').value = p ? p.nome : '';
    $('pm-prezzo').value = p && p.prezzoAcquisto ? String(p.prezzoAcquisto).replace('.', ',') : '';
    $('pm-quantita').value = p && p.quantita ? String(p.quantita).replace('.', ',') : '';
    $('pm-vendita').value = p && p.prezzoVendita ? numeroPerCampo(p.prezzoVendita) : '';
    disegnaScelteMargine();
    aggiornaAnteprimaMargine();
    mostra('schermo-prodotto-margine');
  }

  function disegnaScelteMargine() {
    var pm = stato.prodottoMargine;
    var contenitore = $('pm-unita');
    contenitore.innerHTML = '';
    var unita = UNITA_MARGINE.slice();
    if (!filtra(unita, function (u) { return u.valore === pm.unita; }).length) unita.push({ valore: pm.unita, nome: pm.unita });
    perOgni(unita, function (u) {
      var b = document.createElement('button');
      b.type = 'button';
      setTesto(b, u.nome);
      if (u.valore === pm.unita) b.className = 'scelto';
      b.onclick = function () { pm.unita = u.valore; disegnaScelteMargine(); aggiornaAnteprimaMargine(); };
      contenitore.appendChild(b);
    });
    var iva = $('pm-iva');
    iva.innerHTML = '';
    perOgni(IVA_MARGINE, function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      setTesto(b, v + '%');
      if (v === Number(pm.iva)) b.className = 'scelto';
      b.onclick = function () { pm.iva = v; disegnaScelteMargine(); aggiornaAnteprimaMargine(); };
      iva.appendChild(b);
    });
    var f = fattoreUnita(pm.unita);
    setTesto($('pm-quantita-etichetta'), 'Quantità per porzione (' +
      (f === 1000 && !/^(l|lt|litr)/i.test(pm.unita) ? 'grammi' : f > 1 ? 'millilitri' : 'pezzi') + ')');
  }

  /** Numero con anche tre o quattro decimali (prezzi al kg, grammi): "18,456" → 18.456. */
  function leggiNumero(testo) {
    var s = trim(testo).replace(/[€\s]/g, '');
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    return /^\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
  }

  function datiProdottoMargine() {
    var pm = stato.prodottoMargine;
    return { prezzoAcquisto: leggiNumero($('pm-prezzo').value), quantita: leggiNumero($('pm-quantita').value),
      prezzoVendita: leggiImporto($('pm-vendita').value), unita: pm.unita, iva: Number(pm.iva) };
  }

  /** Anteprima mentre si scrive: margine e food cost, rossa se sotto la soglia. */
  function aggiornaAnteprimaMargine() {
    var m = calcolaMargine(datiProdottoMargine());
    var box = $('pm-anteprima');
    if (!m) { box.style.display = 'none'; return; }
    var soglia = stato.margini ? stato.margini.soglia : 60;
    var basso = m.marginePerc < soglia;
    box.className = 'quadratura ' + (basso ? 'quadratura-ammanco' : 'quadratura-ok');
    setTesto($('pm-anteprima-titolo'), (basso ? '⚠ ' : '') + 'Margine ' + percentuale(m.marginePerc) + ' (' + euroCosto(m.margine) + ' a porzione)');
    setTesto($('pm-anteprima-testo'), 'Costo porzione ' + euroCosto(m.costo) + ' · food cost ' + percentuale(m.foodCost) +
      (basso ? ' · sotto la soglia del ' + percentuale(soglia) : ''));
    box.style.display = 'block';
  }

  function salvaProdottoMargine() {
    var d = datiProdottoMargine();
    var nome = trim($('pm-nome').value);
    if (!nome) return mostraErrore('Scrivi il nome del prodotto.');
    if (!(d.prezzoAcquisto > 0)) return mostraErrore('Scrivi il prezzo d\'acquisto. Esempio: 18,00 (al kg)');
    if (!(d.quantita > 0)) return mostraErrore('Scrivi la quantità per porzione. Esempio: 7 (grammi di caffè per tazzina)');
    if (!(d.prezzoVendita > 0)) return mostraErrore('Scrivi il prezzo di vendita. Esempio: 1,20');
    chiama('salvaProdottoMargine', [stato.pin, {
      id: stato.prodottoMargine.id, nome: nome, prezzoAcquisto: trim($('pm-prezzo').value), unita: d.unita,
      quantita: trim($('pm-quantita').value), prezzoVendita: trim($('pm-vendita').value), iva: d.iva
    }], function (r) {
      stato.margini = r;
      mostraSalvato('Salvato ✓', function () {
        disegnaMargini();
        mostra('schermo-margini');
      });
    }, { attesa: 'Salvataggio in corso…' });
  }

  // -------------------------------------------------------------------------
  // Coda offline: salvataggi fatti senza internet, inviati appena torna la rete
  // -------------------------------------------------------------------------
  //
  // Ogni voce: { chiave (= ID della spesa/chiusura), funzione, argomenti,
  // descrizione, creata, errore, conflitto }. L'ID è lo stesso usato dal
  // server per riconoscere i doppioni: se una voce viene inviata due volte
  // (perché la risposta si era persa) il server non la salva di nuovo.

  var invioCoda = { inCorso: false, manuale: false, inviate: 0, totale: 0, provate: {} };

  function leggiCoda() {
    try {
      var testo = window.localStorage.getItem(CHIAVE_CODA);
      var coda = testo ? JSON.parse(testo) : [];
      return coda && typeof coda.length === 'number' ? coda : [];
    } catch (e) {
      return [];
    }
  }

  /** Scrive la coda sul dispositivo; false se lo spazio è finito o non è permesso. */
  function scriviCoda(coda) {
    try {
      if (coda.length) window.localStorage.setItem(CHIAVE_CODA, JSON.stringify(coda));
      else window.localStorage.removeItem(CHIAVE_CODA);
      return true;
    } catch (e) {
      return false;
    }
  }

  function aggiungiInCoda(voce) {
    var coda = filtra(leggiCoda(), function (v) { return v.chiave !== voce.chiave; });
    coda.push(voce);
    return scriviCoda(coda);
  }

  function togliDallaCoda(chiave) {
    var coda = leggiCoda();
    var resto = filtra(coda, function (v) { return v.chiave !== chiave; });
    if (resto.length !== coda.length) scriviCoda(resto);
    aggiornaBarraCoda();
  }

  function aggiornaVoceCoda(chiave, campi) {
    var coda = leggiCoda();
    perOgni(coda, function (v) {
      if (v.chiave !== chiave) return;
      for (var k in campi) {
        if (campi.hasOwnProperty(k)) v[k] = campi[k];
      }
    });
    scriviCoda(coda);
  }

  function daInviare(v) { return !v.errore && !v.conflitto; }

  /** Mette il salvataggio nella coda (foto rimpicciolita) e avvisa chiaramente. */
  function mettiInCoda(voce, seFatto) {
    voce.creata = new Date().getTime();
    voce.errore = '';
    voce.conflitto = '';
    var dati = voce.argomenti[0];
    var ePdf = dati.fotoTipo === 'application/pdf';
    var riuscito = function () {
      if (seFatto) seFatto();
      aggiornaBarraCoda();
      mostraInCoda(voce);
    };
    var prosegui = function () {
      if (aggiungiInCoda(voce)) return riuscito();
      if (!dati.foto) return mostraErrore(MSG_SPAZIO_FINITO, function () { mettiInCoda(voce, seFatto); });
      chiedi('Manca internet e sul dispositivo non c\'è abbastanza spazio per tenere anche ' +
        (ePdf ? 'il file PDF' : 'la foto') + ' finché torna la connessione.\n\n' +
        'Vuoi salvare la spesa SENZA ' + (ePdf ? 'il file' : 'la foto') + '?\n' +
        'Nella nota verrà scritto «foto da rifare»: potrai aggiungerla dopo.',
        'Sì, salva senza ' + (ePdf ? 'file' : 'foto'), 'No, torna indietro', function () {
          dati.foto = '';
          dati.fotoTipo = '';
          if (dati.fotoAzione === 'sostituisci') dati.fotoAzione = 'tieni';
          dati.nota = trim(dati.nota + ' (foto da rifare)');
          voce.descrizione += ' (senza foto)';
          if (aggiungiInCoda(voce)) riuscito();
          else mostraErrore(MSG_SPAZIO_FINITO);
        });
    };
    if (dati.foto && dati.fotoTipo === 'image/jpeg') {
      mostraAttesa('Salvo sul dispositivo…');
      ricomprimiFoto(dati.foto, function (piccola) {
        dati.foto = piccola;
        prosegui();
      });
    } else {
      prosegui();
    }
  }

  /** Foto più piccola per occupare meno spazio sul dispositivo (se non ci riesce, tiene quella di prima). */
  function ricomprimiFoto(dataUrl, seFatto) {
    var img = new Image();
    img.onload = function () {
      var risultato = dataUrl;
      try {
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scala = Math.min(1, LATO_MAX_FOTO_CODA / Math.max(w, h));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(w * scala);
        canvas.height = Math.round(h * scala);
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var piccola = canvas.toDataURL('image/jpeg', QUALITA_FOTO_CODA);
        if (piccola.length < dataUrl.length) risultato = piccola;
      } catch (e) {
        risultato = dataUrl;
      }
      seFatto(risultato);
    };
    img.onerror = function () { seFatto(dataUrl); };
    img.src = dataUrl;
  }

  function mostraInCoda(voce) {
    var cosa = voce.funzione === 'salvaChiusura' ? 'La chiusura cassa è salvata' :
      voce.funzione === 'salvaSpesa' ? 'La spesa è salvata' :
      voce.funzione === 'registraControlloHaccp' ? 'Il controllo è salvato' :
      voce.funzione === 'salvaMovimentoCassa' ? 'Il movimento è salvato' : 'La modifica è salvata';
    $('in-coda-testo').innerHTML = '<b>Manca internet.</b><br>' + esc(cosa) +
      ' sul dispositivo e verrà inviata da sola appena torna la connessione.';
    $('in-coda-ok').onclick = function () { mostra('schermo-home'); };
    mostraPannello('pannello-in-coda');
  }

  /** Invia le voci in attesa, una alla volta. manuale = premuto «Invia ora». */
  function inviaCoda(manuale) {
    if (invioCoda.inCorso || !stato.pin) return;
    var pronte = filtra(leggiCoda(), daInviare);
    if (!pronte.length) {
      if (manuale) mostraCoda();
      return;
    }
    if (manuale && senzaInternet()) {
      mostraErrore('Il dispositivo è ancora senza internet.\nControlla il Wi-Fi o i dati mobili.\nI dati restano salvati sul dispositivo.');
      return;
    }
    invioCoda.inCorso = true;
    invioCoda.manuale = !!manuale;
    invioCoda.inviate = 0;
    invioCoda.totale = pronte.length;
    invioCoda.provate = {};
    if (manuale) mostraAttesa('Invio in corso…');
    aggiornaBarraCoda();
    inviaProssima();
  }

  function inviaProssima() {
    var voce = null;
    perOgni(leggiCoda(), function (v) {
      if (!voce && daInviare(v) && !invioCoda.provate[v.chiave]) voce = v;
    });
    if (!voce) return fineInvioCoda('');
    invioCoda.provate[voce.chiave] = true;
    if (invioCoda.manuale) {
      setTesto($('attesa-testo'), 'Invio in corso… (' + (invioCoda.inviate + 1) + ' di ' + invioCoda.totale + ')');
    }
    var finito = false;
    var conFile = !!(voce.argomenti[0] && voce.argomenti[0].foto);
    var timer = setTimeout(function () {
      if (finito) return;
      finito = true;
      fineInvioCoda(MSG_RETE_CODA);
    }, conFile ? 120000 : 45000);

    var esecutore = google.script.run
      .withSuccessHandler(function (r) {
        if (finito) return;
        finito = true;
        clearTimeout(timer);
        if (r && r.ok) {
          svuotaCacheCopertura();
          togliDallaCoda(voce.chiave);
          invioCoda.inviate++;
          return inviaProssima();
        }
        if (!r) return fineInvioCoda('Il server non ha risposto. Riprova tra poco.');
        if (r.pinErrato) return fineInvioCoda('pin');
        if (r.tecnico) return fineInvioCoda(r.messaggio || 'Problema tecnico. Riprova tra poco.');
        if (r.esiste) aggiornaVoceCoda(voce.chiave, { conflitto: r.messaggio || 'C\'è già un dato per questo giorno.' });
        else aggiornaVoceCoda(voce.chiave, { errore: r.messaggio || 'Il server non ha accettato questi dati.' });
        inviaProssima();
      })
      .withFailureHandler(function () {
        if (finito) return;
        finito = true;
        clearTimeout(timer);
        fineInvioCoda(MSG_RETE_CODA);
      });
    esecutore[voce.funzione].apply(esecutore, [stato.pin].concat(voce.argomenti));
  }

  function fineInvioCoda(problema) {
    var manuale = invioCoda.manuale;
    var inviate = invioCoda.inviate;
    invioCoda.inCorso = false;
    invioCoda.manuale = false;
    aggiornaBarraCoda();
    if (stato.schermo === 'schermo-coda') disegnaCoda();
    if (problema === 'pin') {
      // PIN non più valido: smetto subito di riprovare (ogni tentativo sbagliato conta per il
      // blocco di 15 minuti, che vale per tutti i dispositivi) e chiedo quello nuovo.
      dimenticaPin();
      stato.pin = '';
      mostraSchermoPin('Il PIN è cambiato: scrivi quello nuovo. I dati in attesa non sono stati persi.');
      return;
    }
    if (!manuale) return; // invio automatico: basta la barra in alto
    var daControllare = filtra(leggiCoda(), function (v) { return !daInviare(v); }).length;
    var fatto = inviate ? (inviate === 1 ? 'Inviato 1 dato.' : 'Inviati ' + inviate + ' dati.') + '\n' : '';
    if (problema) {
      mostraErrore(fatto + problema, function () { inviaCoda(true); }, function () { mostraCoda(); });
    } else if (daControllare) {
      mostraCoda();
    } else {
      mostraSalvato(inviate === 1 ? 'Inviato ✓' : 'Inviati ✓', function () { mostra('schermo-home'); });
    }
  }

  /** Barra in alto: "N in attesa di invio" con «Invia ora» e «Vedi». */
  function aggiornaBarraCoda() {
    var barra = $('barra-coda');
    if (!barra) return;
    var coda = leggiCoda();
    var attesa = filtra(coda, daInviare).length;
    var controllare = coda.length - attesa;
    var pannelloAperto = $('schermi').style.display === 'none';
    if (!coda.length || pannelloAperto || !stato.schermo || stato.schermo === 'schermo-pin' ||
        stato.schermo === 'schermo-avvio' || stato.schermo === 'schermo-coda') {
      barra.style.display = 'none';
      return;
    }
    var testo = '';
    if (invioCoda.inCorso) testo = 'Invio in corso…';
    else if (attesa) testo = attesa === 1 ? '1 in attesa di invio' : attesa + ' in attesa di invio';
    if (controllare) testo += (testo ? ' · ' : '') + controllare + ' da controllare';
    setTesto($('barra-coda-testo'), testo);
    barra.className = 'barra-coda' + (controllare ? ' da-controllare' : '');
    $('barra-coda-invia').style.display = attesa && !invioCoda.inCorso ? 'inline-block' : 'none';
    barra.style.display = 'block';
  }

  function mostraCoda() {
    disegnaCoda();
    mostra('schermo-coda');
  }

  function disegnaCoda() {
    var coda = leggiCoda();
    var contenitore = $('coda-elenco');
    contenitore.innerHTML = '';
    $('coda-invia').style.display = filtra(coda, daInviare).length ? 'block' : 'none';
    if (!coda.length) {
      contenitore.innerHTML = '<p class="carta lista-vuota positivo">Non c\'è niente in attesa: tutto è stato inviato ✓</p>';
      setTesto($('coda-spazio'), '');
      return;
    }
    perOgni(coda, function (v) {
      var div = document.createElement('div');
      var dati = v.argomenti[0] || {};
      div.className = 'voce' + (v.conflitto || v.errore ? ' da-controllare' : '');
      var h = '';
      if (dati.foto) h += rigaInfo('Con ' + (dati.fotoTipo === 'application/pdf' ? 'file PDF' : 'foto'));
      if (v.conflitto) h += '<span class="voce-problema">' + esc(v.conflitto) + '</span>';
      else if (v.errore) h += '<span class="voce-problema">Non accettato: ' + esc(v.errore) + '</span>';
      else h += '<span class="pillola pillola-accento">In attesa di invio</span>';
      div.innerHTML = testaVoce(esc(v.descrizione), h, '');
      if (v.errore) {
        div.appendChild(bottoneVoce('Riprova a inviare', 'primario', function () {
          aggiornaVoceCoda(v.chiave, { errore: '' });
          inviaCoda(true);
        }, ICONA_INVIA));
      }
      if (v.conflitto) {
        div.appendChild(bottoneVoce('Sì, sostituisci quella già salvata', 'primario', function () {
          v.argomenti[1] = true;
          aggiornaVoceCoda(v.chiave, { conflitto: '', argomenti: v.argomenti });
          inviaCoda(true);
        }));
      }
      div.appendChild(bottoneVoce(v.conflitto ? 'No, tieni quella già salvata' : 'Elimina',
        v.conflitto ? 'secondario' : 'bottone-elimina', function () {
        var msg = v.conflitto ? 'Questo dato verrà eliminato dal dispositivo e resterà quello già salvato.' :
          'Vuoi eliminare questo dato dal dispositivo?\nNon verrà più inviato.';
        chiedi(msg + '\n\n' + v.descrizione, 'Sì, elimina', 'No', function () {
          togliDallaCoda(v.chiave);
          mostraCoda();
        });
      }, v.conflitto ? '' : ICONA_CESTINO));
      contenitore.appendChild(div);
    });
    var usato = 0;
    try { usato = (window.localStorage.getItem(CHIAVE_CODA) || '').length; } catch (e) { usato = 0; }
    setTesto($('coda-spazio'), 'Spazio usato sul dispositivo: circa ' + Math.max(1, Math.round(usato / 1024)) + ' KB.');
  }

  /** Pulsante dentro una voce; icona facoltativa (SVG) prima del testo. */
  function bottoneVoce(testo, classe, alClic, iconaSvg) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = classe + ' bottone-voce';
    b.innerHTML = (iconaSvg || '') + esc(testo);
    b.onclick = alClic;
    return b;
  }

  function avviaControlliCoda() {
    aggiungiEvento(window, 'online', function () {
      setTimeout(function () { inviaCoda(false); }, 1500);
    });
    aggiungiEvento(window, 'offline', aggiornaBarraCoda);
    setInterval(function () {
      if (stato.pin && leggiCoda().length && !senzaInternet()) inviaCoda(false);
    }, INTERVALLO_CODA_MS);
  }

  // -------------------------------------------------------------------------
  // Collegamento dei pulsanti
  // -------------------------------------------------------------------------

  function inizializza() {
    if (!campoDataSupportato) {
      perOgni(['spesa-data', 'spesa-scadenza', 'chiusura-data', 'ns-data', 'movimento-data'], function (id) {
        $(id).setAttribute('placeholder', 'gg/mm/aaaa');
      });
    }

    perOgni($('schermo-pin').getElementsByTagName('button'), function (b) {
      b.onclick = function () { premiTastoPin(b.getAttribute('data-cifra')); };
    });

    $('vai-spesa').onclick = apriSpesa;
    $('vai-chiusura').onclick = apriChiusura;
    $('vai-riepilogo').onclick = function () { apriRiepilogo(0, 0); };
    $('vai-elenco').onclick = function () { apriElencoDi('spese'); };
    $('vai-scadenze').onclick = apriScadenze;
    $('vai-ordini').onclick = apriOrdini;
    $('vai-haccp').onclick = apriHaccp;
    // Barra in basso e pagine Spese, Cassa, Altro
    perOgni(['nav-home', 'nav-spese', 'nav-cassa', 'nav-altro'], function (id) {
      $(id).onclick = function () { mostra($(id).getAttribute('data-scheda')); };
    });
    $('spese-nuova').onclick = apriSpesa;
    $('spese-scadenze').onclick = apriScadenze;
    $('cassa-chiusura').onclick = apriChiusura;
    $('cassa-elenco').onclick = function () { apriElencoDi('chiusure'); };
    $('altro-haccp').onclick = apriHaccp;
    $('altro-ordini').onclick = apriOrdini;
    $('altro-margini').onclick = apriMargini;
    $('altro-coda').onclick = mostraCoda;
    $('altro-persona').onclick = function () {
      mostraSceltaPersona(function () { mostra('schermo-altro'); });
    };
    $('vai-movimenti').onclick = apriMovimenti;
    $('vai-margini').onclick = apriMargini;
    $('margini-nuovo').onclick = function () { apriProdottoMargine(null); };
    perOgni($('margini-ordine').getElementsByTagName('button'), function (b) {
      b.onclick = function () {
        stato.ordineMargini = b.getAttribute('data-ordine');
        disegnaMargini();
      };
    });
    perOgni(['pm-prezzo', 'pm-quantita', 'pm-vendita'], function (id) {
      aggiungiEvento($(id), 'input', aggiornaAnteprimaMargine);
      aggiungiEvento($(id), 'keyup', aggiornaAnteprimaMargine);
    });
    $('pm-salva').onclick = salvaProdottoMargine;
    $('pm-annulla').onclick = function () { mostra('schermo-margini'); };
    $('pm-indietro').onclick = function () { mostra('schermo-margini'); };
    $('movimento-salva').onclick = salvaMovimento;
    $('vai-fornitori').onclick = function () { apriFornitori(); };
    perOgni($('fornitori-ordine').getElementsByTagName('button'), function (b) {
      b.onclick = function () {
        stato.ordineFornitori = b.getAttribute('data-ordine');
        disegnaFornitori();
      };
    });
    $('fornitore-indietro').onclick = function () { disegnaFornitori(); mostra('schermo-fornitori'); };
    $('fornitore-torna').onclick = function () { disegnaFornitori(); mostra('schermo-fornitori'); };
    $('haccp-pdf').onclick = creaPdfHaccp;
    $('haccp-persona-cambia').onclick = function () {
      mostraSceltaPersona(function () {
        mostra('schermo-haccp');
        disegnaPersonaHaccp();
      });
    };
    $('ordini-nuovo').onclick = apriNuovoProdotto;
    aggiungiEvento($('ordini-cerca'), 'input', disegnaProdotti);
    aggiungiEvento($('ordini-cerca'), 'keyup', disegnaProdotti);
    $('np-salva').onclick = salvaNuovoProdotto;
    $('np-annulla').onclick = function () { mostra('schermo-ordini'); };
    $('np-indietro').onclick = function () { mostra('schermo-ordini'); };
    $('np-fornitore').onchange = function () {
      var nuovo = $('np-fornitore').value === '__nuovo__';
      $('np-riquadro-fornitore-nuovo').style.display = nuovo ? 'block' : 'none';
      if (nuovo) { try { $('np-fornitore-nuovo').focus(); } catch (e) { /* niente */ } }
    };
    $('np-subito').onclick = function () {
      stato.prodottoSubito = !stato.prodottoSubito;
      $('np-subito').className = stato.prodottoSubito ? 'scelto' : '';
      setTesto($('np-subito'), stato.prodottoSubito ? 'Mettilo subito nella lista da ordinare' : 'Non metterlo ancora nella lista');
    };
    $('scadenze-nuova').onclick = apriNuovaScadenza;
    $('scadenze-fisse').onclick = apriScadenzeFisse;
    $('sf-indietro').onclick = apriScadenze;
    $('sf-torna').onclick = apriScadenze;
    $('ns-salva').onclick = salvaNuovaScadenza;
    $('ns-annulla').onclick = function () { mostra('schermo-scadenze'); };
    $('ns-indietro').onclick = function () { mostra('schermo-scadenze'); };
    $('home-persona-cambia').onclick = function () { mostraSceltaPersona(); };
    $('persona-salta').onclick = function () {
      stato.personaSaltata = true;
      mostra('schermo-home');
    };
    $('esci').onclick = function () {
      chiedi('Vuoi uscire? Al prossimo accesso dovrai scrivere di nuovo il PIN.', 'Sì, esci', 'No', function () {
        dimenticaPin();
        stato.pin = '';
        mostraSchermoPin('');
      });
    };

    perOgni(document.getElementsByTagName('button'), function (b) {
      var classi = ' ' + b.className + ' ';
      if (classi.indexOf(' torna-home ') >= 0) {
        b.onclick = function () { mostra('schermo-home'); };
      }
      if (classi.indexOf(' torna-su ') >= 0) {
        b.onclick = function () { tornaSu(b); };
      }
      if (classi.indexOf(' mostra-altro ') >= 0) collegaMostraAltro(b);
    });

    collegaRicercaFornitore();
    $('spesa-scadenza-7').onclick = function () { $('spesa-scadenza').value = dataTraGiorni(7); aggiornaScadenzaSpesa(); };
    $('spesa-scadenza-30').onclick = function () { $('spesa-scadenza').value = dataTraGiorni(30); aggiornaScadenzaSpesa(); };
    $('spesa-scadenza-togli').onclick = function () { $('spesa-scadenza').value = ''; aggiornaScadenzaSpesa(); };
    $('spesa-scadenza').onchange = aggiornaScadenzaSpesa;
    $('spesa-scadenza').oninput = aggiornaScadenzaSpesa;
    $('spesa-salva').onclick = salvaSpesa;
    $('spesa-indietro').onclick = esciDaSpesa;
    $('spesa-annulla').onclick = esciDaSpesa;
    $('foto-file').onchange = function () { fileScelto(this); };
    $('foto-togli').onclick = togliFile;
    $('foto-esistente-togli').onclick = function () {
      stato.fotoAzione = 'togli';
      aggiornaFotoEsistente();
    };
    $('foto-tolta-annulla').onclick = function () {
      stato.fotoAzione = 'tieni';
      aggiornaFotoEsistente();
    };

    perOgni(['chiusura-contanti', 'chiusura-pos', 'chiusura-registratore'], function (id) {
      aggiungiEvento($(id), 'input', aggiornaTotaleChiusura);
      aggiungiEvento($(id), 'keyup', aggiornaTotaleChiusura);
    });
    aggiungiEvento($('chiusura-note'), 'input', function () {
      if (trim($('chiusura-note').value)) $('chiusura-note').className = '';
    });
    $('chiusura-salva').onclick = function () { salvaChiusura(false); };
    $('chiusura-indietro').onclick = esciDaChiusura;
    $('chiusura-annulla').onclick = esciDaChiusura;

    perOgni($('elenco-tipo').getElementsByTagName('button'), function (b) {
      b.onclick = function () {
        // Cambiando tra spese e chiusure resta solo il mese: gli altri filtri non avrebbero senso.
        stato.elenco = {
          tipo: b.getAttribute('data-tipo'), mese: $('elenco-mese').value || '', categoria: '', pagamento: '', testo: '',
          persona: $('elenco-persona').value || ''
        };
        $('elenco-testo').value = '';
        cercaElenco();
      };
    });
    $('elenco-cerca').onclick = function () { leggiFiltriElenco(); cercaElenco(); };
    aggiungiEvento($('elenco-testo'), 'keydown', function (e) {
      if ((e.keyCode || e.which) === 13) {
        try { $('elenco-testo').blur(); } catch (err) { /* niente */ }
        leggiFiltriElenco();
        cercaElenco();
      }
    });
    perOgni(['elenco-mese', 'elenco-categoria', 'elenco-pagamento', 'elenco-persona'], function (id) {
      $(id).onchange = function () { leggiFiltriElenco(); cercaElenco(); };
    });
    $('elenco-azzera').onclick = function () {
      stato.elenco = { tipo: stato.elenco.tipo, mese: '', categoria: '', pagamento: '', testo: '', persona: '' };
      $('elenco-testo').value = '';
      cercaElenco();
    };

    $('mese-prima').onclick = function () { cambiaMese(-1); };
    $('grafico-mesi-numeri').onclick = function () {
      var t = $('tabella-mesi');
      var aperta = t.style.display === 'block';
      t.style.display = aperta ? 'none' : 'block';
      setTesto($('grafico-mesi-numeri'), aperta ? 'Vedi i numeri mese per mese' : 'Nascondi i numeri');
    };
    $('mese-dopo').onclick = function () { cambiaMese(1); };
    perOgni($('cop-periodi').getElementsByTagName('button'), function (b) {
      b.onclick = function () { scegliPeriodoCopertura(b.getAttribute('data-periodo')); };
    });
    perOgni($('cop-filtro').getElementsByTagName('button'), function (b) {
      b.onclick = function () { scegliFiltroCopertura(b.getAttribute('data-filtro')); };
    });
    $('cop-prima').onclick = function () { spostaPeriodoCopertura(-1); };
    $('cop-dopo').onclick = function () { spostaPeriodoCopertura(1); };
    $('cop-applica').onclick = applicaPeriodoPersonalizzato;
    if (!campoDataSupportato) {
      $('cop-da').setAttribute('placeholder', 'gg/mm/aaaa');
      $('cop-a').setAttribute('placeholder', 'gg/mm/aaaa');
    }
    stato.riepilogoSezione = leggiSezioneRiepilogo();
    perOgni(SEZIONI_RIEPILOGO, function (chiave) {
      $('testa-' + chiave).onclick = function () { alternaSezioneRiepilogo(chiave); };
    });

    $('barra-coda-invia').onclick = function () { inviaCoda(true); };
    $('barra-coda-vedi').onclick = mostraCoda;
    $('coda-invia').onclick = function () { inviaCoda(true); };
    avviaControlliCoda();

    controllaRotazioneAutomatica();
    avvia();
  }

  inizializza();
})();
</script>
