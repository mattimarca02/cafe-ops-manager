  /* Numeri del mese: su telefono una carta con tre righe, su tablet tre box */
  .numeri {

  table.totali {

  /* Sezioni a fisarmonica */

  /* ---------------------------------------------------------------------

  .voce {

  .link-scontrino {

  /* Rotella di attesa */
  .rotella {
    width: 40px;
    height: 40px;
    margin: 8px auto 16px auto;
    border: 4px solid #ebe3d9;
    border-top-color: #b4561b;
    border-radius: 50%;
    -webkit-animation: gira 0.9s linear infinite;
    animation: gira 0.9s linear infinite;
  }

    display: inline-block;
    vertical-align: middle;
    width: 18px;
    height: 18px;
    margin: 0 8px 0 0;
    border-width: 3px;
  }
  @-webkit-keyframes gira {
    from { -webkit-transform: rotate(0deg); }
    to { -webkit-transform: rotate(360deg); }
  }
  @keyframes gira {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
